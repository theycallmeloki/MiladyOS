        // Initialize Three.js
        function initThree() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x0a0a0a, 1, 100);
            
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / 2 / window.innerHeight,
                0.1,
                1000
            );
            camera.position.z = 30;
            camera.position.y = 10;
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth / 2, window.innerHeight);
            renderer.setClearColor(0x0a0a0a);
            document.getElementById('three-container').appendChild(renderer.domElement);

            // Add lighting
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x00ff41, 2, 100);
            pointLight.position.set(0, 20, 0);
            scene.add(pointLight);

            const pointLight2 = new THREE.PointLight(0xff00ff, 1, 100);
            pointLight2.position.set(-20, 10, 20);
            scene.add(pointLight2);

            animate();
        }

        // Create 3D components based on stage
        function create3DStage(stageIndex) {
            // Clear existing components
            components.forEach(comp => scene.remove(comp));
            components = [];

            const stage = stages[stageIndex];
            const componentCount = stage.components.length;
            
            // Create main platform
            const platformGeometry = new THREE.BoxGeometry(20, 1, 20);
            const platformMaterial = new THREE.MeshPhongMaterial({ 
                color: 0x00ff41,
                emissive: 0x00ff41,
                emissiveIntensity: 0.2
            });
            const platform = new THREE.Mesh(platformGeometry, platformMaterial);
            platform.position.y = -5;
            scene.add(platform);
            components.push(platform);

            // Create components based on stage
            stage.components.forEach((comp, index) => {
                const angle = (index / componentCount) * Math.PI * 2;
                const radius = 10;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;

                let geometry, material, mesh;

                switch(comp) {
                    case 'jenkins':
                        geometry = new THREE.BoxGeometry(3, 3, 3);
                        material = new THREE.MeshPhongMaterial({ 
                            color: 0xd33833,
                            emissive: 0x330808,
                            emissiveIntensity: 0.2
                        });
                        break;
                    case 'docker':
                    case 'docker-buildx':
                        geometry = new THREE.CylinderGeometry(1.5, 1.5, 3, 8);
                        material = new THREE.MeshPhongMaterial({ 
                            color: 0x2496ed,
                            emissive: 0x0a3a5c,
                            emissiveIntensity: 0.3
                        });
                        break;
                    case 'kubernetes':
                    case 'argocd':
                        geometry = new THREE.OctahedronGeometry(2);
                        material = new THREE.MeshPhongMaterial({ 
                            color: 0x326ce5,
                            emissive: 0x1a3b7a,
                            emissiveIntensity: 0.4
                        });
                        break;
                    case 'gpu-cluster':
                    case 'nvidia-runtime':
                    case 'nvidia-gpu-operator':
                        geometry = new THREE.BoxGeometry(2, 4, 1);
                        material = new THREE.MeshPhongMaterial({ 
                            color: 0x76b900,
                            emissive: 0x3d5c00,
                            emissiveIntensity: 0.6
                        });
                        break;
                    case 'vllm':
                    case 'ml-pipelines':
                        geometry = new THREE.ConeGeometry(2, 4, 6);
                        material = new THREE.MeshPhongMaterial({ 
                            color: 0xff6b35,
                            emissive: 0x7a3419,
                            emissiveIntensity: 0.4
                        });
                        break;
                    case 'longhorn':
                        geometry = new THREE.TorusGeometry(2, 0.5, 8, 16);
                        material = new THREE.MeshPhongMaterial({ 
                            color: 0xf39800,
                            emissive: 0x7a4c00,
                            emissiveIntensity: 0.3
                        });
                        break;
                    case 'mcp':
                    case 'litellm':
                        geometry = new THREE.SphereGeometry(2, 16, 16);
                        material = new THREE.MeshPhongMaterial({ 
                            color: 0xff00ff,
                            emissive: 0x7a007a,
                            emissiveIntensity: 0.5,
                            wireframe: stageIndex >= 3
                        });
                        break;
                    case 'prometheus':
                    case 'grafana':
                        geometry = new THREE.DodecahedronGeometry(2);
                        material = new THREE.MeshPhongMaterial({ 
                            color: comp === 'prometheus' ? 0xe6522c : 0xf46800,
                            emissive: comp === 'prometheus' ? 0x731916 : 0x7a3400,
                            emissiveIntensity: 0.4
                        });
                        break;
                    case 'vault':
                        geometry = new THREE.OctahedronGeometry(2.5);
                        material = new THREE.MeshPhongMaterial({ 
                            color: 0x000000,
                            emissive: 0x333333,
                            emissiveIntensity: 0.3,
                            wireframe: true
                        });
                        break;
                    case 'home-assistant':
                        geometry = new THREE.IcosahedronGeometry(2);
                        material = new THREE.MeshPhongMaterial({ 
                            color: 0x41bdf5,
                            emissive: 0x205e7a,
                            emissiveIntensity: 0.4
                        });
                        break;
                    case 'autodidact':
                    case 'grpo':
                        geometry = new THREE.RingGeometry(1, 2.5, 8);
                        material = new THREE.MeshPhongMaterial({ 
                            color: 0xffd700,
                            emissive: 0x7a6800,
                            emissiveIntensity: 0.6,
                            side: THREE.DoubleSide
                        });
                        break;
                    case 'gotty':
                    case 'claude-code':
                        geometry = new THREE.TetrahedronGeometry(2.5);
                        material = new THREE.MeshPhongMaterial({ 
                            color: 0x00ff88,
                            emissive: 0x007a44,
                            emissiveIntensity: 0.5
                        });
                        break;
                    case 'blue-green':
                    case 'blue-green-operators':
                        geometry = new THREE.CapsuleGeometry(1, 2, 4, 8);
                        material = new THREE.MeshPhongMaterial({ 
                            color: 0x00bfff,
                            emissive: 0x005f7a,
                            emissiveIntensity: 0.4
                        });
                        break;
                    case 'self-hosting':
                    case 'distributed-ai':
                        geometry = new THREE.SphereGeometry(3, 32, 32);
                        material = new THREE.MeshPhongMaterial({ 
                            color: 0xff1493,
                            emissive: 0x7a0a49,
                            emissiveIntensity: 0.7,
                            wireframe: true,
                            transparent: true,
                            opacity: 0.8
                        });
                        break;
                    default:
                        geometry = new THREE.TetrahedronGeometry(2);
                        material = new THREE.MeshPhongMaterial({ 
                            color: 0x00ffff,
                            emissive: 0x007a7a,
                            emissiveIntensity: 0.3
                        });
                }

                mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(x, stageIndex * 0.5, z);
                mesh.userData = { type: comp, originalY: stageIndex * 0.5 };
                scene.add(mesh);
                components.push(mesh);

                // Add connecting lines for later stages
                if (stageIndex >= 2) {
                    const lineGeometry = new THREE.BufferGeometry().setFromPoints([
                        new THREE.Vector3(0, 0, 0),
                        new THREE.Vector3(x, stageIndex * 0.5, z)
                    ]);
                    const lineMaterial = new THREE.LineBasicMaterial({ 
                        color: 0x00ff41,
                        opacity: 0.5,
                        transparent: true
                    });
                    const line = new THREE.Line(lineGeometry, lineMaterial);
                    scene.add(line);
                    components.push(line);
                }
            });

            // Add particle effects for advanced stages
            if (stageIndex >= 4) {
                const particleCount = 1000;
                const particles = new THREE.BufferGeometry();
                const positions = new Float32Array(particleCount * 3);

                for (let i = 0; i < particleCount * 3; i += 3) {
                    positions[i] = (Math.random() - 0.5) * 50;
                    positions[i + 1] = Math.random() * 20 - 5;
                    positions[i + 2] = (Math.random() - 0.5) * 50;
                }

                particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                const particleMaterial = new THREE.PointsMaterial({
                    color: 0x00ff41,
                    size: 0.1,
                    opacity: 0.6,
                    transparent: true
                });
                const particleSystem = new THREE.Points(particles, particleMaterial);
                scene.add(particleSystem);
                components.push(particleSystem);
            }
        }

        // Animation loop
        function animate() {
            animationId = requestAnimationFrame(animate);

            // Rotate components
            components.forEach((comp, index) => {
                if (comp.userData && comp.userData.type) {
                    comp.rotation.y += 0.01;
                    comp.position.y = comp.userData.originalY + Math.sin(Date.now() * 0.001 + index) * 0.5;
                }
            });

            // Camera movement
            const time = Date.now() * 0.0005;
            camera.position.x = Math.cos(time) * 20;
            camera.position.z = Math.sin(time) * 20;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // Update display with technical metrics
        function updateStage(stageIndex) {
            currentStage = stageIndex;
            const stage = stages[stageIndex];
            
            document.getElementById('stage-title').textContent = stage.name.toUpperCase();
            document.getElementById('ascii-art').textContent = stage.ascii;
            
            // Enhanced description with metrics
            let description = stage.description;
            if (stage.metrics) {
                description += '\n\n📊 TECHNICAL SPECIFICATIONS:\n';
                for (const [key, value] of Object.entries(stage.metrics)) {
                    description += `• ${key.replace(/_/g, ' ').toUpperCase()}: ${value}\n`;
                }
            }
            document.getElementById('stage-description').textContent = description;
            
            document.getElementById('current-stage').textContent = `Stage ${stageIndex + 1}: ${stage.name}`;
            document.getElementById('current-date').textContent = stage.date;
            
            create3DStage(stageIndex);
        }

        // Timeline control
        document.getElementById('timeline-slider').addEventListener('input', (e) => {
            updateStage(parseInt(e.target.value));
        });

        // Play animation
        async function playAnimation() {
            for (let i = 0; i <= 5; i++) {
                document.getElementById('timeline-slider').value = i;
                updateStage(i);
                await new Promise(resolve => setTimeout(resolve, 2000));
            }
        }

        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / 2 / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth / 2, window.innerHeight);
        });

        // Initialize
        initThree();
        updateStage(0);
    </script>
</body>
</html>
