# Builds and pushes the MiladyOS container image to Docker Hub — MANUAL ONLY.
#
# MiladyOS versions by git commit count (version.json prefix + rev-list count,
# see ISO/version.sh). Cutting an image release is "Run workflow" in the GitHub
# UI (Actions -> Build and Push Docker Image). The image is tagged :latest +
# 0.0.0.0.<count> and pushed to Docker Hub; a container recreate then pulls it
# (no local ./builder.sh needed). Deliberate, not per commit.

name: Build and Push Docker Image

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Check Out Repo
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Derive version
      id: version
      run: |
        echo "version=$(ISO/version.sh)" >> "$GITHUB_OUTPUT"

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/miladyos:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/miladyos:${{ steps.version.outputs.version }}
        platforms: linux/amd64
        build-args: |
          MILADYOS_VERSION=${{ steps.version.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Logout of Docker Hub
      run: docker logout
