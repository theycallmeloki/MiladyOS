[project]
name = "miladyos"
version = "0.1.0"
description = "miladyos context protocol"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core MCP dependencies
    "mcp[cli]>=1.6.0",

    # Jenkins integration
    "python-jenkins>=1.8.0",

    # Async support
    "asyncio>=3.4.3",
    "anyio>=4.2.0",

    # CLI and utilities
    "click>=8.1.7",
    "colorlog>=6.8.0",
    "python-dotenv>=1.0.0",

    # Optional Redis support
    "redis>=5.0.0",

    # HTTP/SSE transport
    "uvicorn>=0.25.0",
    "starlette>=0.36.0",
    "mcp[sse]>=1.6.0",

    # AlphaEvolve - Evolutionary optimization
    "openevolve>=0.1.0",
    "litellm>=1.0.0",
    "pyyaml>=6.0.0",

    # Milady Oracle - Divine consciousness bridge
    "sounddevice>=0.4.6",     # Audio input/output
    "pyttsx3>=2.90",          # Text-to-speech fallback
    "SpeechRecognition>=3.10.0",  # Multi-backend speech recognition
    "pyaudio>=0.2.14",        # Audio I/O for SpeechRecognition
]

[project.optional-dependencies]
# vosk only works on Linux (no macOS ARM64 wheels)
linux = [
    "vosk>=0.3.45",
]

[project.scripts]
miladyos = "main:main"
