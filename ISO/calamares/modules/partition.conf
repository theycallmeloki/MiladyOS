# MiladyOS partitioning — appliance default: erase whole disk, ext4,
# small swap (up to 4GB), GPT + EFI 300MiB. Manual partitioning stays
# available for operators who want a custom layout.
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 300MiB
    minimumSize: 32MiB
    label: "EFI"
userSwapChoices:
    - small
initialPartitioningChoice: erase
initialSwapChoice: small
defaultFileSystemType: "ext4"
drawNestedPartitions: false
alwaysShowPartitionLabels: true
essentialMounts: [ "live-*", "control", "ventoy" ]
