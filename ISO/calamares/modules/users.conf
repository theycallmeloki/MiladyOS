# MiladyOS — Calamares user accounts.
# Same as calamares-settings-debian, EXCEPT setRootPassword: true:
# the appliance is root-operated (ssh root@node, kubeconfig scp in the
# fleet Jenkinsfiles), so the installer must set a root password.
---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: true
passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
