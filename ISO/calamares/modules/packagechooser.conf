# MiladyOS node role — 3-way choice (D4: master | worker | desktop).
#
# mode: required  -> exactly one selection, Next is disabled until picked
# method: legacy  -> selection stored in global storage as
#                    "packagechooser_packagechooser" (comma-separated ids);
#                    consumed by the rolesq exec job, which writes
#                    /etc/milady/node.conf in the installed system.
---
mode: required
method: legacy
labels:
    step: "Node Role"
items:
    - id: server
      name: "MiladyOS Server (master)"
      description: "Cluster master: k3s server (sqlite), advertises _kubernetes._tcp on the LAN, prints the join token on the console for workers. Runs the MiladyOS control-plane container. Install this on the first node of a cluster."
      screenshot: "/etc/calamares/branding/milady/role-server.png"
    - id: agent
      name: "MiladyOS Worker (agent)"
      description: "Joins an existing master automatically via Avahi discovery. Requires the master's join token: before continuing the install, type it on the live console (serial or Ctrl+Alt+F2) and save it to /etc/milady/join-token as root. Token never travels on the command line."
      screenshot: "/etc/calamares/branding/milady/role-agent.png"
    - id: desktop
      name: "MiladyOS Desktop"
      description: "Thin personal workstation: no k3s, no control-plane container. Ships a minimal X session (xorg + openbox); install your preferred window manager and apps after first boot."
      screenshot: "/etc/calamares/branding/milady/role-desktop.png"
