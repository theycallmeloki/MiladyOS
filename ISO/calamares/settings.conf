# MiladyOS Calamares installer — module sequence (D2 install-to-disk).
# Baseline: calamares-settings-debian chain, plus:
#   packagechooser — 3-way node role page (server | agent | desktop)
#   rolesq        — python job applying the choice to the installed system
---
modules-search: [ local, /usr/lib/calamares/modules ]
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
sequence:
# Phase 1 - prepare (view pages)
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - packagechooser
  - users
  - summary
# Phase 2 - install (exec jobs, in order)
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - rolesq
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - packages
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  - umount
# Phase 3 - postinstall
- show:
  - finished
branding: milady
prompt-install: false
dont-chroot: false
