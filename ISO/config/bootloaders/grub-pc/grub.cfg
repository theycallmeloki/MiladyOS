source /boot/grub/config.cfg

# MiladyOS live entries (UEFI/GRUB).
#
# live-build writes this menu itself — binary_grub_cfg hardcodes the label
# "Live system (<flavour>)" — so this file replaces the generated grub.cfg to
# give the appliance its own naming. config/bootloaders/grub-pc/ is copied over
# live-build's template and the @TOKENS@ below are substituted afterwards.
#
# The live medium *is* the installer: the live session starts the text
# installer on the console (docs/TEXT-INSTALLER.md), so there is no separate
# "install" entry to add.
#
# Keep the entry bodies in sync with what binary_grub_cfg would have produced:
# the tokens below carry the live kernel, initrd and cmdline (including
# findiso=${iso_path}). NB: this file goes through live-build's token
# substitution, so a token name written literally in a comment gets expanded
# there too — refer to them in prose, not as tokens.

menuentry "MiladyOS live" --hotkey=l {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}
menuentry "MiladyOS live (fail-safe mode)" {
	linux	@KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@
	initrd	@INITRD_LIVE@
}

submenu 'Utilities...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Memtest (if any)
	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	# Verify the checksums
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify integrity of the boot medium" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
