when:
  - event: manual

# MiladyOS ISO build bus — one manual pipeline that turns a checkout into a
# registry-tagged ISO, with the registry as both the cache and the tracker.
#
# Shape: the heavy work runs on the HOST daemon (`docker.sock` mounted). The
# registry-skip guard makes the pipeline idempotent — <REGISTRY>/<IMAGE>:<version>
# already present => nothing rebuilt.
#
# NOTE: Woodpecker interpolates `${VAR}` in `commands` itself (like GitHub
# Actions), so the script below uses only `$VAR` and shell defaults — a
# `${VAR:-default}` would be blanked before the shell ever ran.
#
# The step runs in a container but its `docker` talks to the host daemon, so
# nested `docker -v` binds must be HOST paths. The checkout is baked into a
# source image (context sent client-side) and only the MIRRORED paths are
# bound: /var/cache/milady-iso and /var/cache/milady-iso/out.
#
# Trigger (deliberate only): the miladyos-iso-watch git-input pipeline, or
#   POST /api/repos/<id>/pipelines
#     variables: {VERSION, PAYLOAD, UPLOAD_ISO, REGISTRY, IMAGE}
#
# Agent volumes require the repo to be trusted (volumes=true):
#   /var/run/docker.sock, /var/cache/milady-iso
steps:
  iso-build:
    image: miladyosregistry.transparentlyrotatableproxy.site/milady-iso-runner:1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/cache/milady-iso:/var/cache/milady-iso
    commands:
      - |
        set -e
        # NOTE: no `set -u` — Woodpecker only passes the variables a trigger
        # supplies, so unset ones (REGISTRY, PAYLOAD, …) are normal; `-u` would
        # abort on the first one. Defaults are guarded with `[ -n ]` below.
        REG="$REGISTRY"
        [ -n "$REG" ] || REG="$CONTAINER_REGISTRY"
        [ -n "$REG" ] || REG=miladyosregistry.transparentlyrotatableproxy.site
        [ -n "$IMAGE" ] || IMAGE=miladyos-iso
        CACHE=/var/cache/milady-iso
        OUTDIR="$CACHE/out"
        cd "$CI_WORKSPACE"

        # VERSION comes from the trigger variable: the slurped workspace has no
        # real git history (count == 1), so version.sh is only a fallback.
        [ -n "$VERSION" ] || VERSION=$(bash ISO/version.sh 2>/dev/null || true)
        [ -n "$VERSION" ] || VERSION=0.0.0.0.0
        BTAG="b$(sha256sum ISO/builder/Dockerfile | cut -c1-12)"
        MILADY_BUILDER_IMAGE="$REG/milady-iso-builder:$BTAG"
        export MILADY_BUILDER_IMAGE
        echo "iso-build: version=$VERSION registry=$REG image=$IMAGE builder=$MILADY_BUILDER_IMAGE"

        # --- registry-skip guard: the registry is the cache ----------------
        if curl -fsSL "https://$REG/v2/$IMAGE/tags/list" --max-time 20 2>/dev/null \
             | grep -q "\"$VERSION\""; then
          echo "registry-skip: $REG/$IMAGE:$VERSION already built"
          exit 0
        fi
        echo "registry-miss: building $VERSION"

        # --- build: self-contained source image, mirrored binds only ------
        SRC_IMG="milady-iso-local:$VERSION"
        NO_PAYLOAD=1
        [ "$PAYLOAD" = 1 ] && NO_PAYLOAD=0
        docker build -q --build-arg BUILDER="$MILADY_BUILDER_IMAGE" \
            -f ISO/woodpecker/Dockerfile.isosrc -t "$SRC_IMG" . >&2
        mkdir -p "$OUTDIR"
        docker run --rm --privileged \
            -v "$CACHE":/build/cache \
            -v "$OUTDIR":/out \
            -e VERSION="$VERSION" -e NO_PAYLOAD="$NO_PAYLOAD" \
            "$SRC_IMG" >&2

        ISO_FILE=$(ls -t "$OUTDIR"/miladyos-*.iso 2>/dev/null | head -1)
        [ -n "$ISO_FILE" ] || { echo "no ISO produced under $OUTDIR"; exit 1; }
        SHA=$(sha256sum "$ISO_FILE" | awk '{print $1}')
        SIZE=$(stat -c %s "$ISO_FILE")
        echo "built: $ISO_FILE ($SIZE bytes, sha256 $SHA)"

        # --- manifest: the audit trail, next to the ISO -------------------
        PAYLOAD_BOOL=false
        [ "$PAYLOAD" = 1 ] && PAYLOAD_BOOL=true
        [ -n "$CI_BUILD_NUMBER" ] || CI_BUILD_NUMBER=0
        printf '{"version":"%s","iso":"%s","size":%s,"sha256":"%s","built":"%s","build":%s,"payload":%s}\n' \
          "$VERSION" "$(basename "$ISO_FILE")" "$SIZE" "$SHA" \
          "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$CI_BUILD_NUMBER" "$PAYLOAD_BOOL" \
          > "$OUTDIR/manifest-$VERSION.json"

        # --- publish: registry as the artifact tracker --------------------
        if [ "$UPLOAD_ISO" = 1 ]; then
          echo "publish: $REG/$IMAGE:$VERSION"
          if [ -n "$DOCKERHUB_PASSWORD" ]; then
            [ -n "$DOCKERHUB_USERNAME" ] || DOCKERHUB_USERNAME=milady
            echo "$DOCKERHUB_PASSWORD" | docker login "$REG" \
              -u "$DOCKERHUB_USERNAME" --password-stdin >/dev/null 2>&1 || true
          fi
          D="$CI_WORKSPACE/.iso-publish"
          rm -rf "$D"; mkdir -p "$D"
          cp "$ISO_FILE" "$D/miladyos.iso"
          printf 'FROM scratch\nCOPY miladyos.iso /\n' > "$D/Dockerfile"
          docker build -t "$REG/$IMAGE:$VERSION" "$D"
          docker push "$REG/$IMAGE:$VERSION"
          docker image prune -f >/dev/null 2>&1 || true
          rm -rf "$D"
        fi
