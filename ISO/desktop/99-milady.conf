# MiladyOS desktop variant — layered onto Debian's stock sway config through
# /etc/sway/config.d/* (never replace /etc/sway/config; see docs/DESKTOP.md).
# Keep this tiny: the session is an ergonomic console for a human guest.

# Brand wallpaper (staged by build-in-container.sh from desktop/wallpaper.jpg).
# swaybg scales it to whatever the output is. If the file is missing sway logs
# it and leaves its own default background — a second `output * bg` line here
# would silently *replace* this one, so there is deliberately only one.
output * bg /usr/share/backgrounds/miladyos.jpg fill

# A terminal on login: a fresh desktop session that opens onto an empty desktop
# is a dead end for a human guest — give them a shell (sway binds $mod+Return
# to foot too, but that requires knowing the binding).
exec foot

# And park a browser on milady's live emacs (GoTTY :1337 inside the miladyos
# container) so the session always shows something milady is doing. milady-watch
# waits for the port and falls back to a local explainer page if the container
# is not running on this node (the desktop role does not start it by default).
exec milady-watch
