apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelstash
  namespace: llama-cpp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: modelstash
  template:
    metadata:
      labels:
        app: modelstash
    spec:
      containers:
      - name: modelstash
        image: python:3.11-slim
        command:
        - sh
        - -c
        - |
          pip install --no-cache-dir uploadserver && \
          cd /models && \
          python -m uploadserver 8000
        ports:
        - containerPort: 8000
          name: http
        volumeMounts:
        - name: model-storage
          mountPath: /models
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: model-storage
