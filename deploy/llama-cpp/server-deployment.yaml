apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server
  namespace: llama-cpp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-server
  template:
    metadata:
      labels:
        app: llama-server
    spec:
      runtimeClassName: nvidia
      containers:
      - name: vllm
        image: ghcr.io/sasha0552/vllm:v0.10.0
        args:
        - "--model"
        - "Nanbeige/Nanbeige4.1-3B"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "8080"
        - "--dtype"
        - "float16"
        - "--max-model-len"
        - "32768"
        - "--download-dir"
        - "/models"
        ports:
        - containerPort: 8080
          name: http
        resources:
          limits:
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: model-cache
          mountPath: /models
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 600
          periodSeconds: 30
          failureThreshold: 10
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache
