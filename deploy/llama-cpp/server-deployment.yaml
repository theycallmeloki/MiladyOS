apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server
  namespace: llama-cpp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-server
  template:
    metadata:
      labels:
        app: llama-server
    spec:
      initContainers:
      - name: model-fetch
        image: busybox:stable
        command:
        - sh
        - -c
        - |
          if [ -f /models/Nanbeige.Nanbeige4.1-3B.f16.gguf ]; then
            echo "Model already cached, skipping"
            exit 0
          fi
          rm -f /models/Nanbeige.Nanbeige4.1-3B.f16.gguf.tmp
          echo "Downloading model from modelstash..."
          wget -O /models/Nanbeige.Nanbeige4.1-3B.f16.gguf.tmp http://modelstash:8000/Nanbeige.Nanbeige4.1-3B.f16.gguf && \
          mv /models/Nanbeige.Nanbeige4.1-3B.f16.gguf.tmp /models/Nanbeige.Nanbeige4.1-3B.f16.gguf
        volumeMounts:
        - name: model-cache
          mountPath: /models
      containers:
      - name: llama-server
        image: ogmiladyloki/llama-cpp-rpc-server:latest
        imagePullPolicy: Always
        command: ["llama-server"]
        args:
        - "-m"
        - "/models/Nanbeige.Nanbeige4.1-3B.f16.gguf"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "8080"
        - "-ngl"
        - "99"
        - "--ctx-size"
        - "32768"
        - "--rpc"
        - "rpc-worker-0.rpc-worker-headless.llama-cpp.svc.cluster.local:50052,rpc-worker-1.rpc-worker-headless.llama-cpp.svc.cluster.local:50052,rpc-worker-2.rpc-worker-headless.llama-cpp.svc.cluster.local:50052"
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: model-cache
          mountPath: /models
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 600
          periodSeconds: 30
          failureThreshold: 10
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache
