# ax control plane (Agent Executor) — ax-system.
#
# Derived from google/ax deploy/ax-server.yaml + deploy/postgres.yaml at
# 2187dd4 with these changes for this cluster:
#   - image pinned to the digest kaniko built into our registry
#   - ax-server flags/env for our object store and Substrate endpoint
#   - the dev-only PostgreSQL password fixed in a Secret instead of `make
#     deploy-postgres` generating one
#
# ax at 2187dd4 stores task/workflow state in PostgreSQL and no longer needs
# Redis: the Redis Streams queue and its controller were removed upstream, so
# the ax-redis Deployment/Service this file used to carry are gone.
#
# Depends on: deploy/ate/namespaces.yaml (creates ax-system) and a running
# Substrate control plane in ate-system.
apiVersion: v1
kind: Namespace
metadata:
  name: ax-system
  labels:
    # Admitted through ate-api-server's ingress NetworkPolicy.
    ate.dev/api-access: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: ax-postgres
  namespace: ax-system
type: Opaque
stringData:
  # Dev cluster only; upstream's `make deploy-postgres` generates a random one.
  password: ax-dev-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ax-postgres
  namespace: ax-system
  labels:
    app.kubernetes.io/name: ax-postgres
    app.kubernetes.io/part-of: ax
spec:
  replicas: 1
  serviceName: ax-postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: ax-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ax-postgres
    spec:
      # Give Postgres time for a clean shutdown checkpoint.
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              value: ax
            - name: POSTGRES_DB
              value: ax
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ax-postgres
                  key: password
            # A subdirectory, because the volume root may contain lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ax", "-d", "ax"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: ax-postgres
          app.kubernetes.io/part-of: ax
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ax-postgres
  namespace: ax-system
  labels:
    app.kubernetes.io/name: ax-postgres
    app.kubernetes.io/part-of: ax
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app.kubernetes.io/name: ax-postgres
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ax-server
  namespace: ax-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ax-server
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ax-server
subjects:
  - kind: ServiceAccount
    name: ax-server
    namespace: ax-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ax-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ax-server
  namespace: ax-system
  labels:
    app.kubernetes.io/name: ax-server
    app.kubernetes.io/part-of: ax
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ax-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ax-server
    spec:
      serviceAccountName: ax-server
      containers:
        - name: ax-server
          image: miladyosregistry.transparentlyrotatableproxy.site/ax-images/ax-server@sha256:fed30d335a5fd45bd6bb423cb328b36da47a135e84c393880cfcfbc36207cb81
          imagePullPolicy: IfNotPresent
          args:
            - "--addr=:8080"
            - "--store=postgres://ax@ax-postgres.ax-system.svc.cluster.local:5432/ax?sslmode=disable"
            - "--substrate-endpoint=api.ate-system.svc.cluster.local:443"
            - "--substrate-authority=api.ate-system.svc"
            - "--substrate-token-file=/var/run/secrets/ateapi/token"
            - "--substrate-ca-file=/run/servicedns-ca/trust-bundle.pem"
            - "--template=default-template"
            - "--template-atespace=ax-system"
          env:
            # libpq fills the password into --store from PGPASSWORD.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ax-postgres
                  key: password
            - name: ATENET_ROUTER_ADDR
              value: "https://atenet-router.ate-system.svc.cluster.local:443"
            - name: AX_DEFAULT_TASK_IMAGE
              value: "miladyosregistry.transparentlyrotatableproxy.site/ax-images/ax-task-runner@sha256:934ad7d7b282a8d7823d287bcc481bfcbbd4930a380a7eb381663f71d8622f83"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - mountPath: /var/run/secrets/ateapi
              name: ate-token
              readOnly: true
            - mountPath: /run/servicedns-ca
              name: servicedns-ca
              readOnly: true
      volumes:
        - name: ate-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  audience: api.ate-system.svc
                  expirationSeconds: 7200
                  path: token
        - name: servicedns-ca
          projected:
            defaultMode: 420
            sources:
              - clusterTrustBundle:
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
                  signerName: servicedns.podcert.ate.dev/identity
---
apiVersion: v1
kind: Service
metadata:
  name: ax-server
  namespace: ax-system
  labels:
    app.kubernetes.io/name: ax-server
    app.kubernetes.io/part-of: ax
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: ax-server
