apiVersion: v1
kind: ConfigMap
metadata:
  name: ha-configuration
  namespace: homeassistant
data:
  configuration.yaml: |
    # Configure a default setup of Home Assistant
    default_config:

    # Text to speech
    tts:
      - platform: google_translate

    # HTTP/reverse-proxy settings are not configured here: HA 2026.11 migrated
    # them to /config/.storage/http and ignores this file for that integration.
    # The store is seeded by the http-config-bootstrap init container from the
    # ha-http-config ConfigMap on a fresh volume; change it in the UI afterwards
    # (Settings > System > Network).