apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: homeassistant
  name: homeassistant
  namespace: homeassistant
spec:
  replicas: 1
  # RWO PVC + hostNetwork port 8123: a RollingUpdate surges a second pod that
  # cannot attach the volume; Recreate stops the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      # ConfigMap edits do not restart Home Assistant (and subPath mounts are
      # not live-reloaded): run `kubectl -n homeassistant rollout restart
      # deploy/homeassistant` after changing ha-configuration.
      # HA 2026.11+ migrates `http:` to /config/.storage/http on first boot and
      # then ignores the YAML block; later HTTP changes are made in the UI and
      # promoted from its repair/confirmation flow.
      labels:
        app: homeassistant
    spec:
      hostNetwork: true
      serviceAccountName: homeassistant
      initContainers:
      - name: volume-permissions
        image: busybox
        securityContext:
          privileged: true
        command: 
        - sh
        - -c
        - |
          mkdir -p /config
          chown -R 0:0 /config
          chmod -R 775 /config
          ls -la /config
        volumeMounts:
        - mountPath: /config
          name: homeassistant
      # Seed HA's HTTP config store on a fresh volume. HA 2026.11+ owns this in
      # /config/.storage/http; the ConfigMap holds the reverse-proxy settings
      # (use_x_forwarded_for + trusted_proxies). Never overwrite an existing
      # store: later changes are made in the UI.
      - name: http-config-bootstrap
        image: busybox:1.31.1
        command: ["sh", "-c"]
        args:
          - |
            if [ ! -s /config/.storage/http ]; then
              mkdir -p /config/.storage
              cp /bootstrap/http /config/.storage/http
              chmod 660 /config/.storage/http
              echo "http-config-bootstrap: seeded /config/.storage/http"
            else
              echo "http-config-bootstrap: existing HTTP store kept"
            fi
        volumeMounts:
        - mountPath: /config
          name: homeassistant
        - mountPath: /bootstrap
          name: http-config
          readOnly: true
      containers:
      - image: ghcr.io/home-assistant/home-assistant:latest
        imagePullPolicy: Always
        name: homeassistant
        securityContext:
          allowPrivilegeEscalation: true
          runAsUser: 0
          privileged: true
        ports:
        - containerPort: 8123
          name: web
          protocol: TCP
        env:
        - name: TZ
          value: Europe/London
        volumeMounts:
        - mountPath: /config
          name: homeassistant
        - mountPath: /config/configuration.yaml
          subPath: configuration.yaml
          name: ha-config
      # Completes onboarding headlessly and provisions the HA long-lived token
      # in the monitoring namespace. Idempotent: valid existing tokens are
      # reused, and the container idles after finishing so it cannot crash-loop.
      - name: onboarding-bootstrap
        image: ghcr.io/home-assistant/home-assistant:latest
        imagePullPolicy: IfNotPresent
        command: ["python3", "/bootstrap/onboard.py"]
        env:
        - name: HA_OWNER_NAME
          valueFrom:
            secretKeyRef:
              name: homeassistant-owner
              key: name
        - name: HA_OWNER_USERNAME
          valueFrom:
            secretKeyRef:
              name: homeassistant-owner
              key: username
        - name: HA_OWNER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: homeassistant-owner
              key: password
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts:
        - mountPath: /config
          name: homeassistant
        - mountPath: /bootstrap
          name: bootstrap
          readOnly: true
      volumes:
        - name: homeassistant
          persistentVolumeClaim:
            claimName: homeassistant
        - name: ha-config
          configMap:
            name: ha-configuration
            defaultMode: 0644
        - name: http-config
          configMap:
            name: ha-http-config
        - name: bootstrap
          configMap:
            name: ha-bootstrap