apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: homeassistant
  name: homeassistant
  namespace: homeassistant
spec:
  replicas: 1
  # RWO PVC + hostNetwork port 8123: a RollingUpdate surges a second pod that
  # cannot attach the volume; Recreate stops the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      # ConfigMap edits do not restart Home Assistant (and subPath mounts are
      # not live-reloaded): run `kubectl -n homeassistant rollout restart
      # deploy/homeassistant` after changing ha-configuration.
      # HA 2026.11+ migrates `http:` to /config/.storage/http on first boot and
      # then ignores the YAML block; later HTTP changes are made in the UI and
      # promoted from its repair/confirmation flow.
      labels:
        app: homeassistant
    spec:
      hostNetwork: true
      initContainers:
      - name: volume-permissions
        image: busybox
        securityContext:
          privileged: true
        command: 
        - sh
        - -c
        - |
          mkdir -p /config
          chown -R 0:0 /config
          chmod -R 775 /config
          ls -la /config
        volumeMounts:
        - mountPath: /config
          name: homeassistant
      containers:
      - image: ghcr.io/home-assistant/home-assistant:latest
        imagePullPolicy: Always
        name: homeassistant
        securityContext:
          allowPrivilegeEscalation: true
          runAsUser: 0
          privileged: true
        ports:
        - containerPort: 8123
          name: web
          protocol: TCP
        env:
        - name: TZ
          value: Europe/London
        volumeMounts:
        - mountPath: /config
          name: homeassistant
        - mountPath: /config/configuration.yaml
          subPath: configuration.yaml
          name: ha-config
      volumes:
        - name: homeassistant
          persistentVolumeClaim:
            claimName: homeassistant
        - name: ha-config
          configMap:
            name: ha-configuration
            defaultMode: 0644