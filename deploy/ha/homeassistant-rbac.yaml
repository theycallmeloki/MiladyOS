# The onboarding sidecar mints a Home Assistant long-lived access token and
# stores it in the monitoring namespace for Grafana/wiz-exporter. The token
# belongs to the `homeassistant` ServiceAccount, so grant only the secret it
# needs. (Kubernetes cannot restrict `create` by resourceName; all other verbs
# are name-scoped.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homeassistant
  namespace: homeassistant
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: homeassistant-token-writer
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["homeassistant-token"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: homeassistant-token-writer
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: homeassistant-token-writer
subjects:
  - kind: ServiceAccount
    name: homeassistant
    namespace: homeassistant
