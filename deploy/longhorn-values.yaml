# Longhorn Values - Default Storage Configuration

# Default settings
defaultSettings:
  # Single replica. After talos-ms4-c7v was delisted only two Longhorn storage
  # nodes remain, and replica-soft-anti-affinity is disabled, so a 3-replica
  # volume can never place all its replicas and sits in "degraded" forever.
  defaultReplicaCount: 1
  # Allow generous over-provisioning for flexible storage
  storageOverProvisioningPercentage: 200
  # Only reserve 5% for system (generous allocation)
  storageMinimalAvailablePercentage: 5
  # Default data path for Talos
  defaultDataPath: "/var/lib/longhorn"

# Make this the default StorageClass so all PVCs use it automatically
storageClass:
  create: true
  name: "longhorn"
  isDefaultClass: true
  allowVolumeExpansion: true
  reclaimPolicy: "Delete"
  volumeBindingMode: "WaitForFirstConsumer"
  parameters:
    # Overrides defaultSettings.defaultReplicaCount for every PVC bound through
    # this class, so it has to match it or new volumes come back degraded.
    numberOfReplicas: "1"
    fsType: "ext4"

# Persistence settings
persistence:
  defaultClass: true
  defaultClassReplicaCount: 1

# UI service configuration
service:
  ui:
    type: ClusterIP

# Disable PSP (deprecated in modern Kubernetes)
enablePSP: false

# NOTE: Before installing, the longhorn-system namespace must be labeled with privileged PSA:
#   kubectl create namespace longhorn-system
#   kubectl label namespace longhorn-system \
#     pod-security.kubernetes.io/enforce=privileged \
#     pod-security.kubernetes.io/audit=privileged \
#     pod-security.kubernetes.io/warn=privileged
