# Static TrueNAS NFS volume for the MiladyOS Grafana SQLite database.
# The old Longhorn volume remains for recovery; Grafana now uses this claim.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: monitoring-grafana-nfs
spec:
  capacity:
    storage: 5Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: ["nfsvers=4.1", "hard", "timeo=600", "retrans=2"]
  nfs:
    server: 192.168.1.99
    path: /mnt/neochibistore/k8s-registry/grafana-monitoring
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: monitoring-grafana-nfs
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ""
  volumeName: monitoring-grafana-nfs
  resources:
    requests:
      storage: 5Gi
