apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: snmp-exporter
  namespace: monitoring
  labels:
    app: snmp-exporter
    release: monitoring  # Required for Prometheus discovery
spec:
  selector:
    matchLabels:
      app: snmp-exporter
  endpoints:
  - port: metrics
    path: /snmp
    interval: 60s
    scrapeTimeout: 30s
    params:
      module: [if_mib]
      auth: [public_v2]
      target: [192.168.2.1]
    relabelings:
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: __address__
      replacement: snmp-exporter:9116
    metricRelabelings:
    - sourceLabels: [__name__]
      regex: '(snmp_.*|sys.*|if.*|up|scrape_.*)'
      action: keep