apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiz-exporter
  namespace: monitoring
  labels:
    app: wiz-exporter
spec:
  replicas: 1
  # RWO PVC: a RollingUpdate surges a pod that cannot attach the volume while
  # the old one still holds it, leaving the new pod in Init/Multi-Attach.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wiz-exporter
  template:
    metadata:
      labels:
        app: wiz-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9678"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: wiz-exporter
        image: python:3.9-slim
        ports:
        - containerPort: 9678
          name: metrics
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        envFrom:
        - configMapRef:
            name: wiz-exporter-config
        env:
        # Minted by the homeassistant onboarding sidecar. Explicit env wins
        # over envFrom; restart the exporter after the token rotates.
        - name: HASS_TOKEN
          valueFrom:
            secretKeyRef:
              name: homeassistant-token
              key: HASS_TOKEN
        volumeMounts:
        - name: script
          mountPath: /app/script
          readOnly: true
        - name: data
          mountPath: /data
        command: ["/bin/bash", "-c"]
        args:
          - |
            mkdir -p /tmp/pip
            export PIP_CACHE_DIR=/tmp/pip
            export PYTHONUSERBASE=/tmp/pyuser
            python -m pip install --user requests prometheus-client
            export PYTHONPATH=/tmp/pyuser/lib/python3.9/site-packages
            echo "Copying exporter script..."
            cp /app/script/exporter.py /data/exporter.py
            chmod +x /data/exporter.py
            echo "Script copied. Starting exporter..."
            python -u /data/exporter.py  # -u for unbuffered output
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 15
          periodSeconds: 15
      volumes:
      - name: script
        configMap:
          name: wiz-exporter-script
          items:
          - key: exporter.py
            path: exporter.py
      - name: data
        persistentVolumeClaim:
          claimName: wiz-exporter-data
---
apiVersion: v1
kind: Service
metadata:
  name: wiz-exporter
  namespace: monitoring
  labels:
    app: wiz-exporter
spec:
  ports:
  - port: 9678
    targetPort: 9678
    name: metrics
  selector:
    app: wiz-exporter