apiVersion: v1
kind: ConfigMap
metadata:
  name: fleet-agent-ui
  namespace: fleet-agent
data:
  server.py: |
    #!/usr/bin/env python3
    """Thin API server for the fleet-agent UI. Reads /data (shared PVC) and
    exposes queue, datums, traces, channels, and a dispatch endpoint."""
    import asyncio, json, os, time, urllib.request, urllib.parse, uvicorn
    from pathlib import Path
    from datetime import datetime, timezone
    from fastapi import FastAPI
    from fastapi.responses import HTMLResponse, JSONResponse, StreamingResponse

    app      = FastAPI()
    DATA     = Path(os.environ.get("DATA_DIR",  "/data"))
    UI       = Path(os.environ.get("UI_DIR",    "/ui"))
    LOKI_URL = os.environ.get("LOKI_URL", "http://loki.monitoring.svc.cluster.local:3100")

    def _read_jsonl(path: Path, tail: int = 100) -> list:
        if not path.exists():
            return []
        lines = [l.strip() for l in path.read_text().splitlines() if l.strip()]
        out = []
        for line in lines[-tail:]:
            try:
                out.append(json.loads(line))
            except Exception:
                pass
        return out

    @app.get("/api/queue")
    def get_queue():
        return list(reversed(_read_jsonl(DATA / "queue/queue.jsonl", tail=100)))

    @app.get("/api/datums")
    def get_datums():
        d = DATA / "datums"
        if not d.exists():
            return []
        results = []
        for f in sorted(d.glob("*.json"), key=lambda x: x.stat().st_mtime, reverse=True)[:100]:
            try:
                results.append(json.loads(f.read_text()))
            except Exception:
                pass
        return results

    @app.get("/api/traces/{datum_id}")
    def get_trace(datum_id: str):
        # prefer the streaming jsonl (partial results); fall back to consolidated json
        jsonl = DATA / "traces" / f"{datum_id}.jsonl"
        js    = DATA / "traces" / f"{datum_id}.json"
        if jsonl.exists():
            return _read_jsonl(jsonl, tail=500)
        if js.exists():
            try:
                return json.loads(js.read_text())
            except Exception:
                return []
        return []

    @app.get("/api/traces/{datum_id}/stream")
    async def stream_trace(datum_id: str):
        """SSE stream that tails the trace jsonl file until run_end is seen."""
        trace_file  = DATA / "traces" / f"{datum_id}.jsonl"
        datum_file  = DATA / "datums" / f"{datum_id}.json"

        async def events():
            last_pos = 0
            # Flush existing content first
            if trace_file.exists():
                text = trace_file.read_text()
                for line in text.splitlines():
                    if line.strip():
                        yield f"data: {line}\n\n"
                last_pos = trace_file.stat().st_size

            # Tail for up to 10 minutes (600 × 1s ticks)
            for _ in range(600):
                await asyncio.sleep(1)
                try:
                    size = trace_file.stat().st_size
                    if size > last_pos:
                        with open(trace_file) as f:
                            f.seek(last_pos)
                            chunk = f.read()
                        for line in chunk.splitlines():
                            if line.strip():
                                yield f"data: {line}\n\n"
                        last_pos = size
                except FileNotFoundError:
                    pass

                # Stop when datum reaches a terminal state
                try:
                    if datum_file.exists():
                        d = json.loads(datum_file.read_text())
                        if d.get("status") in ("complete", "failed", "rlm_dispatched"):
                            yield 'data: {"type":"stream_end"}\n\n'
                            break
                except Exception:
                    pass

        return StreamingResponse(events(), media_type="text/event-stream",
                                 headers={"Cache-Control": "no-cache",
                                          "X-Accel-Buffering": "no"})

    def _loki_query(datum_id: str, start_ns: int, end_ns: int, limit: int = 500) -> list:
        """Synchronous Loki query — call via asyncio.to_thread from async contexts."""
        query  = '{namespace="fleet-agent"} |= "[D:' + datum_id + ']"'
        params = urllib.parse.urlencode({
            "query": query, "start": str(start_ns), "end": str(end_ns),
            "limit": str(limit), "direction": "forward",
        })
        req = urllib.request.Request(
            f"{LOKI_URL}/loki/api/v1/query_range?{params}",
            headers={"Accept": "application/json"},
        )
        with urllib.request.urlopen(req, timeout=10) as resp:
            data = json.loads(resp.read())
        lines = []
        for stream in data.get("data", {}).get("result", []):
            for ts_ns, line in stream.get("values", []):
                lines.append((int(ts_ns), line))
        lines.sort()
        return lines

    def _datum_ns(datum: dict):
        """Return (start_ns, end_ns) for a datum's time window."""
        created = datum.get("created_at", "")
        updated = datum.get("updated_at", "")
        try:
            start_ns = int(datetime.fromisoformat(
                created.rstrip("Z")).replace(tzinfo=timezone.utc).timestamp() * 1e9)
        except Exception:
            start_ns = int((time.time() - 3600) * 1e9)
        if updated:
            try:
                end_ns = int(datetime.fromisoformat(
                    updated.rstrip("Z")).replace(tzinfo=timezone.utc).timestamp() * 1e9) + int(60e9)
            except Exception:
                end_ns = int(time.time() * 1e9)
        else:
            end_ns = int(time.time() * 1e9)
        return start_ns, end_ns

    @app.get("/api/logs/{datum_id}")
    async def get_loki_logs(datum_id: str):
        datum_file = DATA / "datums" / f"{datum_id}.json"
        if not datum_file.exists():
            return {"error": "datum not found", "lines": []}
        try:
            datum = json.loads(datum_file.read_text())
        except Exception:
            return {"error": "bad datum file", "lines": []}
        start_ns, end_ns = _datum_ns(datum)
        try:
            rows = await asyncio.to_thread(_loki_query, datum_id, start_ns, end_ns)
            return {"lines": [line for _, line in rows]}
        except Exception as e:
            return {"error": str(e), "lines": []}

    @app.get("/api/logs/{datum_id}/stream")
    async def stream_loki_logs(datum_id: str):
        """SSE: poll Loki every 2 s for new log lines tagged [D:{datum_id}]."""
        datum_file = DATA / "datums" / f"{datum_id}.json"

        async def events():
            if not datum_file.exists():
                yield 'data: {"error":"datum not found"}\n\n'
                return
            try:
                datum    = json.loads(datum_file.read_text())
                start_ns, _ = _datum_ns(datum)
            except Exception:
                yield 'data: {"error":"bad datum"}\n\n'
                return

            last_ts_ns = start_ns
            for _ in range(300):          # up to ~10 min
                await asyncio.sleep(2)
                end_ns = int(time.time() * 1e9)
                if end_ns > last_ts_ns:
                    try:
                        rows = await asyncio.to_thread(
                            _loki_query, datum_id, last_ts_ns + 1, end_ns, 200)
                        for ts_ns, line in rows:
                            last_ts_ns = max(last_ts_ns, ts_ns)
                            yield f"data: {json.dumps({'line': line})}\n\n"
                    except Exception:
                        pass
                try:
                    d = json.loads(datum_file.read_text())
                    if d.get("status") in ("complete", "failed", "rlm_dispatched"):
                        yield 'data: {"type":"stream_end"}\n\n'
                        break
                except Exception:
                    pass

        return StreamingResponse(events(), media_type="text/event-stream",
                                 headers={"Cache-Control": "no-cache",
                                          "X-Accel-Buffering": "no"})

    @app.get("/api/channels")
    def get_channels():
        ch_dir = DATA / "channels"
        if not ch_dir.exists():
            return []
        out = []
        for ch in sorted(ch_dir.iterdir()):
            if ch.is_dir():
                out.append({"name": ch.name,
                             "recent": _read_jsonl(ch / "log.jsonl", tail=5)})
        return out

    @app.get("/api/stats")
    def get_stats():
        """Quick counters for the header bar."""
        active = sum(1 for _ in asyncio.all_tasks()) - 1  # exclude this coroutine
        datums = list((DATA / "datums").glob("*.json")) if (DATA / "datums").exists() else []
        counts = {}
        for f in datums:
            try:
                s = json.loads(f.read_text()).get("status", "unknown")
                counts[s] = counts.get(s, 0) + 1
            except Exception:
                pass
        return {"counts": counts, "queue_size": len(_read_jsonl(DATA / "queue/queue.jsonl"))}

    @app.post("/api/dispatch")
    def dispatch(body: dict):
        entry = {
            "ts":          datetime.now(timezone.utc).isoformat() + "Z",
            "type":        body.get("type", "mattermost"),
            "channel":     body.get("channel", "fleet-ops"),
            "user":        "ui",
            "user_id":     "ui",
            "text":        body.get("instruction", ""),
            "instruction": body.get("instruction", ""),
        }
        if body.get("url"):
            entry["url"] = body["url"]
        if body.get("context_channel"):
            entry["context_channel"] = body["context_channel"]
        q = DATA / "queue/queue.jsonl"
        q.parent.mkdir(parents=True, exist_ok=True)
        with open(q, "a") as f:
            f.write(json.dumps(entry) + "\n")
        return {"ok": True}

    @app.get("/")
    def index():
        return HTMLResponse((UI / "index.html").read_text())

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080, log_level="warning")

  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Fleet Agent</title>
      <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
      <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
          --bg:      #0d0f14;
          --surface: #161a22;
          --border:  #252a38;
          --text:    #e2e8f0;
          --muted:   #4a5568;
          --accent:  #818cf8;
          --green:   #34d399;
          --yellow:  #fbbf24;
          --red:     #f87171;
          --blue:    #60a5fa;
          --purple:  #a78bfa;
          --cyan:    #22d3ee;
        }
        body {
          background: var(--bg); color: var(--text);
          font-family: 'SF Mono','Fira Code','Cascadia Code',monospace;
          font-size: 12px; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        #app {
          display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden;
        }

        /* header */
        .header {
          display: flex; align-items: center; gap: 16px;
          padding: 9px 18px; border-bottom: 1px solid var(--border);
          background: var(--surface); flex-shrink: 0;
        }
        .logo { font-size: 13px; font-weight: 700; letter-spacing: .1em; color: var(--accent); }
        .stats { display: flex; gap: 16px; margin-left: auto; align-items: center; }
        .stat  { display: flex; align-items: center; gap: 5px; color: var(--muted); }
        .stat strong { color: var(--text); }
        .dot { width: 7px; height: 7px; border-radius: 50%; }
        .tick { color: var(--muted); font-size: 10px; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
        .pulse { animation: pulse 2s infinite; }

        /* dispatch bar */
        .dispatch {
          display: flex; gap: 8px; align-items: center;
          padding: 7px 18px; border-bottom: 1px solid var(--border);
          background: var(--surface); flex-shrink: 0;
        }
        .dispatch select, .dispatch input, .dispatch textarea {
          background: var(--bg); border: 1px solid var(--border);
          color: var(--text); padding: 5px 9px; border-radius: 4px;
          font-family: inherit; font-size: 12px; outline: none;
        }
        .dispatch select   { height: 30px; }
        .dispatch input    { height: 30px; }
        .dispatch textarea { flex: 1; height: 30px; resize: none; line-height: 20px; }
        .btn {
          height: 30px; padding: 0 14px; background: var(--accent); color: #0d0f14;
          border: none; border-radius: 4px; cursor: pointer;
          font-family: inherit; font-weight: 700; font-size: 12px; white-space: nowrap;
        }
        .btn:hover { opacity: .85; }
        .sent { color: var(--green); font-size: 11px; }

        /* main layout */
        .main { display: flex; flex: 1; overflow: hidden; }

        /* left: datums + queue */
        .left  { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        .cols  { display: grid; grid-template-columns: 1fr 300px; flex: 1; overflow: hidden; }

        /* panels */
        .panel { display: flex; flex-direction: column; border-right: 1px solid var(--border); overflow: hidden; }
        .panel-head {
          padding: 7px 14px; border-bottom: 1px solid var(--border);
          font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
          color: var(--muted); display: flex; align-items: center; gap: 8px; flex-shrink: 0;
        }
        .panel-head .n { color: var(--text); }
        .panel-body { flex: 1; overflow-y: auto; padding: 12px; }
        .panel-body.flush { padding: 0; }

        /* datum cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: 9px; }
        .card {
          background: var(--surface); border: 1px solid var(--border);
          border-left: 3px solid var(--border); border-radius: 5px; padding: 10px;
          cursor: pointer; transition: border-color .15s;
        }
        .card:hover { border-color: var(--accent); }
        .card.selected { border-color: var(--accent) !important; box-shadow: 0 0 0 1px var(--accent); }
        .card.complete       { border-left-color: var(--green);  }
        .card.failed         { border-left-color: var(--red);    }
        .card.processing     { border-left-color: var(--yellow); }
        .card.rlm_dispatched { border-left-color: var(--purple); }
        .card.pending        { border-left-color: var(--muted);  }
        .card-top  { display: flex; align-items: center; gap: 5px; margin-bottom: 6px; }
        .card-text { line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-url  { color: var(--blue); font-size: 11px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .card-meta { color: var(--muted); font-size: 10px; margin-top: 4px; }
        .card-err  { color: var(--red);   font-size: 10px; margin-top: 3px; }

        /* badges */
        .badge { font-size: 9px; padding: 2px 5px; border-radius: 3px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
        .b-mattermost    { background: rgba(129,140,248,.15); color: var(--accent);  }
        .b-browser_task  { background: rgba( 52,211,153,.15); color: var(--green);   }
        .b-heartbeat     { background: rgba( 96,165,250,.15); color: var(--blue);    }
        .b-default       { background: rgba(100,116,139,.15); color: var(--muted);   }
        .b-complete      { background: rgba( 52,211,153,.15); color: var(--green);   }
        .b-failed        { background: rgba(248,113,113,.15); color: var(--red);     }
        .b-processing    { background: rgba(251,191, 36,.15); color: var(--yellow);  }
        .b-rlm_dispatched{ background: rgba(167,139,250,.15); color: var(--purple);  }
        .b-pending       { background: rgba(100,116,139,.15); color: var(--muted);   }
        .ts { margin-left: auto; color: var(--muted); font-size: 10px; }

        /* queue feed */
        .q-item { padding: 9px 14px; border-bottom: 1px solid var(--border); }
        .q-top  { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
        .q-text { line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .q-meta { color: var(--muted); font-size: 10px; margin-top: 3px; }

        /* log drawer */
        .log-drawer {
          width: 480px; flex-shrink: 0;
          border-left: 1px solid var(--border);
          display: flex; flex-direction: column; overflow: hidden;
          background: var(--surface);
        }
        .log-head {
          padding: 7px 14px; border-bottom: 1px solid var(--border);
          display: flex; align-items: center; gap: 8px; flex-shrink: 0;
          font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted);
        }
        .log-close {
          margin-left: auto; cursor: pointer; color: var(--muted);
          font-size: 14px; line-height: 1; padding: 2px 4px; border-radius: 3px;
        }
        .log-close:hover { color: var(--text); background: var(--border); }
        .log-body { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 4px; }

        /* trace event rows */
        .ev { display: flex; gap: 8px; align-items: flex-start; font-size: 11px; line-height: 1.45; }
        .ev-label {
          flex-shrink: 0; width: 80px; text-align: right;
          font-size: 9px; font-weight: 700; text-transform: uppercase;
          letter-spacing: .06em; padding-top: 2px;
        }
        .ev-body { flex: 1; overflow: hidden; }
        .ev-content {
          background: var(--bg); border: 1px solid var(--border);
          border-radius: 3px; padding: 5px 8px;
          white-space: pre-wrap; word-break: break-word;
          max-height: 200px; overflow-y: auto; font-size: 11px;
        }
        .ev-meta { color: var(--muted); font-size: 10px; margin-top: 2px; }

        .ev-user     .ev-label { color: var(--blue);   }
        .ev-llm      .ev-label { color: var(--purple); }
        .ev-tool_in  .ev-label { color: var(--yellow); }
        .ev-tool_out .ev-label { color: var(--green);  }
        .ev-retry    .ev-label { color: var(--yellow); }
        .ev-error    .ev-label { color: var(--red);    }
        .ev-trunc    .ev-label { color: var(--cyan);   }
        .ev-iter     .ev-label { color: var(--muted);  }
        .ev-system   .ev-label { color: var(--muted);  }
        .ev-nudge    .ev-label { color: var(--red);    }

        .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

        /* drawer tabs */
        .log-tabs { display: flex; gap: 1px; margin-left: 8px; }
        .tab-btn {
          padding: 2px 8px; border-radius: 3px; cursor: pointer;
          font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
          color: var(--muted); border: 1px solid transparent;
        }
        .tab-btn:hover { color: var(--text); }
        .tab-btn.active { color: var(--accent); border-color: var(--accent); }

        /* raw loki log lines */
        .log-raw  { font-size: 10.5px; gap: 0; }
        .raw-line {
          padding: 1px 4px; border-bottom: 1px solid rgba(37,42,56,.4);
          white-space: pre-wrap; word-break: break-all; line-height: 1.6; color: var(--text);
        }
        .raw-line:hover { background: rgba(255,255,255,.03); }
        .loki-err { color: var(--red); font-size: 10px; padding: 8px 4px; }

        .empty { color: var(--muted); text-align: center; padding: 48px 20px; }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
      </style>
    </head>
    <body>
    <div id="app">

      <div class="header">
        <div class="logo">⬡ FLEET AGENT</div>
        <div class="stats">
          <div class="stat"><div class="dot pulse" style="background:var(--green)"></div> <strong>{{ counts.complete || 0 }}</strong> done</div>
          <div class="stat"><div class="dot pulse" style="background:var(--yellow)"></div> <strong>{{ counts.processing || 0 }}</strong> active</div>
          <div class="stat"><div class="dot" style="background:var(--purple)"></div> <strong>{{ counts.rlm_dispatched || 0 }}</strong> rlm</div>
          <div class="stat"><div class="dot" style="background:var(--red)"></div> <strong>{{ counts.failed || 0 }}</strong> failed</div>
          <div class="stat" style="color:var(--muted)">conc {{ concurrency }}/{{ maxConc }}</div>
          <div class="tick">↻ {{ tick }}s</div>
        </div>
      </div>

      <div class="dispatch">
        <select v-model="cmd.type">
          <option value="mattermost">mattermost</option>
          <option value="browser_task">browser_task</option>
          <option value="heartbeat">heartbeat</option>
        </select>
        <input v-model="cmd.channel" placeholder="channel" style="width:100px" />
        <input v-if="cmd.type==='browser_task'" v-model="cmd.url" placeholder="url" style="width:200px" />
        <textarea v-model="cmd.instruction" placeholder="instruction… (Ctrl+Enter)" @keydown.ctrl.enter="send"></textarea>
        <button class="btn" @click="send">→ dispatch</button>
        <span v-if="sent" class="sent">queued ✓</span>
      </div>

      <div class="main">
        <div class="left">
          <div class="cols">

            <div class="panel">
              <div class="panel-head">datums <span class="n">{{ datums.length }}</span></div>
              <div class="panel-body">
                <div v-if="datums.length===0" class="empty">no datums yet</div>
                <div class="grid">
                  <div v-for="d in datums" :key="d.id"
                       :class="['card', d.status, selected && selected.id===d.id ? 'selected' : '']"
                       @click="openLog(d)">
                    <div class="card-top">
                      <span :class="['badge','b-'+(d.type||'default')]">{{ d.type }}</span>
                      <span :class="['badge','b-'+d.status]">{{ d.status }}</span>
                      <span class="ts">{{ rel(d.created_at) }}</span>
                    </div>
                    <div class="card-text">{{ d.instruction || d.text || '—' }}</div>
                    <div v-if="d.url" class="card-url">{{ d.url }}</div>
                    <div v-if="d.user||d.channel" class="card-meta">
                      <span v-if="d.user && d.user!=='ui'">@{{ d.user }}</span>
                      <span v-if="d.channel"> · #{{ d.channel }}</span>
                      <span v-if="d.is_long_job"> · rlm</span>
                    </div>
                    <div v-if="d.error" class="card-err">{{ d.error }}</div>
                  </div>
                </div>
              </div>
            </div>

            <div class="panel" style="border-right:none">
              <div class="panel-head">queue <span class="n">{{ queue.length }}</span></div>
              <div class="panel-body flush">
                <div v-if="queue.length===0" class="empty">empty</div>
                <div v-for="item in queue" :key="item.ts+item.instruction" class="q-item">
                  <div class="q-top">
                    <span :class="['badge','b-'+(item.type||'default')]">{{ item.type }}</span>
                    <span v-if="item.channel" style="color:var(--muted)">#{{ item.channel }}</span>
                    <span v-if="item.user&&item.user!=='ui'" style="color:var(--muted)">@{{ item.user }}</span>
                  </div>
                  <div class="q-text">{{ item.instruction || item.text || item.type }}</div>
                  <div class="q-meta">{{ rel(item.ts) }}</div>
                </div>
              </div>
            </div>

          </div>
        </div>

        <!-- log drawer -->
        <div v-if="selected" class="log-drawer">
          <div class="log-head">
            <span>{{ selected.id }}</span>
            <div class="log-tabs">
              <div :class="['tab-btn', activeTab==='trace' ? 'active' : '']"
                   @click="activeTab='trace'">trace</div>
              <div :class="['tab-btn', activeTab==='logs' ? 'active' : '']"
                   @click="activeTab='logs'">logs</div>
            </div>
            <div v-if="streaming || lokiStreaming" class="dot live-dot pulse" style="margin-left:6px"></div>
            <span v-if="streaming || lokiStreaming" style="color:var(--green)">live</span>
            <span class="log-close" @click="closeLog">✕</span>
          </div>

          <!-- TRACE tab -->
          <div v-show="activeTab==='trace'" class="log-body" ref="logBody">
            <div v-if="traceEvents.length===0" class="empty">loading trace…</div>
            <div v-for="(ev, i) in traceEvents" :key="i" :class="['ev', evClass(ev)]">
              <div class="ev-label">{{ evLabel(ev) }}</div>
              <div class="ev-body">
                <div v-if="evText(ev)" class="ev-content">{{ evText(ev) }}</div>
                <div v-if="evMeta(ev)" class="ev-meta">{{ evMeta(ev) }}</div>
              </div>
            </div>
          </div>

          <!-- LOGS tab (raw Loki lines) -->
          <div v-show="activeTab==='logs'" class="log-body log-raw" ref="logRawBody">
            <div v-if="lokiError" class="loki-err">{{ lokiError }}</div>
            <div v-else-if="lokiLines.length===0" class="empty">
              no logs yet — Loki collects logs tagged [D:datum_id]<br>
              (requires fleet-agent pod restart after this update)
            </div>
            <div v-for="(line, i) in lokiLines" :key="i" class="raw-line">{{ line }}</div>
          </div>
        </div>

      </div>
    </div>

    <script>
    const { createApp, ref, reactive, computed, watch, nextTick, onMounted, onUnmounted } = Vue

    createApp({
      setup() {
        const queue         = ref([])
        const datums        = ref([])
        const selected      = ref(null)
        const traceEvents   = ref([])
        const streaming     = ref(false)
        const activeTab     = ref('trace')
        const lokiLines     = ref([])
        const lokiStreaming  = ref(false)
        const lokiError     = ref('')
        const tick          = ref(5)
        const sent          = ref(false)
        const logBody       = ref(null)
        const logRawBody    = ref(null)
        const maxConc       = ref(3)

        const cmd = reactive({ type: 'mattermost', channel: 'fleet-ops', instruction: '', url: '' })

        const counts = computed(() => {
          const c = {}
          for (const d of datums.value) c[d.status] = (c[d.status] || 0) + 1
          return c
        })

        const concurrency = computed(() =>
          datums.value.filter(d => d.status === 'processing').length
        )

        function rel(ts) {
          if (!ts) return ''
          const s = Math.floor((Date.now() - new Date(ts)) / 1000)
          if (s < 60)    return s + 's'
          if (s < 3600)  return Math.floor(s/60)  + 'm'
          if (s < 86400) return Math.floor(s/3600) + 'h'
          return new Date(ts).toLocaleDateString()
        }

        // trace event rendering
        function evClass(ev) {
          const t = ev.type || ''
          if (t === 'user_message')                    return 'ev-user'
          if (t === 'assistant_message')               return 'ev-llm'
          if (t === 'tool_start')                      return 'ev-tool_in'
          if (t === 'tool_end')                        return 'ev-tool_out'
          if (t === 'tool_retry' || t === 'llm_retry') return 'ev-retry'
          if (t === 'tool_error')                      return 'ev-error'
          if (t === 'ctx_truncated')                   return 'ev-trunc'
          if (t === 'iter_start')                      return 'ev-iter'
          if (t === 'nudge')                           return 'ev-nudge'
          return 'ev-system'
        }
        function evLabel(ev) {
          const t = ev.type || ''
          if (t === 'user_message')      return 'user'
          if (t === 'assistant_message') return 'llm'
          if (t === 'tool_start')        return '→ ' + (ev.name || 'tool')
          if (t === 'tool_end')          return '← ' + (ev.name || 'tool')
          if (t === 'tool_retry')        return '↻ ' + (ev.name || 'tool')
          if (t === 'tool_retry_ok')     return '✓ ' + (ev.name || 'tool')
          if (t === 'tool_error')        return '✗ ' + (ev.name || 'tool')
          if (t === 'llm_retry')         return 'llm retry'
          if (t === 'ctx_truncated')     return 'truncated'
          if (t === 'iter_start')        return 'iter ' + ev.iter
          if (t === 'tools_ready')       return 'tools'
          if (t === 'nudge')             return 'nudge'
          if (t === 'run_end')           return 'done'
          if (t === 'stream_end')        return '—'
          return t
        }
        function evText(ev) {
          const t = ev.type || ''
          if (t === 'user_message')      return ev.content || ''
          if (t === 'assistant_message') return ev.content || ''
          if (t === 'tool_start')        return JSON.stringify(ev.input || {}, null, 2)
          if (t === 'tool_end')          return ev.output || ''
          if (t === 'tool_retry')        return `attempt ${ev.attempt} — retrying in ${ev.wait}s`
          if (t === 'tool_retry_ok')     return `succeeded on attempt ${ev.attempt}`
          if (t === 'tool_error')        return ev.error || ''
          if (t === 'llm_retry')         return `attempt ${ev.attempt} — retrying in ${ev.wait}s`
          if (t === 'ctx_truncated')     return `context trimmed to ${ev.kept} messages`
          if (t === 'tools_ready')       return (ev.names || []).join(', ')
          if (t === 'run_end')           return `status: ${ev.status}  iters: ${ev.iters}`
          if (t === 'nudge')             return `forcing reply to #${ev.target}`
          return JSON.stringify(ev)
        }
        function evMeta(ev) {
          const parts = []
          if (ev.model)  parts.push(ev.model)
          if (ev.usage)  parts.push(`in=${ev.usage.in} out=${ev.usage.out}`)
          if (ev.ts)     parts.push(rel(ev.ts))
          return parts.join('  ·  ')
        }

        let es = null, lokiEs = null

        function closeLog() {
          if (es)     { es.close();     es     = null }
          if (lokiEs) { lokiEs.close(); lokiEs = null }
          selected.value     = null
          traceEvents.value  = []
          lokiLines.value    = []
          lokiError.value    = ''
          streaming.value    = false
          lokiStreaming.value = false
        }

        async function openLog(d) {
          if (es)     { es.close();     es     = null }
          if (lokiEs) { lokiEs.close(); lokiEs = null }
          selected.value     = d
          traceEvents.value  = []
          lokiLines.value    = []
          lokiError.value    = ''
          streaming.value    = false
          lokiStreaming.value = false

          const done = ['complete','failed','rlm_dispatched'].includes(d.status)

          // ── Structured trace (existing .jsonl) ──
          if (done) {
            try {
              traceEvents.value = await fetch(`/api/traces/${d.id}`).then(r => r.json())
              await nextTick()
              if (logBody.value) logBody.value.scrollTop = logBody.value.scrollHeight
            } catch(e) { console.warn('trace load', e) }
          } else {
            streaming.value = true
            es = new EventSource(`/api/traces/${d.id}/stream`)
            es.onmessage = async (e) => {
              try {
                const ev = JSON.parse(e.data)
                if (ev.type === 'stream_end') {
                  streaming.value = false; es.close(); es = null; return
                }
                traceEvents.value.push(ev)
                await nextTick()
                if (logBody.value) logBody.value.scrollTop = logBody.value.scrollHeight
              } catch(_) {}
            }
            es.onerror = () => { streaming.value = false }
          }

          // ── Loki raw logs ──
          try {
            const resp = await fetch(`/api/logs/${d.id}`)
            const data = await resp.json()
            if (data.error) {
              lokiError.value = 'Loki: ' + data.error
            } else {
              lokiLines.value = data.lines || []
              await nextTick()
              if (logRawBody.value) logRawBody.value.scrollTop = logRawBody.value.scrollHeight
            }
          } catch(e) { lokiError.value = 'Loki unavailable' }

          if (!done) {
            lokiStreaming.value = true
            lokiEs = new EventSource(`/api/logs/${d.id}/stream`)
            lokiEs.onmessage = async (e) => {
              try {
                const ev = JSON.parse(e.data)
                if (ev.type === 'stream_end') {
                  lokiStreaming.value = false; lokiEs.close(); lokiEs = null; return
                }
                if (ev.line) {
                  lokiLines.value.push(ev.line)
                  await nextTick()
                  if (logRawBody.value) logRawBody.value.scrollTop = logRawBody.value.scrollHeight
                }
              } catch(_) {}
            }
            lokiEs.onerror = () => { lokiStreaming.value = false }
          }
        }

        async function refresh() {
          try {
            const [q, d] = await Promise.all([
              fetch('/api/queue').then(r => r.json()),
              fetch('/api/datums').then(r => r.json()),
            ])
            queue.value  = q
            datums.value = d
            // Update selected datum status if drawer is open
            if (selected.value) {
              const updated = d.find(x => x.id === selected.value.id)
              if (updated) selected.value = updated
            }
          } catch(e) { console.warn('refresh', e) }
        }

        async function send() {
          if (!cmd.instruction.trim()) return
          const body = { type: cmd.type, channel: cmd.channel, instruction: cmd.instruction }
          if (cmd.url) body.url = cmd.url
          await fetch('/api/dispatch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          })
          cmd.instruction = ''; cmd.url = ''
          sent.value = true
          setTimeout(() => { sent.value = false }, 2000)
          await refresh()
        }

        let timer, countdown
        onMounted(() => {
          refresh()
          timer     = setInterval(refresh, 5000)
          countdown = setInterval(() => { tick.value = tick.value <= 1 ? 5 : tick.value - 1 }, 1000)
        })
        onUnmounted(() => {
          clearInterval(timer); clearInterval(countdown)
          if (es) es.close()
        })

        return { queue, datums, cmd, counts, concurrency, maxConc, tick, sent,
                 selected, traceEvents, streaming, logBody,
                 activeTab, lokiLines, lokiStreaming, lokiError, logRawBody,
                 rel, evClass, evLabel, evText, evMeta,
                 openLog, closeLog, send }
      }
    }).mount('#app')
    </script>
    </body>
    </html>
