apiVersion: v1
kind: ConfigMap
metadata:
  name: fleet-agent-harness
  namespace: fleet-agent
data:
  agent.py: |
    #!/usr/bin/env python3
    """
    Fleet agent harness: watches queue.jsonl, runs LLM agent with MCP tools.
    Features inspired by pi-mom: per-channel context, memory, skills, log.jsonl.
    Uses a custom MCP SSE client compatible with the mcp-tools server protocol.
    """
    import asyncio, json, logging, os, re
    from pathlib import Path
    from datetime import datetime, timezone
    from contextlib import asynccontextmanager
    from openai import OpenAI
    import httpx

    logging.basicConfig(level=logging.INFO, format="[%(asctime)s] %(message)s", datefmt="%Y-%m-%dT%H:%M:%SZ")
    log = logging.getLogger(__name__)

    LITELLM_URL        = os.environ.get("OPENAI_BASE_URL", "http://litellm-proxy.default.svc.cluster.local:4000/v1")
    LITELLM_KEY        = os.environ.get("OPENAI_API_KEY", "not-required")
    MODEL              = os.environ.get("FLEET_MODEL", "Nanbeige/Nanbeige4.1-3B")
    MCP_URL            = os.environ.get("MCP_URL", "http://mcp-tools.mcp-tools.svc.cluster.local:3000/sse")
    MCP_URLS           = [u.strip() for u in os.environ.get("MCP_URLS", MCP_URL).split(",") if u.strip()]
    QUEUE_FILE         = Path(os.environ.get("QUEUE_FILE", "/data/queue/queue.jsonl"))
    WORKSPACE          = Path(os.environ.get("WORKSPACE", "/workspace"))
    DATA_DIR           = Path(os.environ.get("DATA_DIR", "/data"))
    MAX_ITERS          = int(os.environ.get("AGENT_MAX_ITERS", "20"))
    MAX_CTX_MSGS       = int(os.environ.get("AGENT_MAX_CTX_MSGS", "6"))
    MAX_TOOL_RESULT    = int(os.environ.get("AGENT_MAX_TOOL_RESULT", "2000"))  # chars
    MAX_TOOLS_PER_TURN = int(os.environ.get("AGENT_MAX_TOOLS_PER_TURN", "3"))
    DATUM_DIR          = DATA_DIR / "datums"
    TRACE_DIR          = DATA_DIR / "traces"
    QUEUE_CONCURRENCY  = int(os.environ.get("QUEUE_CONCURRENCY", "3"))

    llm = OpenAI(base_url=LITELLM_URL, api_key=LITELLM_KEY)

    # ── Custom MCP SSE client ────────────────────────────────────────────────
    # The mcp-tools server sends: event: endpoint / data: {"uri":"/message?sessionId=..."}
    # The official mcp Python lib expects a plain path, so we use our own client.

    @asynccontextmanager
    async def mcp_session(sse_url: str):
        pending: dict = {}
        post_url_ref  = [None]
        _id_counter   = [1]

        async def sse_reader(client: httpx.AsyncClient):
            event_type = None
            async with client.stream("GET", sse_url,
                                     headers={"Accept": "text/event-stream"},
                                     timeout=None) as resp:
                async for line in resp.aiter_lines():
                    if line.startswith("event:"):
                        event_type = line[6:].strip()
                    elif line.startswith("data:"):
                        raw = line[5:].strip()
                        if event_type == "endpoint":
                            try:
                                parsed = json.loads(raw)
                                uri = parsed.get("uri", raw)
                            except json.JSONDecodeError:
                                uri = raw
                            base = sse_url.rsplit("/sse", 1)[0]
                            post_url_ref[0] = base + uri
                        elif raw:
                            try:
                                msg = json.loads(raw)
                                mid = msg.get("id")
                                if mid in pending and not pending[mid].done():
                                    pending[mid].set_result(msg)
                            except Exception:
                                pass
                        event_type = None

        async def rpc(client, method: str, params: dict):
            fid = _id_counter[0]
            _id_counter[0] += 1
            fut = asyncio.get_event_loop().create_future()
            pending[fid] = fut
            await client.post(post_url_ref[0],
                              json={"jsonrpc": "2.0", "id": fid,
                                    "method": method, "params": params})
            return await asyncio.wait_for(fut, timeout=60)

        async with httpx.AsyncClient(timeout=httpx.Timeout(60)) as client:
            task = asyncio.create_task(sse_reader(client))
            for _ in range(40):         # wait up to 2 s for endpoint
                if post_url_ref[0]:
                    break
                await asyncio.sleep(0.05)
            if not post_url_ref[0]:
                task.cancel()
                raise RuntimeError("MCP server did not send endpoint event")

            # Initialize
            await rpc(client, "initialize", {
                "protocolVersion": "2024-11-05",
                "capabilities": {},
                "clientInfo": {"name": "fleet-agent", "version": "1.0"},
            })

            class Session:
                async def list_tools(self):
                    result = await rpc(client, "tools/list", {})
                    return result.get("result", {}).get("tools", [])

                async def call_tool(self, name: str, arguments: dict):
                    result = await rpc(client, "tools/call",
                                       {"name": name, "arguments": arguments})
                    return result.get("result", {})

            try:
                yield Session()
            finally:
                task.cancel()
                try:
                    await task
                except asyncio.CancelledError:
                    pass

    @asynccontextmanager
    async def merged_mcp_sessions(urls: list):
        """Connect to multiple MCP SSE backends and present them as a single merged session."""
        from contextlib import AsyncExitStack
        async with AsyncExitStack() as stack:
            tool_to_session = {}
            all_tools = []
            for url in urls:
                try:
                    session = await stack.enter_async_context(mcp_session(url))
                    raw = await session.list_tools()
                    for t in raw:
                        name = t["name"]
                        if name not in tool_to_session:
                            tool_to_session[name] = session
                            all_tools.append(t)
                    log.info("MCP backend connected: %s (%d tools)", url, len(raw))
                except Exception as e:
                    log.warning("MCP backend unavailable, skipping %s: %s", url, e)

            if not tool_to_session:
                raise RuntimeError("No MCP backends available from: %s" % urls)

            class MergedSession:
                async def list_tools(self_inner):
                    return all_tools

                async def call_tool(self_inner, name: str, arguments: dict):
                    sess = tool_to_session.get(name)
                    if sess is None:
                        return {"content": [{"type": "text", "text": f"Unknown tool: {name}"}]}
                    return await sess.call_tool(name, arguments)

            yield MergedSession()

    # ── Context helpers ──────────────────────────────────────────────────────

    def load_soul() -> str:
        parts = []
        for name in ("SOUL.md", "AGENTS.md"):
            p = WORKSPACE / name
            if p.exists():
                parts.append(p.read_text())
        return "\n\n".join(parts)

    def load_heartbeat() -> str:
        p = WORKSPACE / "HEARTBEAT.md"
        return p.read_text() if p.exists() else ""

    def load_skills() -> str:
        parts = []
        for skills_dir in [WORKSPACE / ".pi" / "skills", WORKSPACE / "skills"]:
            if skills_dir.exists():
                for skill_md in sorted(skills_dir.rglob("SKILL.md")):
                    try:
                        parts.append(f"## Skill: {skill_md.parent.name}\n{skill_md.read_text()}")
                    except Exception:
                        pass
        return ("# Available Skills\n\n" + "\n\n".join(parts)) if parts else ""

    # ── Per-channel persistence ──────────────────────────────────────────────

    def channel_dir(channel: str) -> Path:
        d = DATA_DIR / "channels" / channel
        d.mkdir(parents=True, exist_ok=True)
        return d

    def load_memory(channel: str) -> str:
        parts = []
        for mem_path, label in [
            (DATA_DIR / "MEMORY.md",             "Global Memory"),
            (channel_dir(channel) / "MEMORY.md", f"Channel Memory ({channel})"),
        ]:
            if mem_path.exists():
                parts.append(f"# {label}\n{mem_path.read_text()}")
        return "\n\n".join(parts)

    def load_context(channel: str) -> list:
        ctx_file = channel_dir(channel) / "context.jsonl"
        if not ctx_file.exists():
            return []
        messages = []
        try:
            for line in ctx_file.read_text().splitlines():
                line = line.strip()
                if line:
                    messages.append(json.loads(line))
        except Exception as e:
            log.warning("Failed to load context for %s: %s", channel, e)
        return messages[-MAX_CTX_MSGS:]

    def _strip_think(text: str) -> str:
        """Remove <think>...</think> reasoning blocks before persisting to context."""
        return re.sub(r'<think>.*?</think>', '', text, flags=re.DOTALL).strip()

    def save_context(channel: str, messages: list):
        ctx_file = channel_dir(channel) / "context.jsonl"
        to_save = [m for m in messages if m.get("role") != "system"]
        try:
            with open(ctx_file, "w") as f:
                for m in to_save[-MAX_CTX_MSGS:]:
                    # Strip <think> blocks from assistant messages — they bloat context
                    if m.get("role") == "assistant" and m.get("content"):
                        m = {**m, "content": _strip_think(m["content"])}
                    f.write(json.dumps(m) + "\n")
        except Exception as e:
            log.warning("Failed to save context for %s: %s", channel, e)

    def append_log(channel: str, entry: dict):
        log_file = channel_dir(channel) / "log.jsonl"
        try:
            with open(log_file, "a") as f:
                entry["ts"] = datetime.now(timezone.utc).isoformat()
                f.write(json.dumps(entry) + "\n")
        except Exception as e:
            log.warning("Failed to write log for %s: %s", channel, e)

    # ── Datum tracking ───────────────────────────────────────────────────────

    def write_datum(item: dict, status: str = "processing") -> str:
        DATUM_DIR.mkdir(parents=True, exist_ok=True)
        datum_id = item.get("id") or datetime.now(timezone.utc).strftime("%Y%m%d-%H%M%S-%f")
        datum = {**item, "id": datum_id, "status": status,
                 "created_at": datetime.now(timezone.utc).isoformat()}
        (DATUM_DIR / f"{datum_id}.json").write_text(json.dumps(datum, indent=2))
        return datum_id

    def update_datum(datum_id: str, **kwargs):
        path = DATUM_DIR / f"{datum_id}.json"
        if path.exists():
            datum = json.loads(path.read_text())
            datum.update(kwargs)
            datum["updated_at"] = datetime.now(timezone.utc).isoformat()
            path.write_text(json.dumps(datum, indent=2))

    # ── Agent loop ───────────────────────────────────────────────────────────

    async def run_agent(instruction: str, channel: str = "default", load_prior: bool = True,
                        need_reply: bool = False, reply_channel: str = "", datum_id: str = ""):
        soul   = load_soul()
        memory = load_memory(channel)
        skills = load_skills()
        system = "\n\n".join(filter(None, [soul, memory, skills]))

        prior    = load_context(channel) if load_prior else []
        messages = [{"role": "system", "content": system}] + prior + [
            {"role": "user", "content": instruction}
        ]
        append_log(channel, {"role": "user", "content": instruction})

        # ── Trace writer ─────────────────────────────────────────────────────
        trace_events: list = []
        trace_jsonl = (TRACE_DIR / f"{datum_id}.jsonl") if datum_id else None
        trace_json  = (TRACE_DIR / f"{datum_id}.json")  if datum_id else None
        if datum_id:
            TRACE_DIR.mkdir(parents=True, exist_ok=True)

        def emit(event: dict):
            if not datum_id:
                return
            event["ts"] = datetime.now(timezone.utc).isoformat()
            trace_events.append(event)
            try:
                with open(trace_jsonl, "a") as _f:
                    _f.write(json.dumps(event) + "\n")
            except Exception:
                pass

        emit({"type": "user_message", "content": instruction})
        log.info("MCP connect, channel=%s prior_msgs=%d urls=%s datum=%s",
                 channel, len(prior), MCP_URLS, datum_id or "none")

        async with merged_mcp_sessions(MCP_URLS) as session:
            raw_tools = await session.list_tools()
            tools = [
                {
                    "type": "function",
                    "function": {
                        "name": t["name"],
                        "description": t.get("description", ""),
                        "parameters": t.get("inputSchema", {}),
                    },
                }
                for t in raw_tools
            ]
            log.info("Tools: %s", [t["function"]["name"] for t in tools])
            emit({"type": "tools_ready", "names": [t["function"]["name"] for t in tools]})

            new_msgs = []
            replied  = False
            iters_done = 0

            for iteration in range(MAX_ITERS):
                iters_done = iteration + 1
                emit({"type": "iter_start", "iter": iters_done})

                response = llm.chat.completions.create(
                    model=MODEL,
                    messages=messages,
                    tools=tools or None,
                    max_tokens=2048,
                )
                msg = response.choices[0].message
                actual_model = getattr(response, "model", MODEL)
                usage = getattr(response, "usage", None)
                usage_str = (f"in={usage.prompt_tokens} out={usage.completion_tokens}"
                             if usage else "usage=?")
                log.info("--- iter %d/%d | model=%s | %s ---",
                         iters_done, MAX_ITERS, actual_model, usage_str)

                if msg.content:
                    preview = msg.content.replace("\n", " ")[:300]
                    log.info("  [reasoning] %s%s", preview,
                             " ..." if len(msg.content) > 300 else "")
                    emit({"type": "assistant_message", "content": msg.content,
                          "model": actual_model,
                          "usage": {"in": usage.prompt_tokens,
                                    "out": usage.completion_tokens} if usage else {}})

                assistant_msg = {"role": "assistant", "content": msg.content or ""}
                if msg.tool_calls:
                    assistant_msg["tool_calls"] = [
                        {
                            "id": tc.id,
                            "type": "function",
                            "function": {"name": tc.function.name, "arguments": tc.function.arguments},
                        }
                        for tc in msg.tool_calls
                    ]
                messages.append(assistant_msg)
                new_msgs.append(assistant_msg)

                if not msg.tool_calls:
                    log.info("  [done] no more tool calls after %d iteration(s)", iters_done)
                    if msg.content:
                        append_log(channel, {"role": "assistant", "content": msg.content})
                    break

                # Limit tools per turn to avoid context explosion
                active_calls = msg.tool_calls[:MAX_TOOLS_PER_TURN]
                skipped = len(msg.tool_calls) - len(active_calls)
                if skipped:
                    log.info("  [skip] %d tool calls over limit (%d/turn)", skipped, MAX_TOOLS_PER_TURN)

                for tc in active_calls:
                    args = json.loads(tc.function.arguments) if tc.function.arguments else {}
                    log.info("  [call] %s | args=%s", tc.function.name, json.dumps(args)[:200])
                    emit({"type": "tool_start", "name": tc.function.name, "input": args})
                    try:
                        result  = await session.call_tool(tc.function.name, args)
                        content_items = result.get("content", [])
                        content = content_items[0].get("text", "") if content_items else str(result)
                    except Exception as e:
                        content = f"Tool error: {e}"
                        log.error("  [error] %s failed: %s", tc.function.name, e)
                    if len(content) > MAX_TOOL_RESULT:
                        content = content[:MAX_TOOL_RESULT] + f"\n... [truncated, {len(content)} chars total]"
                    log.info("  [result] %s | %s%s",
                             tc.function.name,
                             content[:200].replace("\n", " "),
                             " ..." if len(content) > 200 else "")
                    emit({"type": "tool_end", "name": tc.function.name, "output": content[:1000]})
                    tool_msg = {"role": "tool", "tool_call_id": tc.id, "content": content}
                    messages.append(tool_msg)
                    new_msgs.append(tool_msg)
                    if tc.function.name == "mattermost_post" and content.startswith("Posted to"):
                        replied = True
                        break

                if replied:
                    log.info("  [posted] reply sent — stopping loop")
                    break

                for tc in msg.tool_calls[MAX_TOOLS_PER_TURN:]:
                    messages.append({"role": "tool", "tool_call_id": tc.id,
                                     "content": "Skipped (too many parallel calls; call this tool again in the next turn)"})
                    new_msgs.append({"role": "tool", "tool_call_id": tc.id,
                                     "content": "Skipped — call again"})
            else:
                log.warning("Agent hit max iterations (%d)", MAX_ITERS)
                emit({"type": "run_end", "status": "max_iters", "iters": iters_done})

            # Force-reply: model gathered info but forgot to call mattermost_post
            if need_reply and not replied:
                target = reply_channel or channel
                log.info("No reply posted yet — nudging model to post to #%s", target)
                emit({"type": "nudge", "target": target})
                messages.append({"role": "user",
                                  "content": f"STOP. You MUST call mattermost_post RIGHT NOW. "
                                             f"channel=\"{target}\". Do not call any other tool first. "
                                             f"Post a concise summary of what you found or did."})
                try:
                    r2 = llm.chat.completions.create(model=MODEL, messages=messages,
                                                      tools=tools or None, max_tokens=512)
                    m2 = r2.choices[0].message
                    if m2.tool_calls:
                        tc = m2.tool_calls[0]
                        args = json.loads(tc.function.arguments) if tc.function.arguments else {}
                        log.info("  nudge -> %s(%s)", tc.function.name, list(args.keys()))
                        if tc.function.name == "mattermost_post":
                            result = await session.call_tool(tc.function.name, args)
                            content_items = result.get("content", [])
                            content = content_items[0].get("text", "") if content_items else str(result)
                            log.info("  nudge result: %s", content[:80])
                            emit({"type": "tool_end", "name": "mattermost_post",
                                  "output": content[:200], "nudge": True})
                            new_msgs.append({"role": "assistant", "content": "", "tool_calls": [
                                {"id": tc.id, "type": "function",
                                 "function": {"name": tc.function.name, "arguments": tc.function.arguments}}
                            ]})
                            new_msgs.append({"role": "tool", "tool_call_id": tc.id, "content": content})
                        else:
                            log.warning("  nudge called %s instead of mattermost_post — forcing fallback post",
                                        tc.function.name)
                            fallback = ("I processed your request but encountered an issue composing a reply. "
                                        "Please try again or check #fleet-ops logs.")
                            result = await session.call_tool("mattermost_post",
                                                              {"channel": target, "message": fallback})
                            content_items = result.get("content", [])
                            content = content_items[0].get("text", "") if content_items else str(result)
                            log.info("  fallback post result: %s", content[:80])
                    elif m2.content:
                        log.info("  nudge got text reply — posting directly")
                        text_reply = _strip_think(m2.content)[:1000]
                        if text_reply:
                            result = await session.call_tool("mattermost_post",
                                                              {"channel": target, "message": text_reply})
                            content_items = result.get("content", [])
                            content = content_items[0].get("text", "") if content_items else str(result)
                            log.info("  text-to-post result: %s", content[:80])
                except Exception as e:
                    log.error("Nudge call failed: %s", e)

            emit({"type": "run_end", "status": "complete", "iters": iters_done})

            # Write consolidated .json for the trace processor (training data pipeline)
            if datum_id and trace_events:
                try:
                    trace_json.write_text(json.dumps(trace_events))
                except Exception as e:
                    log.warning("Failed to write trace json for %s: %s", datum_id, e)

            save_context(channel, prior + new_msgs)

    # ── Queue processor ──────────────────────────────────────────────────────

    # Keywords that signal a long-running agentic job vs. a quick inline reply
    LONG_JOB_KEYWORDS = [
        "fill", "browse", "scrape", "research", "monitor", "watch",
        "keep checking", "search the web", "analyze", "generate report",
    ]

    async def process_item(item: dict):
        itype = item.get("type", "unknown")
        log.info("Queue item: type=%s", itype)
        datum_id = write_datum(item)

        try:
            if itype == "heartbeat":
                channel     = "heartbeat"
                hb          = load_heartbeat()
                instruction = (
                    item.get("instruction", "Run the HEARTBEAT.md checklist.")
                    + (f"\n\n---\nHEARTBEAT.md:\n{hb}" if hb else "")
                )
                await run_agent(instruction, channel=channel, load_prior=False, datum_id=datum_id)

            elif itype == "browser_task":
                channel     = item.get("channel", "fleet-ops")
                url         = item.get("url", "")
                ctx_ch      = item.get("context_channel", "form-context")
                instruction = (
                    f"Browser task requested.\n"
                    f"Instruction: {item.get('instruction', '')}\n"
                    f"Target URL: {url}\n"
                    f"User profile context is in Mattermost #{ctx_ch} — use bash_exec "
                    f"with curl to fetch that channel's history via the Mattermost REST API, "
                    f"then use launch_rlm_job(prompt=..., notify_channel=\"{channel}\", "
                    f"max_iterations=20) to handle the task asynchronously. "
                    f"After launching, call mattermost_post to confirm to #{channel}."
                )
                update_datum(datum_id, status="rlm_dispatched")
                await run_agent(instruction, channel=channel, need_reply=True,
                                reply_channel=channel, datum_id=datum_id)

            elif itype == "mattermost":
                channel = item.get("channel", "fleet-ops")
                user    = item.get("user", "user")
                text    = item.get("text", "")
                is_long = any(kw in text.lower() for kw in LONG_JOB_KEYWORDS)

                if is_long:
                    instruction = (
                        f"User @{user} in #{channel}: {text}\n\n"
                        f"This is a long-running task. Use launch_rlm_job(prompt=..., "
                        f"notify_channel=\"{channel}\", max_iterations=20) to handle it "
                        f"asynchronously, then call mattermost_post to confirm the job started."
                    )
                    update_datum(datum_id, is_long_job=True, status="rlm_dispatched")
                else:
                    instruction = (
                        f"User @{user} says in #{channel}: {text}\n\n"
                        f"IMPORTANT: Call mattermost_post(channel=\"{channel}\", message=\"...\") "
                        f"EXACTLY ONCE to reply. You may use other tools first to gather info, "
                        f"but send only ONE reply then stop."
                    )
                await run_agent(instruction, channel=channel,
                                need_reply=True, reply_channel=channel, datum_id=datum_id)

            else:
                channel     = "default"
                instruction = item.get("instruction") or json.dumps(item)
                await run_agent(instruction, channel=channel, datum_id=datum_id)

            update_datum(datum_id, status="complete")

        except Exception as e:
            update_datum(datum_id, status="failed", error=str(e))
            log.error("Agent error type=%s: %s", itype, e)

    _queue_sem = asyncio.Semaphore(QUEUE_CONCURRENCY)

    async def _run_item_sem(item: dict):
        """Wrap process_item with the concurrency semaphore."""
        async with _queue_sem:
            await process_item(item)

    async def watch_queue():
        QUEUE_FILE.parent.mkdir(parents=True, exist_ok=True)
        QUEUE_FILE.touch(exist_ok=True)
        log.info("Watching queue: %s  (model=%s  concurrency=%d)",
                 QUEUE_FILE, MODEL, QUEUE_CONCURRENCY)
        last_pos = QUEUE_FILE.stat().st_size

        while True:
            await asyncio.sleep(5)
            try:
                size = QUEUE_FILE.stat().st_size
            except FileNotFoundError:
                last_pos = 0
                continue

            if size < last_pos:
                last_pos = 0
            if size == last_pos:
                continue

            with open(QUEUE_FILE) as f:
                f.seek(last_pos)
                for raw in f:
                    raw = raw.strip()
                    if not raw:
                        continue
                    try:
                        item = json.loads(raw)
                        asyncio.create_task(_run_item_sem(item))
                    except json.JSONDecodeError as e:
                        log.error("Bad queue line: %s — %s", raw[:80], e)
                    except Exception as e:
                        log.error("Unexpected error dispatching item: %s", e)
            last_pos = QUEUE_FILE.stat().st_size

    if __name__ == "__main__":
        asyncio.run(watch_queue())
