apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-agent
  namespace: fleet-agent
  labels:
    app: fleet-agent
    app.kubernetes.io/part-of: miladyos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fleet-agent
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: fleet-agent
    spec:
      serviceAccountName: fleet-agent
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: fleet-agent-data
      - name: workspace
        configMap:
          name: fleet-agent-workspace
      - name: harness
        configMap:
          name: fleet-agent-harness
          defaultMode: 0755
      - name: trace-processor
        configMap:
          name: trace-processor
      - name: webhook-bridge
        configMap:
          name: webhook-bridge
      - name: fleet-agent-ui-vol
        configMap:
          name: fleet-agent-ui

      containers:
      # --- Python agent harness (queue-watching LLM agent with MCP tools) ---
      - name: fleet-agent
        image: python:3.12-alpine
        command: ["/bin/sh", "-c"]
        args:
        - |
          pip install --quiet --no-cache-dir openai httpx

          # Set up workspace from ConfigMap
          mkdir -p /workspace /data/traces /data/training /data/queue
          cp /config/SOUL.md /workspace/SOUL.md
          cp /config/AGENTS.md /workspace/AGENTS.md
          cp /config/HEARTBEAT.md /workspace/HEARTBEAT.md

          # Queue file (append-only log of instructions/triggers)
          touch /data/queue/queue.jsonl

          echo "[$(date)] Fleet agent starting, watching queue at /data/queue/queue.jsonl"
          exec python3 /harness/agent.py

        env:
        - name: OPENAI_API_KEY
          value: "not-required"
        - name: OPENAI_BASE_URL
          value: "http://litellm-proxy.default.svc.cluster.local:4000/v1"
        - name: FLEET_MODEL
          value: "fleet-agent"
        - name: MCP_URL
          value: "http://mcp-tools.mcp-tools.svc.cluster.local:3000/sse"
        - name: MCP_URLS
          value: "http://mcp-tools.mcp-tools.svc.cluster.local:3000/sse,http://miladyos.default.svc.cluster.local:6000/sse"

        volumeMounts:
        - name: data
          mountPath: /data
        - name: workspace
          mountPath: /config
        - name: harness
          mountPath: /harness

        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi

      # --- Trace processor sidecar ---
      - name: trace-processor
        image: python:3.12-alpine
        command: ["/bin/sh", "-c"]
        args:
        - |
          apk add --no-cache inotify-tools
          pip install --quiet inotify 2>/dev/null || true
          exec python3 /scripts/processor.py

        volumeMounts:
        - name: data
          mountPath: /data
        - name: trace-processor
          mountPath: /scripts

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

      # --- Mattermost webhook bridge sidecar ---
      - name: webhook-bridge
        image: python:3.12-alpine
        command: ["python3", "/scripts/bridge.py"]
        ports:
        - containerPort: 9000
          name: webhook
        env:
        - name: OUTGOING_WEBHOOK_TOKEN
          valueFrom:
            secretKeyRef:
              name: mattermost-bot-secret
              key: MATTERMOST_OUTGOING_WEBHOOK_TOKEN
        - name: BOT_USERNAME
          value: fleet-agent
        volumeMounts:
        - name: data
          mountPath: /data
        - name: webhook-bridge
          mountPath: /scripts
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi

      # --- Fleet Agent UI (Vue3 dashboard + FastAPI) ---
      - name: fleet-agent-ui
        image: python:3.12-alpine
        command: ["/bin/sh", "-c"]
        args:
        - |
          pip install --quiet --no-cache-dir fastapi uvicorn
          exec python3 /ui/server.py
        env:
        - name: DATA_DIR
          value: "/data"
        - name: UI_DIR
          value: "/ui"
        ports:
        - containerPort: 8080
          name: ui
        volumeMounts:
        - name: data
          mountPath: /data
        - name: fleet-agent-ui-vol
          mountPath: /ui
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi

      # --- Heartbeat CronJob trigger (queue writer) ---
      # Note: CronJob is defined separately; the heartbeat trigger
      # writes {"type":"heartbeat","ts":"..."} to /data/queue/queue.jsonl
---
# CronJob that writes heartbeat trigger to queue every 30 minutes
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fleet-heartbeat
  namespace: fleet-agent
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: fleet-agent-data
          containers:
          - name: trigger
            image: alpine:3.19
            command: ["/bin/sh", "-c"]
            args:
            - |
              TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              echo "{\"type\":\"heartbeat\",\"ts\":\"$TS\",\"instruction\":\"Run the HEARTBEAT.md checklist. Report any WARNING or CRITICAL findings. Return HEARTBEAT_OK if all clear.\"}" >> /data/queue/queue.jsonl
              echo "Heartbeat trigger written at $TS"
            volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
