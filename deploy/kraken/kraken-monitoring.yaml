apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kraken
  namespace: kraken
  labels:
    app.kubernetes.io/name: kraken
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kraken
      app.kubernetes.io/component: origin
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: true
    metricRelabelings:
    - sourceLabels: [__name__]
      regex: 'kraken_.*'
      action: keep
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: node
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod
    - sourceLabels: [__meta_kubernetes_namespace]
      targetLabel: namespace
    - replacement: kraken-p2p
      targetLabel: job

---
# Grafana Dashboard ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: kraken-dashboard
  namespace: kraken
  labels:
    grafana_dashboard: "1"
data:
  kraken-p2p.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Kraken P2P Registry - Nebula Mesh",
        "tags": ["kraken", "p2p", "registry", "nebula", "miladyos"],
        "style": "dark",
        "timezone": "browser",
        "refresh": "30s",
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "panels": [
          {
            "id": 1,
            "title": "🐙 Kraken Mesh Topology",
            "type": "graph",
            "targets": [
              {
                "expr": "kraken_peers_connected",
                "legendFormat": "Connected Peers - {{node}}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
            "yAxes": [
              {
                "label": "Peer Count",
                "min": 0
              }
            ]
          },
          {
            "id": 2,
            "title": "🌸 P2P Transfer Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(kraken_bytes_transferred_total[5m])",
                "legendFormat": "Transfer Rate - {{node}}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
            "yAxes": [
              {
                "label": "Bytes/sec",
                "min": 0
              }
            ]
          },
          {
            "id": 3,
            "title": "📦 Cache Hit Rate",
            "type": "stat",
            "targets": [
              {
                "expr": "kraken_cache_hit_ratio",
                "legendFormat": "Cache Hit Ratio"
              }
            ],
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "🔄 Active Downloads",
            "type": "stat",
            "targets": [
              {
                "expr": "kraken_active_downloads",
                "legendFormat": "Active Downloads"
              }
            ],
            "gridPos": {"h": 4, "w": 6, "x": 6, "y": 8}
          },
          {
            "id": 5,
            "title": "🌐 Nebula Mesh Health",
            "type": "stat",
            "targets": [
              {
                "expr": "up{job=\"kraken-p2p\"}",
                "legendFormat": "Nodes Online"
              }
            ],
            "gridPos": {"h": 4, "w": 6, "x": 12, "y": 8}
          },
          {
            "id": 6,
            "title": "⚡ P2P Performance",
            "type": "stat",
            "targets": [
              {
                "expr": "kraken_avg_download_speed",
                "legendFormat": "Avg Download Speed"
              }
            ],
            "gridPos": {"h": 4, "w": 6, "x": 18, "y": 8}
          }
        ]
      }
    }