apiVersion: v1
kind: ConfigMap
metadata:
  name: avahi-config
  namespace: kraken
data:
  avahi-daemon.conf: |
    [server]
    host-name-from-machine-id=no
    domain-name=nebula.mesh
    browse-domains=nebula.mesh
    use-ipv4=yes
    use-ipv6=no
    allow-interfaces=nebula1
    check-response-ttl=no
    use-iff-running=no
    
    [wide-area]
    enable-wide-area=yes
    
    [publish]
    disable-publishing=no
    disable-user-service-publishing=no
    add-service-cookie=no
    publish-addresses=yes
    publish-hinfo=yes
    publish-workstation=yes
    publish-domain=yes
    publish-dns-servers=no
    publish-resolv-conf-dns-servers=no
    publish-aaaa-on-ipv4=yes
    publish-a-on-ipv6=no
    
    [reflector]
    enable-reflector=no
    
    [rlimits]
    rlimit-as=-1
    rlimit-core=0
    rlimit-data=4194304
    rlimit-fsize=0
    rlimit-nofile=768
    rlimit-stack=4194304
    rlimit-nproc=3

---
apiVersion: v1
kind: Service
metadata:
  name: kraken-origin
  namespace: kraken
  labels:
    app.kubernetes.io/name: kraken
    app.kubernetes.io/component: origin
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  clusterIP: None  # Headless for direct pod access
  ports:
  - name: origin
    port: 7337
    targetPort: 7337
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app.kubernetes.io/name: kraken
    
---
apiVersion: v1
kind: Service
metadata:
  name: kraken-agent
  namespace: kraken
  labels:
    app.kubernetes.io/name: kraken
    app.kubernetes.io/component: agent
spec:
  type: ClusterIP
  clusterIP: None  # Headless for P2P discovery
  ports:
  - name: agent
    port: 7338
    targetPort: 7338
    protocol: TCP
  selector:
    app.kubernetes.io/name: kraken
    
---
apiVersion: v1
kind: Service
metadata:
  name: kraken-tracker
  namespace: kraken
  labels:
    app.kubernetes.io/name: kraken
    app.kubernetes.io/component: tracker
spec:
  type: ClusterIP
  clusterIP: None  # Headless for tracker discovery
  ports:
  - name: tracker
    port: 7339
    targetPort: 7339
    protocol: TCP
  selector:
    app.kubernetes.io/name: kraken