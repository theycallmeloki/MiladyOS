apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kraken
  namespace: kraken
  labels:
    app.kubernetes.io/name: kraken
    app.kubernetes.io/component: p2p-registry
    app.kubernetes.io/part-of: miladyos
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kraken
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kraken
        app.kubernetes.io/component: p2p-registry
      annotations:
        nebula.mesh/interface: "nebula1"
        avahi.mesh/service: "_kraken._tcp"
    spec:
      # Use host network to access Nebula interface
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      
      # Node selection for Nebula-enabled nodes
      nodeSelector:
        nebula.mesh/enabled: "true"
      
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
        
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        
      initContainers:
      # Wait for Nebula interface to be ready
      - name: wait-for-nebula
        image: busybox:1.35
        command:
        - sh
        - -c
        - |
          echo "🌸 Waiting for Nebula interface..."
          while ! ip addr show nebula1 > /dev/null 2>&1; do
            echo "Waiting for nebula1 interface..."
            sleep 5
          done
          echo "✓ Nebula interface ready"
        securityContext:
          runAsUser: 0
          capabilities:
            add: ["NET_ADMIN"]
            
      containers:
      - name: kraken
        image: uber/kraken:latest
        imagePullPolicy: Always
        
        ports:
        - name: origin
          containerPort: 7337
          protocol: TCP
          hostPort: 7337
        - name: agent
          containerPort: 7338
          protocol: TCP
          hostPort: 7338
        - name: tracker
          containerPort: 7339
          protocol: TCP
          hostPort: 7339
        - name: metrics
          containerPort: 9090
          protocol: TCP
          hostPort: 9090
          
        env:
        - name: KRAKEN_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: KRAKEN_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: KRAKEN_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
              
        command: ["/bin/bash", "/etc/kraken/entrypoint.sh"]
        
        volumeMounts:
        - name: kraken-config
          mountPath: /etc/kraken
          readOnly: true
        - name: kraken-data
          mountPath: /var/lib/kraken
        - name: avahi-services
          mountPath: /etc/avahi/services
        # Access to Nebula certificates for secure P2P
        - name: nebula-certs
          mountPath: /etc/nebula
          readOnly: true
          
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
            
        livenessProbe:
          httpGet:
            path: /health
            port: 7337
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
          
        readinessProbe:
          httpGet:
            path: /health
            port: 7337
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["NET_BIND_SERVICE"]
          readOnlyRootFilesystem: true
          
      # Avahi daemon for mDNS service discovery
      - name: avahi-daemon
        image: alpine:3.18
        command:
        - sh
        - -c
        - |
          apk add --no-cache avahi avahi-tools dbus
          mkdir -p /var/run/dbus /var/run/avahi-daemon
          dbus-daemon --system --fork
          exec avahi-daemon --no-drop-root --no-chroot
        volumeMounts:
        - name: avahi-services
          mountPath: /etc/avahi/services
        - name: avahi-config
          mountPath: /etc/avahi/avahi-daemon.conf
          subPath: avahi-daemon.conf
        securityContext:
          runAsUser: 0
          capabilities:
            add: ["NET_ADMIN", "NET_RAW"]
            
      volumes:
      - name: kraken-config
        configMap:
          name: kraken-config
          defaultMode: 0755
      - name: kraken-data
        hostPath:
          path: /var/lib/kraken
          type: DirectoryOrCreate
      - name: avahi-services
        emptyDir: {}
      - name: avahi-config
        configMap:
          name: avahi-config
      # Mount Nebula certificates for P2P security
      - name: nebula-certs
        hostPath:
          path: /etc/nebula
          type: Directory
          
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1