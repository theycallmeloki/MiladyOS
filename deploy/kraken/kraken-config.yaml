apiVersion: v1
kind: ConfigMap
metadata:
  name: kraken-config
  namespace: kraken
  labels:
    app.kubernetes.io/name: kraken
    app.kubernetes.io/component: config
data:
  kraken.yaml: |
    cluster:
      # Use existing Nebula mesh for discovery
      discovery_method: "avahi"
      network_interface: "nebula1"
      mesh_network: "192.168.5.0/24"
      lighthouse_node: "192.168.5.1"
      
    # Origin server configuration (registry backend)
    origin:
      listen_addr: "0.0.0.0:7337"
      # Bind to Nebula interface for mesh communication
      announce_addr: "{{ .NodeNebulaIP }}:7337"
      storage_dir: "/var/lib/kraken/origin"
      # Use existing registry as upstream
      upstream_registry: "registry.miladyos.svc.cluster.local:5000"
      
    # Agent configuration (P2P client/server)
    agent:
      listen_addr: "0.0.0.0:7338"
      announce_addr: "{{ .NodeNebulaIP }}:7338"
      storage_dir: "/var/lib/kraken/agent"
      # P2P transfer settings
      peer_connection_timeout: "30s"
      max_concurrent_downloads: 10
      
    # Tracker configuration (BitTorrent-style coordination)
    tracker:
      listen_addr: "0.0.0.0:7339"
      announce_addr: "{{ .NodeNebulaIP }}:7339"
      # Use Avahi for peer discovery within Nebula mesh
      peer_discovery:
        method: "avahi"
        service_type: "_kraken._tcp"
        domain: "nebula.mesh"
        
    # P2P protocol settings
    p2p:
      # Use Nebula's secure tunnel for all P2P traffic
      transport: "tcp"
      interface: "nebula1"
      chunk_size: "4MB"
      # Leverage Longhorn's 3-replica pattern
      replication_factor: 3
      
    # Registry integration
    registry:
      # Proxy mode - intercept pulls and serve from P2P when available
      proxy_mode: true
      upstream_registry: "registry.miladyos.svc.cluster.local:5000"
      cache_dir: "/var/lib/kraken/cache"
      # Use existing MiladyOS health patterns
      health_check_endpoint: "/health"
      
    # Metrics for existing Prometheus stack
    metrics:
      listen_addr: "0.0.0.0:9090"
      path: "/metrics"
      
    # Logging configuration
    logging:
      level: "info"
      format: "json"
      
  avahi-service.conf: |
    <?xml version="1.0" standalone='no'?>
    <!DOCTYPE service-group SYSTEM "avahi-service.dtd">
    <service-group>
      <name replace-wildcards="yes">Kraken P2P Registry on %h</name>
      <service>
        <type>_kraken._tcp</type>
        <port>7337</port>
        <txt-record>version=1.0</txt-record>
        <txt-record>role=registry</txt-record>
        <txt-record>mesh=nebula</txt-record>
        <txt-record>p2p-port=7338</txt-record>
        <txt-record>tracker-port=7339</txt-record>
      </service>
    </service-group>
    
  entrypoint.sh: |
    #!/bin/bash
    set -e
    
    # Get Nebula interface IP for mesh communication
    NEBULA_IP=$(ip addr show nebula1 | grep 'inet ' | awk '{print $2}' | cut -d/ -f1)
    
    if [ -z "$NEBULA_IP" ]; then
      echo "ERROR: Nebula interface nebula1 not found or no IP assigned"
      echo "Available interfaces:"
      ip addr show
      exit 1
    fi
    
    echo "🌸 Kraken starting on Nebula mesh IP: $NEBULA_IP"
    
    # Replace template variables in config
    sed -i "s/{{ \.NodeNebulaIP }}/$NEBULA_IP/g" /etc/kraken/kraken.yaml
    
    # Register with Avahi for mesh discovery
    if [ -d "/etc/avahi/services" ]; then
      cp /etc/kraken/avahi-service.conf /etc/avahi/services/kraken.service
      echo "📡 Registered Kraken service with Avahi mDNS"
    fi
    
    # Start Kraken in mesh mode
    echo "🐙 Starting Kraken P2P Registry..."
    exec kraken --config=/etc/kraken/kraken.yaml