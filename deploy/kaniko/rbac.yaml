# Least-privilege access for the kaniko builder (in-cluster deployment uses the miladyos
# default SA; the host container mounts the operator kubeconfig for now).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kaniko-builder
  namespace: sandman
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kanikobuilds-admin
  namespace: sandman
rules:
  - apiGroups: [build.miladyos.io]
    resources: [kanikobuilds, kanikobuilds/status]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, delete]
    # submitters ship big build contexts as ConfigMaps referenced by
    # KanikoBuild.spec.contextConfigMap (the hook mounts them into the
    # kaniko init pod; inline contextBase64 stays for small contexts)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kaniko-builder
  namespace: sandman
subjects:
  - kind: ServiceAccount
    name: kaniko-builder
    namespace: sandman
  - kind: ServiceAccount
    name: default
    namespace: miladyos
roleRef:
  kind: Role
  name: kanikobuilds-admin
  apiGroup: rbac.authorization.k8s.io
