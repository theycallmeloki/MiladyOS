# Static TrueNAS NFS volume for the in-cluster sandman build registry.
# Old Longhorn PVC kaniko-registry-data remains for rollback.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kaniko-registry-data-nfs
spec:
  capacity: { storage: 30Gi }
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: ["nfsvers=4.1", "hard", "timeo=600", "retrans=2"]
  nfs: { server: 192.168.1.99, path: /mnt/neochibistore/k8s-registry/kaniko-registry }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kaniko-registry-data-nfs
  namespace: sandman
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ""
  volumeName: kaniko-registry-data-nfs
  resources: { requests: { storage: 30Gi } }
