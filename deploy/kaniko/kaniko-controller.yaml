# metacontroller composite controller: watches KanikoBuild CRs. The sync
# hook runs IN-CLUSTER (deployment kaniko-hook in sandman ns, own SA) —
# no workstation dependency, no kubeconfig on a host.
apiVersion: metacontroller.k8s.io/v1alpha1
kind: CompositeController
metadata:
  name: kaniko-build-controller
spec:
  parentResource:
    apiVersion: build.miladyos.io/v1alpha1
    resource: kanikobuilds
  childResources:
    - apiVersion: v1
      resource: pods
      updateStrategy:
        method: InPlace
  generateSelector: true
  hooks:
    sync:
      webhook:
        url: http://kaniko-hook.sandman.svc:8090/sync
