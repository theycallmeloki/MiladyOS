# Loki Values - SingleBinary mode for MiladyOS
deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  persistence:
    storageClass: longhorn
    size: 20Gi

# Disable components not needed in SingleBinary mode
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: 2024-04-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 720h  # 30 days
    allow_structured_metadata: true
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

# Disable caches (not needed for single binary)
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Grafana datasource auto-provisioning
extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: loki-datasource
      namespace: monitoring
      labels:
        grafana_datasource: "1"
    data:
      loki-datasource.yaml: |
        apiVersion: 1
        datasources:
          - name: Loki
            type: loki
            access: proxy
            url: http://loki:3100
            isDefault: false
            jsonData:
              maxLines: 1000

# Gateway not needed in single binary
gateway:
  enabled: false

# Disable minio - we use filesystem
minio:
  enabled: false
