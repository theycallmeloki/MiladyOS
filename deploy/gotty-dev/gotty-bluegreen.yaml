apiVersion: v1
kind: Namespace
metadata:
  name: gotty-dev
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gotty-dev-storage
  namespace: gotty-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gotty-session-logs
  namespace: gotty-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gotty-config
  namespace: gotty-dev
data:
  .gotty: |
    enable_tls = false
    port = "8080"
    permit_write = true
    permit_arguments = true
    title_format = "MiladyOS Dev Terminal"
    enable_reconnect = true
    reconnect_time = 5
    max_connection = 10
    once = false
    timeout = 0
    width = 0
    height = 0
    enable_basic_auth = true
    credential = "milady:miladymilady"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotty-dev
  namespace: gotty-dev
  labels:
    app: gotty-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gotty-dev
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gotty-dev
    spec:
      shareProcessNamespace: true
      volumes:
      - name: dev-storage
        persistentVolumeClaim:
          claimName: gotty-dev-storage
      - name: session-logs
        persistentVolumeClaim:
          claimName: gotty-session-logs
      - name: gotty-config
        configMap:
          name: gotty-config
      - name: emacs-config
        configMap:
          name: emacs-mcp-config
      - name: session-processor-script
        configMap:
          name: session-processor-script
          defaultMode: 0755

      containers:
      - name: gotty
        image: ubuntu:24.04
        command: ["/bin/bash", "-c"]
        securityContext:
          privileged: true
        args:
        - |
          export DEBIAN_FRONTEND=noninteractive
          export TZ=UTC
          ln -fs /usr/share/zoneinfo/UTC /etc/localtime

          apt-get update && apt-get install -y --no-install-recommends \
            curl wget ca-certificates gnupg lsb-release software-properties-common

          # Install gotty
          wget -q https://github.com/sorenisanerd/gotty/releases/download/v1.5.0/gotty_v1.5.0_linux_amd64.tar.gz
          tar xzf gotty_v1.5.0_linux_amd64.tar.gz
          mv gotty /usr/local/bin/ && chmod +x /usr/local/bin/gotty
          rm gotty_v1.5.0_linux_amd64.tar.gz

          # Install dev tools
          apt-get install -y --no-install-recommends \
            bash tmux vim git htop openssh-client jq \
            python3 python3-pip python3-venv \
            make gcc g++ build-essential cmake \
            zip golang-go net-tools iputils-ping dnsutils \
            nano less sudo locales

          locale-gen en_US.UTF-8
          update-locale LANG=en_US.UTF-8

          # Node.js 22
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs

          # Docker CLI
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update && apt-get install -y --no-install-recommends docker-ce-cli

          # kubectl
          curl -LO "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
          chmod +x kubectl && mv kubectl /usr/local/bin/

          # Helm
          curl -s https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

          # uv
          curl -LsSf https://astral.sh/uv/install.sh | sh

          # Claude Code
          npm install -g @anthropic-ai/claude-code || true

          # Emacs + MCP filesystem/fetch packages
          apt-get install -y emacs-nox
          npm install -g @modelcontextprotocol/server-filesystem
          npm install -g @modelcontextprotocol/server-fetch

          # tmux config
          cat > /root/.tmux.conf << 'TMUXEOF'
          set -g default-terminal "screen-256color"
          set -g history-limit 10000
          set -g mouse on
          set -g base-index 1
          setw -g pane-base-index 1
          set -g status-style bg=colour235,fg=colour136
          set -g status-left '#[fg=colour235,bg=colour252,bold] #S #[fg=colour252,bg=colour235,nobold]'
          set -g status-right '#[fg=colour235,bg=colour252,bold] %Y-%m-%d %H:%M '
          TMUXEOF

          # bash config
          cat > /root/.bashrc << 'BASHEOF'
          export PS1="\[\033[1;32m\][\u@milady-dev \W]\$\[\033[0m\] "
          export HISTFILE=/logs/.bash_history
          export HISTSIZE=10000
          export HISTFILESIZE=20000
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          export PATH="/root/.local/bin:/usr/local/lib/node_modules/.bin:${PATH}"
          shopt -s histappend
          alias ll='ls -la'
          alias k='kubectl'
          alias d='docker'
          BASHEOF

          # Session logging wrapper
          cat > /usr/local/bin/logged-session.sh << 'SESSIONEOF'
          #!/bin/bash
          SESSION_ID=$(date +%Y%m%d_%H%M%S)_$(shuf -i 1000-9999 -n 1)
          LOG_DIR="/logs/sessions"
          mkdir -p "$LOG_DIR"
          touch "$LOG_DIR/session_${SESSION_ID}.log"
          trap 'echo "Session ended: $(date)" >> "$LOG_DIR/session_${SESSION_ID}.log"' EXIT TERM INT
          exec script -f -q "$LOG_DIR/session_${SESSION_ID}.log" -c /bin/bash
          SESSIONEOF
          chmod +x /usr/local/bin/logged-session.sh

          apt-get clean && rm -rf /var/lib/apt/lists/*

          cp /config/.gotty /root/.gotty
          cp /emacs-config/.emacs /root/.emacs
          cd /workspace
          exec /usr/local/bin/gotty --config /root/.gotty /usr/local/bin/logged-session.sh

        ports:
        - containerPort: 8080
          name: gotty-port

        volumeMounts:
        - name: dev-storage
          mountPath: /workspace
        - name: session-logs
          mountPath: /logs
        - name: gotty-config
          mountPath: /config
        - name: emacs-config
          mountPath: /emacs-config

        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"

      - name: websocket-proxy
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        command: ["/bin/sh", "-c"]
        args:
        - |
          cat > /etc/nginx/nginx.conf << 'EOF'
          events { worker_connections 1024; }
          http {
            upstream gotty {
              server localhost:8080;
            }
            map $http_upgrade $connection_upgrade {
              default upgrade;
              '' close;
            }
            server {
              listen 80;
              location / {
                proxy_pass http://gotty;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 60s;
                proxy_send_timeout 300s;
                proxy_read_timeout 300s;
                proxy_buffering off;
                proxy_cache off;
              }
            }
          }
          EOF
          nginx -g 'daemon off;'

        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3

        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"

      - name: session-logger
        image: ubuntu:24.04
        command: ["/bin/bash", "-c"]
        args:
        - |
          apt-get update && apt-get install -y gzip coreutils && apt-get clean
          while true; do
            if [ -d /logs/sessions ]; then
              find /logs/sessions -name "*.log" -mtime +1 -exec gzip {} \; 2>/dev/null || true
              find /logs/sessions -name "*.log.gz" -mtime +30 -delete 2>/dev/null || true
            fi
            sleep 300
          done

        volumeMounts:
        - name: session-logs
          mountPath: /logs

        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"

      - name: session-processor
        image: ubuntu:24.04
        command: ["/bin/bash", "/scripts/session-processor.sh"]
        env:
        - name: TZ
          value: "UTC"
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/bash
              - -c
              - |
                apt-get update && apt-get install -y \
                  python3 gawk inotify-tools coreutils && apt-get clean
        volumeMounts:
        - name: session-logs
          mountPath: /logs
        - name: dev-storage
          mountPath: /workspace
        - name: session-processor-script
          mountPath: /scripts
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: gotty-dev
  namespace: gotty-dev
  labels:
    app: gotty-dev
spec:
  selector:
    app: gotty-dev
  ports:
  - port: 8080
    targetPort: 80
    name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gotty-dev
  namespace: gotty-dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  ingressClassName: nginx
  rules:
  - host: dev.transparentlyrotatableproxy.me
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gotty-dev
            port:
              number: 8080
  tls:
  - hosts:
    - dev.transparentlyrotatableproxy.me
    secretName: gotty-dev-tls
