apiVersion: v1
kind: ConfigMap
metadata:
  name: session-processor-script
  namespace: gotty-dev
data:
  session-processor.sh: |
    #!/bin/bash
    
    # Production GoTTY Session Processor Sidecar
    # Real-time processing of session logs into AGI training data
    # Designed to run as Kubernetes sidecar alongside GoTTY
    
    LOG_DIR="/logs/sessions"
    OUTPUT_DIR="/logs/training"
    PROCESSED_DIR="/logs/processed"
    TEMP_DIR="/tmp/session-processing"
    
    # Create directories
    mkdir -p "$OUTPUT_DIR" "$PROCESSED_DIR" "$TEMP_DIR"
    
    # Process a single session log file
    process_session_log() {
        local logfile="$1"
        local basename=$(basename "$logfile" .log)
        local temp_cleaned="$TEMP_DIR/${basename}_cleaned.txt"
        local temp_unique="$TEMP_DIR/${basename}_unique.txt"
        local output_file="$OUTPUT_DIR/${basename}_training.jsonl"
        
        echo "[$(date)] Processing: $logfile"
        
        # Use python for ANSI cleaning (reuse our working regex)
        python3 -c "
    import re
    import sys
    
    def clean_ansi(text):
        text = re.sub(r'\x1B\[[0-?]*[ -/]*[@-~]', '', text)
        text = re.sub(r'\x1B[\[\(\)][0-9;]*[a-zA-Z]', '', text)
        text = re.sub(r'[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]', '', text)
        text = re.sub(r'[\u2500-\u257F\u2580-\u259F\u25A0-\u25FF\u2600-\u26FF\u2700-\u27BF]', '', text)
        text = re.sub(r'[\u00A0\u00B7\u2022\u2023\u2024\u2025\u2026\u2027\u2030\u2031\u2032\u2033\u2034\u2035\u2036\u2037\u2038\u2039\u203A\u203B\u203C\u203D\u203E\u203F\u2040\u2041\u2042\u2043\u2044\u2045\u2046\u2047\u2048\u2049\u204A\u204B\u204C\u204D\u204E\u204F\u2050\u2051\u2052\u2053\u2054\u2055\u2056\u2057\u2058\u2059\u205A\u205B\u205C\u205D\u205E\u205F]', '', text)
        text = re.sub(r'\s+', ' ', text)
        return text.strip()
    
    with open('$logfile', 'r', encoding='utf-8', errors='replace') as f:
        for line in f:
            cleaned = clean_ansi(line)
            if cleaned:
                print(cleaned)
    " > "$temp_cleaned"
        
        # Complete deduplication with awk
        awk '!seen[$0]++' "$temp_cleaned" > "$temp_unique"
        
        # Create training pairs with proper JSON escaping
        awk 'NR > 1 { 
            gsub(/\\/, "\\\\", prev); gsub(/"/, "\\\"", prev)
            gsub(/\\/, "\\\\", $0); gsub(/"/, "\\\"", $0)
            printf "{\"input\":\"%s\",\"output\":\"%s\"}\n", prev, $0 
        } 
        { prev = $0 }' "$temp_unique" > "$output_file"
        
        # Log results
        local unique_count=$(wc -l < "$temp_unique")
        local training_count=$(wc -l < "$output_file")
        echo "[$(date)] Completed: $unique_count unique -> $training_count training examples"
        echo "[$(date)] Output: $output_file"
        
        # Move processed log to archive
        mv "$logfile" "$PROCESSED_DIR/"
        
        # Cleanup temp files
        rm -f "$temp_cleaned" "$temp_unique"
    }
    
    # Real-time monitoring function
    monitor_and_process() {
        echo "[$(date)] Starting GoTTY session processor sidecar"
        echo "[$(date)] Monitoring: $LOG_DIR -> $OUTPUT_DIR"
        
        # Process any existing logs first
        for logfile in "$LOG_DIR"/*.log; do
            if [[ -f "$logfile" ]]; then
                # Check if file is stable (not being written)
                local size1=$(stat -c%s "$logfile" 2>/dev/null || echo 0)
                sleep 5
                local size2=$(stat -c%s "$logfile" 2>/dev/null || echo 0)
                
                if [[ "$size1" == "$size2" ]] && [[ "$size1" -gt 100 ]]; then
                    process_session_log "$logfile"
                fi
            fi
        done
        
        # Monitor for new/modified files using inotify
        if command -v inotifywait >/dev/null 2>&1; then
            echo "[$(date)] Using inotify for real-time monitoring"
            inotifywait -m -e close_write -e moved_to "$LOG_DIR" --format '%w%f' 2>/dev/null | \
            while read logfile; do
                if [[ "$logfile" == *.log ]]; then
                    # Wait for file to stabilize
                    sleep 10
                    if [[ -f "$logfile" ]]; then
                        process_session_log "$logfile"
                    fi
                fi
            done
        else
            echo "[$(date)] inotify not available, using polling mode"
            # Fallback: poll every 60 seconds
            while true; do
                for logfile in "$LOG_DIR"/*.log; do
                    if [[ -f "$logfile" ]]; then
                        # Check if file is stable
                        local size1=$(stat -c%s "$logfile" 2>/dev/null || echo 0)
                        sleep 10
                        local size2=$(stat -c%s "$logfile" 2>/dev/null || echo 0)
                        
                        if [[ "$size1" == "$size2" ]] && [[ "$size1" -gt 100 ]]; then
                            process_session_log "$logfile"
                        fi
                    fi
                done
                sleep 60
            done
        fi
    }
    
    # Cleanup function for graceful shutdown
    cleanup() {
        echo "[$(date)] Shutting down session processor..."
        echo "[$(date)] Processing remaining logs..."
        
        for logfile in "$LOG_DIR"/*.log; do
            if [[ -f "$logfile" ]]; then
                process_session_log "$logfile"
            fi
        done
        
        echo "[$(date)] Session processor shutdown complete"
        exit 0
    }
    
    # Set up signal handlers for graceful shutdown
    trap cleanup SIGTERM SIGINT SIGQUIT
    
    # Health check function
    health_check() {
        # Create health check endpoint
        while true; do
            echo "Session processor healthy: $(date)" > /tmp/health
            sleep 30
        done
    }
    
    # Start health check in background
    health_check &
    
    # Start main monitoring
    monitor_and_process