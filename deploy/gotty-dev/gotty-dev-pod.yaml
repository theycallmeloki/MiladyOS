apiVersion: v1
kind: Namespace
metadata:
  name: gotty-dev
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gotty-dev-storage
  namespace: gotty-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gotty-session-logs
  namespace: gotty-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gotty-config
  namespace: gotty-dev
data:
  .gotty: |
    enable_tls = false
    port = "8080"
    permit_write = true
    permit_arguments = true
    title_format = "MiladyOS Dev Terminal"
    enable_reconnect = true
    reconnect_time = 10
    max_connection = 0
    once = false
    timeout = 0
    width = 0
    height = 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotty-dev
  namespace: gotty-dev
  labels:
    app: gotty-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gotty-dev
  template:
    metadata:
      labels:
        app: gotty-dev
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - talos-0wj-0i3
                - talos-pre-ei9
                - talos-qn8-i3a
      shareProcessNamespace: true
      volumes:
      - name: dev-storage
        persistentVolumeClaim:
          claimName: gotty-dev-storage
      - name: session-logs
        persistentVolumeClaim:
          claimName: gotty-session-logs
      - name: gotty-config
        configMap:
          name: gotty-config
      
      containers:
      # Main gotty container with Ubuntu base and dev tools
      - name: gotty
        image: ubuntu:22.04
        command: ["/bin/bash", "-c"]
        securityContext:
          privileged: true
        args:
        - |
          # Update and install base packages
          apt-get update && apt-get install -y \
            curl \
            wget \
            ca-certificates \
            gnupg \
            lsb-release \
            software-properties-common
          
          # Install gotty
          wget https://github.com/sorenisanerd/gotty/releases/download/v1.5.0/gotty_v1.5.0_linux_amd64.tar.gz
          tar xzf gotty_v1.5.0_linux_amd64.tar.gz
          mv gotty /usr/local/bin/
          chmod +x /usr/local/bin/gotty
          
          # Install dev tools
          apt-get install -y \
            bash \
            tmux \
            vim \
            git \
            htop \
            openssh-client \
            jq \
            python3 \
            python3-pip \
            make \
            gcc \
            g++ \
            build-essential \
            net-tools \
            iputils-ping \
            dnsutils \
            telnet \
            nano \
            less \
            man-db \
            sudo \
            locales
          
          # Set locale
          locale-gen en_US.UTF-8
          update-locale LANG=en_US.UTF-8
          
          # Install Node.js
          curl -fsSL https://deb.nodesource.com/setup_lts.x | bash -
          apt-get install -y nodejs
          
          # Install Docker CLI
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update
          apt-get install -y docker-ce-cli
          
          # Install kubectl
          curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.28/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
          echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.28/deb/ /' | tee /etc/apt/sources.list.d/kubernetes.list
          apt-get update
          apt-get install -y kubectl
          
          # Install Helm
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          
          # Set up tmux config (simplified, no logging)
          cat > /root/.tmux.conf << 'EOF'
          set -g default-terminal "screen-256color"
          set -g history-limit 10000
          set -g mouse on
          set -g base-index 1
          setw -g pane-base-index 1
          
          # Status bar
          set -g status-style bg=colour235,fg=colour136
          set -g status-left '#[fg=colour235,bg=colour252,bold] #S #[fg=colour252,bg=colour235,nobold]'
          set -g status-right '#[fg=colour235,bg=colour252,bold] %Y-%m-%d %H:%M '
          EOF
          
          # Set up bash configuration
          cat > /root/.bashrc << 'EOF'
          export PS1="\[\033[1;32m\][\u@gotty-dev \W]\$\[\033[0m\] "
          export HISTFILE=/logs/.bash_history
          export HISTSIZE=10000
          export HISTFILESIZE=20000
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          shopt -s histappend
          
          alias ll='ls -la'
          alias k='kubectl'
          alias d='docker'
          alias logs='ls -la /logs/sessions/'
          alias viewlog='tail -f /logs/sessions/session_*.log'
          EOF
          
          # Copy config and start gotty
          cp /config/.gotty /root/.gotty
          cd /workspace
          
          # Install claude-code globally
          npm install -g @anthropic-ai/claude-code || true
          
          # Disable IPv6 to fix connectivity issues
          echo "net.ipv6.conf.all.disable_ipv6 = 1" >> /etc/sysctl.conf
          echo "net.ipv6.conf.default.disable_ipv6 = 1" >> /etc/sysctl.conf
          echo "net.ipv6.conf.lo.disable_ipv6 = 1" >> /etc/sysctl.conf
          sysctl -p || true
          
          # Also disable IPv6 in /etc/hosts
          sed -i 's/::1.*localhost/# ::1 localhost/' /etc/hosts
          
          # Clean up apt cache
          apt-get clean
          rm -rf /var/lib/apt/lists/*
          
          # Create session logging script
          cat > /usr/local/bin/logged-session.sh << 'EOF'
          #!/bin/bash
          SESSION_ID=$(date +%Y%m%d_%H%M%S)_$$
          LOG_DIR="/logs/sessions"
          mkdir -p "$LOG_DIR"
          
          # Start recording session with script
          exec script -f -q "$LOG_DIR/session_${SESSION_ID}.log" -c /bin/bash
          EOF
          
          chmod +x /usr/local/bin/logged-session.sh
          
          # Start gotty with logged session
          exec /usr/local/bin/gotty --config /root/.gotty /usr/local/bin/logged-session.sh
        
        ports:
        - containerPort: 8080
          name: http
        
        volumeMounts:
        - name: dev-storage
          mountPath: /workspace
        - name: session-logs
          mountPath: /logs
        - name: gotty-config
          mountPath: /config
        
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
      
      # Sidecar logger container for log management
      - name: session-logger
        image: ubuntu:22.04
        command: ["/bin/bash", "-c"]
        args:
        - |
          # Install required tools
          apt-get update && apt-get install -y gzip coreutils rsync
          
          # Simple log management loop
          while true; do
            # Monitor and compress old session logs
            if [ -d /logs/sessions ]; then
              # Compress logs older than 1 day
              find /logs/sessions -name "*.log" -mtime +1 -exec gzip {} \; 2>/dev/null || true
              
              # Clean up very old compressed logs (>30 days)
              find /logs/sessions -name "*.log.gz" -mtime +30 -delete 2>/dev/null || true
              
              # Log disk usage
              echo "[$(date)] Session logs: $(du -sh /logs/sessions 2>/dev/null | cut -f1 || echo 'N/A')"
            fi
            
            sleep 300  # Check every 5 minutes
          done
        
        volumeMounts:
        - name: session-logs
          mountPath: /logs
        - name: dev-storage
          mountPath: /workspace
        
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: gotty-dev
  namespace: gotty-dev
spec:
  selector:
    app: gotty-dev
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gotty-dev
  namespace: gotty-dev
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "gotty-dev"
    nginx.ingress.kubernetes.io/upstream-keepalive-connections: "50"
    nginx.ingress.kubernetes.io/upstream-keepalive-requests: "10000"
    nginx.ingress.kubernetes.io/upstream-keepalive-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - dev.miladyos.net
    secretName: gotty-dev-tls
  rules:
  - host: dev.miladyos.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gotty-dev
            port:
              number: 8080