apiVersion: v1
kind: ServiceAccount
metadata:
  name: rlm-coordinator
  namespace: rlm-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rlm-coordinator
  namespace: rlm-system
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create", "get"]
- apiGroups: ["rlm.io"]
  resources: ["rlmjobs", "rlmjobs/status"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rlm-coordinator
  namespace: rlm-system
subjects:
- kind: ServiceAccount
  name: rlm-coordinator
  namespace: rlm-system
roleRef:
  kind: Role
  name: rlm-coordinator
  apiGroup: rbac.authorization.k8s.io
