apiVersion: v1
kind: ConfigMap
metadata:
  name: rlm-coordinator-script
  namespace: rlm-system
data:
  coordinator.py: |
    """
    Fixed coordinator: creates its own REPL pod instead of reusing worker pods.
    The original coordinator.py passes skip_pod_creation=True + pod_ip but omits
    pod_name, which causes KubernetesREPL._exec_in_pod() to fail.
    """
    import json
    import os
    import socket
    import time
    import traceback


    def wait_for_lm_handler(host: str, port: int, timeout: int = 120):
        """Wait for LMHandler service to be reachable via TCP."""
        for _ in range(timeout):
            try:
                sock = socket.create_connection((host, port), timeout=5)
                sock.close()
                return
            except (ConnectionRefusedError, OSError, socket.timeout):
                time.sleep(1)
        raise TimeoutError(f"LMHandler at {host}:{port} not reachable within {timeout}s")


    def patch_status(custom_api, namespace: str, job_name: str, status: dict):
        """Patch the RLMJob status subresource."""
        custom_api.patch_namespaced_custom_object_status(
            group="rlm.io",
            version="v1alpha1",
            namespace=namespace,
            plural="rlmjobs",
            name=job_name,
            body={"status": status},
        )


    def notify_mattermost(job_name: str, message: str):
        """Post a message to Mattermost if NOTIFY_CHANNEL is set."""
        import sys
        import urllib.request
        notify_channel = os.environ.get("RLM_NOTIFY_CHANNEL", "")
        mm_url = os.environ.get("MATTERMOST_URL", "")
        mm_token = os.environ.get("MATTERMOST_BOT_TOKEN", "")
        print(f"[notify] channel={notify_channel!r} mm_url={mm_url!r} token_len={len(mm_token)}", flush=True)
        if not (notify_channel and mm_url and mm_token):
            print("[notify] skipping — missing config", flush=True)
            return
        try:
            headers = {"Authorization": f"Bearer {mm_token}", "Content-Type": "application/json"}
            # Resolve team
            req = urllib.request.Request(f"{mm_url}/api/v4/teams/name/milady", headers=headers)
            team_id = json.loads(urllib.request.urlopen(req, timeout=10).read())["id"]
            print(f"[notify] team_id={team_id}", flush=True)
            # Resolve channel
            req = urllib.request.Request(f"{mm_url}/api/v4/teams/{team_id}/channels/name/{notify_channel}", headers=headers)
            channel_id = json.loads(urllib.request.urlopen(req, timeout=10).read())["id"]
            print(f"[notify] channel_id={channel_id}", flush=True)
            # Post
            payload = json.dumps({"channel_id": channel_id, "message": message}).encode()
            req = urllib.request.Request(f"{mm_url}/api/v4/posts", data=payload, headers=headers, method="POST")
            resp = urllib.request.urlopen(req, timeout=10)
            print(f"[notify] posted ok, status={resp.status}", flush=True)
        except Exception as e:
            print(f"[notify] ERROR: {e}", flush=True)
            import traceback; traceback.print_exc(); sys.stdout.flush()


    def main():
        from kubernetes import client, config

        config.load_incluster_config()
        custom_api = client.CustomObjectsApi()

        job_name = os.environ["RLM_JOB_NAME"]
        namespace = os.environ["RLM_JOB_NAMESPACE"]
        prompt = os.environ["RLM_PROMPT"]
        backend = os.environ["RLM_BACKEND"]
        backend_kwargs = json.loads(os.environ["BACKEND_KWARGS"])
        max_iterations = int(os.environ.get("RLM_MAX_ITERATIONS", "30"))
        max_depth = int(os.environ.get("RLM_MAX_DEPTH", "1"))
        worker_image = os.environ.get("RLM_WORKER_IMAGE", "python:3.11-slim")
        timeout = int(os.environ.get("RLM_TIMEOUT", "600"))
        log_dir = os.environ.get("RLM_LOG_DIR", "/tmp/rlm-logs")

        lm_handler_host = f"{job_name}-lm-handler"
        lm_handler_port = 9090

        try:
            wait_for_lm_handler(lm_handler_host, lm_handler_port)
            patch_status(custom_api, namespace, job_name, {"phase": "Running"})

            from rlm.core.rlm import RLM
            from rlm.logger import RLMLogger

            os.makedirs(log_dir, exist_ok=True)
            logger = RLMLogger(log_dir=log_dir, file_name=job_name)

            # Coordinator creates its own REPL pod (skip_pod_creation=False, the default).
            # This avoids the pod_name lookup bug in the original coordinator.
            rlm = RLM(
                backend=backend,
                backend_kwargs=backend_kwargs,
                environment="kubernetes",
                environment_kwargs={
                    "namespace": namespace,
                    "image": worker_image,
                    "timeout": timeout,
                },
                max_iterations=max_iterations,
                max_depth=max_depth,
                external_lm_handler_address=(lm_handler_host, lm_handler_port),
                logger=logger,
            )

            result = rlm.completion(prompt)
            response_text = result.response if isinstance(result.response, str) else str(result.response or "")
            print(f"[coordinator] completed, response_len={len(response_text)}", flush=True)

            patch_status(custom_api, namespace, job_name, {
                "phase": "Completed",
                "result": response_text,
                "iterations": max_iterations,
            })

            notify_mattermost(
                job_name,
                f"**RLM job `{job_name}` completed** ✓\n\n"
                f"**Prompt:** {prompt[:200]}\n\n"
                f"**Result:**\n{response_text[:2000] if response_text else '_(no result)_'}"
            )

        except Exception:
            error_msg = traceback.format_exc()
            try:
                patch_status(custom_api, namespace, job_name, {
                    "phase": "Failed",
                    "error": error_msg[-1000:],
                })
            except Exception:
                pass
            notify_mattermost(
                job_name,
                f"**RLM job `{job_name}` failed** ✗\n\n"
                f"**Prompt:** {prompt[:200]}\n\n"
                f"**Error:** {error_msg[-500:]}"
            )
            raise


    if __name__ == "__main__":
        main()
