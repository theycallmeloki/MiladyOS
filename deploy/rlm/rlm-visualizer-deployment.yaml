apiVersion: apps/v1
kind: Deployment
metadata:
  name: rlm-visualizer
  namespace: rlm-system
  labels:
    app: rlm-visualizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rlm-visualizer
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: rlm-visualizer
    spec:
      volumes:
        - name: rlm-logs
          persistentVolumeClaim:
            claimName: rlm-logs
      containers:
        - name: visualizer
          image: node:22-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              apk add --no-cache git

              # Clone repo
              git clone --depth 1 https://github.com/alexzhang13/rlm.git /app/rlm

              cd /app/rlm/visualizer

              # Create API route for listing log files
              mkdir -p src/app/api/logs
              cat > src/app/api/logs/route.ts << 'APIROUTE'
              import { NextResponse } from 'next/server';
              import fs from 'fs';
              import path from 'path';

              export const dynamic = 'force-dynamic';

              export async function GET() {
                const logsDir = path.join(process.cwd(), 'public', 'logs');
                try {
                  const files = fs.readdirSync(logsDir).filter((f: string) => f.endsWith('.jsonl'));
                  return NextResponse.json({ files });
                } catch {
                  return NextResponse.json({ files: [] });
                }
              }
              APIROUTE

              npm install

              # Build BEFORE creating the symlink so Next.js doesn't traverse
              # the symlink into /rlm-logs during build (Turbopack rejects it)
              npm run build

              # Now create symlink so npm start serves /rlm-logs as /logs/*
              ln -sf /rlm-logs public/logs

              echo "[$(date)] RLM visualizer ready at :3001"
              exec npm start -- -p 3001

          ports:
            - containerPort: 3001
              name: http

          volumeMounts:
            - name: rlm-logs
              mountPath: /rlm-logs

          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 180
            periodSeconds: 30

          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rlm-visualizer
  namespace: rlm-system
  labels:
    app: rlm-visualizer
spec:
  type: ClusterIP
  selector:
    app: rlm-visualizer
  ports:
    - port: 80
      targetPort: 3001
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rlm-visualizer
  namespace: rlm-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: rlm.transparentlyrotatableproxy.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rlm-visualizer
                port:
                  number: 80
  tls:
    - hosts:
        - rlm.transparentlyrotatableproxy.me
      secretName: rlm-transparentlyrotatableproxy-me-tls
