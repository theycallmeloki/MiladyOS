# Worker pool for Agent Substrate gVisor actors.
#
# WorkerPools are not created by the installer — they are CRs you supply. This
# one lives in ate-system because worker pods add a dozen capabilities
# (NET_ADMIN, SYS_ADMIN, ...) and hostPath-mount /var/lib/ate, which baseline
# PodSecurity forbids; ate-system is the namespace already labelled privileged.
#
# The workerImage comes from the same release as the control plane: it is
# version-pinned, so bump it together with the ate-setup install (image tag and
# node label). At v1.0.0-rc.3 the upstream release publishes it to
# ghcr.io/agent-substrate/substrate/ateworker-gvisor, digest below.
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: gvisor-workers
  namespace: ate-system
spec:
  replicas: 1
  workerImage: ghcr.io/agent-substrate/substrate/ateworker-gvisor@sha256:31b67c28558b384afc90372f48a8a4f271607e2668d47e66c12db68dc2a9c88a
  sandboxClasses:
    - name: gvisor
      configRef:
        name: gvisor-default
  template:
    # Worker pods need atelet, which runs on every untainted node. The
    # substrate-version label is stamped on the worker nodes by the install
    # (see the README); selecting on it keeps workers off the control-plane
    # nodes, which are already excluded by their NoSchedule taint.
    nodeSelector:
      ate.dev/substrate-version: v1.0.0-rc.3
    # Each worker pod is a standing reservation that hosts actor sandboxes.
    # Sized to fit the workers, which also run the rest of the cluster's
    # workloads.
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 8Gi
