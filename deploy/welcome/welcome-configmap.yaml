apiVersion: v1
kind: ConfigMap
metadata:
  name: welcome-nginx-config
  namespace: default
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        location / {
            default_type text/html;
            return 200 '<!DOCTYPE html>
            <html>
            <head>
                <title>$host</title>
                <style>
                    body {
                        background: #0a0a0a;
                        color: #e0e0e0;
                        font-family: monospace;
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        min-height: 100vh;
                        margin: 0;
                    }
                    .container {
                        text-align: center;
                        border: 1px solid #333;
                        padding: 3em;
                        max-width: 600px;
                    }
                    h1 { color: #fff; font-size: 1.5em; }
                    p { color: #888; }
                </style>
            </head>
            <body>
                <div class="container">
                    <h1>welcome visitor of $host</h1>
                    <p>powered by miladyos</p>
                </div>
            </body>
            </html>';
        }

        location /healthz {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
