apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: welcome-basedjourney
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  ingressClassName: nginx
  rules:
  - host: basedjourney.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: welcome
            port:
              number: 80
  tls:
  - hosts:
    - basedjourney.com
    secretName: basedjourney-com-tls
---
