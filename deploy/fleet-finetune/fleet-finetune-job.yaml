apiVersion: batch/v1
kind: Job
metadata:
  name: fleet-finetune-v1
  namespace: fleet-finetune
  labels:
    app: fleet-finetune
    app.kubernetes.io/part-of: miladyos
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: talos-q4j-294
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache
      - name: fleet-data
        persistentVolumeClaim:
          claimName: fleet-agent-data
      - name: train-script
        configMap:
          name: fleet-finetune-script
      containers:
      - name: finetune
        image: ghcr.io/sasha0552/vllm:v0.8.5.post1
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "Starting fleet finetune job"
          echo "GPU info:"
          nvidia-smi

          echo "Training data:"
          wc -l /data/training/fleet-ops.jsonl || echo "No training data yet"

          exec python3 /scripts/train.py

        volumeMounts:
        - name: model-cache
          mountPath: /models
        - name: fleet-data
          mountPath: /data
        - name: train-script
          mountPath: /scripts

        resources:
          limits:
            nvidia.com/gpu: "1"
          requests:
            memory: "16Gi"
            cpu: "4"
