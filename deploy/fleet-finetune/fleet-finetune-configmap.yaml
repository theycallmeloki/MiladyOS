apiVersion: v1
kind: ConfigMap
metadata:
  name: fleet-finetune-script
  namespace: fleet-finetune
data:
  train.py: |
    #!/usr/bin/env python3
    """
    LoRA finetune Nanbeige 4.1-3B on fleet-ops.jsonl using QLoRA + TRL SFTTrainer.
    Runs on the P40 GPU (24GB VRAM). Outputs adapter weights to /models/nanbeige-fleet-v1/.

    Input:  /data/training/fleet-ops.jsonl  (OpenAI chat format)
    Output: /models/nanbeige-fleet-v1/       (LoRA adapter weights)
    """

    import json
    import os
    from pathlib import Path

    print("Installing dependencies...")
    os.system("pip install -q transformers trl peft datasets bitsandbytes accelerate")

    import torch
    from datasets import Dataset
    from transformers import AutoTokenizer, AutoModelForCausalLM, BitsAndBytesConfig
    from peft import LoraConfig, get_peft_model, TaskType
    from trl import SFTTrainer, SFTConfig

    BASE_MODEL = "Nanbeige/Nanbeige4.1-3B"
    MODEL_DIR = "/models"          # pre-downloaded model cache
    TRAINING_DATA = "/data/training/fleet-ops.jsonl"
    OUTPUT_DIR = "/models/nanbeige-fleet-v1"

    # --- Load dataset ---
    print(f"Loading training data from {TRAINING_DATA}")
    examples = []
    with open(TRAINING_DATA) as f:
        for line in f:
            line = line.strip()
            if line:
                examples.append(json.loads(line))

    print(f"Loaded {len(examples)} training examples")
    if len(examples) < 100:
        print(f"WARNING: Only {len(examples)} examples. Consider generating more before finetuning.")

    dataset = Dataset.from_list(examples)

    # --- Load tokenizer ---
    print(f"Loading tokenizer from {BASE_MODEL}")
    tokenizer = AutoTokenizer.from_pretrained(
        BASE_MODEL,
        cache_dir=MODEL_DIR,
        trust_remote_code=True
    )
    if tokenizer.pad_token is None:
        tokenizer.pad_token = tokenizer.eos_token

    # --- QLoRA config (4-bit, fits P40 24GB) ---
    bnb_config = BitsAndBytesConfig(
        load_in_4bit=True,
        bnb_4bit_quant_type="nf4",
        bnb_4bit_compute_dtype=torch.float16,
        bnb_4bit_use_double_quant=True
    )

    print(f"Loading model {BASE_MODEL} in 4-bit")
    model = AutoModelForCausalLM.from_pretrained(
        BASE_MODEL,
        cache_dir=MODEL_DIR,
        quantization_config=bnb_config,
        device_map="auto",
        trust_remote_code=True
    )
    model.config.use_cache = False

    # --- LoRA config ---
    lora_config = LoraConfig(
        task_type=TaskType.CAUSAL_LM,
        r=16,
        lora_alpha=32,
        lora_dropout=0.05,
        target_modules=["q_proj", "v_proj", "k_proj", "o_proj",
                         "gate_proj", "up_proj", "down_proj"],
        bias="none"
    )
    model = get_peft_model(model, lora_config)
    model.print_trainable_parameters()

    # --- Format conversations using chat template ---
    def format_example(example):
        messages = example.get('messages', [])
        text = tokenizer.apply_chat_template(
            messages,
            tokenize=False,
            add_generation_prompt=False
        )
        return {'text': text}

    formatted = dataset.map(format_example, remove_columns=dataset.column_names)

    # --- Training ---
    training_args = SFTConfig(
        output_dir=OUTPUT_DIR,
        num_train_epochs=3,
        per_device_train_batch_size=2,
        gradient_accumulation_steps=4,
        learning_rate=2e-4,
        warmup_ratio=0.05,
        lr_scheduler_type="cosine",
        logging_steps=10,
        save_strategy="epoch",
        fp16=True,
        max_seq_length=2048,
        dataset_text_field="text",
        report_to="none"
    )

    trainer = SFTTrainer(
        model=model,
        args=training_args,
        train_dataset=formatted,
        tokenizer=tokenizer
    )

    print("Starting training...")
    trainer.train()

    print(f"Saving adapter to {OUTPUT_DIR}")
    trainer.save_model(OUTPUT_DIR)
    tokenizer.save_pretrained(OUTPUT_DIR)

    print(f"""
    ==========================================
    Finetuning complete!
    Adapter saved to: {OUTPUT_DIR}

    To serve with vLLM, add to server-deployment.yaml:
      --enable-lora
      --lora-modules fleet={OUTPUT_DIR}

    To use via litellm, add to litellm-config.yaml:
      - model_name: "fleet-agent"
        litellm_params:
          model: "openai/Nanbeige/Nanbeige4.1-3B"
          api_base: "http://vllm-server.self-hosted-models.svc.cluster.local:8080/v1"
          extra_body:
            lora_name: "fleet"
    ==========================================
    """)
