apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: default
data:
  config.yaml: |
    model_list:
      # ── Local inference pool for fleet-agent ───────────────────────────────
      - model_name: "fleet-agent"
        litellm_params:
          model: "openai/Qwen/Qwen3.5-4B"
          api_base: "http://192.168.1.25:8000/v1"
          api_key: "not-needed"
        model_info:
          id: "fleet-qwen-35-4b-server2"

      # ── Dedicated inference models ─────────────────────────────────────────
      # Bare-metal vLLM endpoint on server2
      - model_name: "Qwen/Qwen3.5-4B"
        litellm_params:
          model: "openai/Qwen/Qwen3.5-4B"
          api_base: "http://192.168.1.25:8000/v1"
          api_key: "not-needed"
        model_info:
          id: "qwen-35-4b-server2"

    litellm_settings:
      drop_params: true
      telemetry: false
      callbacks: "custom_callbacks.proxy_handler_instance"

    general_settings:
      health_check_interval: 0   # disable background health-check model calls

    router_settings:
      num_retries: 3
      timeout: 90
      routing_strategy: "usage-based-routing-v2"
      allowed_fails: 2          # tolerate transient errors before cooling down
      cooldown_time: 60         # shorter cooldown — free tier resets quickly
      fallbacks:
        - "fleet-agent": ["Qwen/Qwen3.5-4B"]
