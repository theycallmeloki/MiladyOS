apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: default
data:
  config.yaml: |
    model_list:
      # ── Free OpenRouter models (primary fleet-agent pool) ─────────────────
      # Daisy-chained: rate-limit or failure on one → LiteLLM tries the next.
      # Confirmed working (tested 2026-02-19):

      - model_name: "fleet-agent"
        litellm_params:
          model: "openrouter/google/gemma-3-27b-it:free"
          api_key: "os.environ/OPENROUTER_API_KEY"
        model_info:
          id: "gemma3-27b-free"

      - model_name: "fleet-agent"
        litellm_params:
          model: "openrouter/deepseek/deepseek-r1-0528:free"
          api_key: "os.environ/OPENROUTER_API_KEY"
        model_info:
          id: "deepseek-r1-0528-free"

      - model_name: "fleet-agent"
        litellm_params:
          model: "openrouter/nvidia/nemotron-3-nano-30b-a3b:free"
          api_key: "os.environ/OPENROUTER_API_KEY"
        model_info:
          id: "nemotron-30b-free"

      - model_name: "fleet-agent"
        litellm_params:
          model: "openrouter/upstage/solar-pro-3:free"
          api_key: "os.environ/OPENROUTER_API_KEY"
        model_info:
          id: "solar-pro-3-free"

      - model_name: "fleet-agent"
        litellm_params:
          model: "openrouter/arcee-ai/trinity-large-preview:free"
          api_key: "os.environ/OPENROUTER_API_KEY"
        model_info:
          id: "trinity-large-free"

      - model_name: "fleet-agent"
        litellm_params:
          model: "openrouter/google/gemma-3-12b-it:free"
          api_key: "os.environ/OPENROUTER_API_KEY"
        model_info:
          id: "gemma3-12b-free"

      - model_name: "fleet-agent"
        litellm_params:
          model: "openrouter/meta-llama/llama-3.3-70b-instruct:free"
          api_key: "os.environ/OPENROUTER_API_KEY"
        model_info:
          id: "llama33-70b-free"

      # Requires "Allow training on prompts" in OpenRouter account settings:
      - model_name: "fleet-agent"
        litellm_params:
          model: "openrouter/openai/gpt-oss-20b:free"
          api_key: "os.environ/OPENROUTER_API_KEY"
        model_info:
          id: "gpt-oss-20b-free"

      - model_name: "fleet-agent"
        litellm_params:
          model: "openrouter/openai/gpt-oss-120b:free"
          api_key: "os.environ/OPENROUTER_API_KEY"
        model_info:
          id: "gpt-oss-120b-free"

      - model_name: "fleet-agent"
        litellm_params:
          model: "openrouter/nousresearch/hermes-3-llama-3.1-405b:free"
          api_key: "os.environ/OPENROUTER_API_KEY"
        model_info:
          id: "hermes3-405b-free"

      # ── Dedicated inference (fallbacks) ───────────────────────────────────
      # Bare-metal RTX 3080 Ti (AWQ 4-bit, low latency, no cloud dependency)
      - model_name: "Nanbeige/Nanbeige4.1-3B"
        litellm_params:
          model: "openai/cyankiwi/Nanbeige4.1-3B-AWQ-4bit"
          api_base: "http://192.168.1.19:8000/v1"
          api_key: "not-needed"
        model_info:
          id: "nanbeige-bare-metal"

      # In-cluster vLLM (last resort)
      - model_name: "Nanbeige/Nanbeige4.1-3B-fallback"
        litellm_params:
          model: "openai/Nanbeige/Nanbeige4.1-3B"
          api_base: "http://vllm-server.self-hosted-models.svc.cluster.local:8080/v1"
          api_key: "not-needed"
        model_info:
          id: "nanbeige-incluster"

    litellm_settings:
      drop_params: true
      telemetry: false
      callbacks: "custom_callbacks.proxy_handler_instance"

    general_settings:
      health_check_interval: 0   # disable background health-check model calls

    router_settings:
      num_retries: 3
      timeout: 120
      routing_strategy: "least-busy"
      fallbacks:
        - "fleet-agent": ["Nanbeige/Nanbeige4.1-3B", "Nanbeige/Nanbeige4.1-3B-fallback"]
        - "Nanbeige/Nanbeige4.1-3B": ["Nanbeige/Nanbeige4.1-3B-fallback"]
