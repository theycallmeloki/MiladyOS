apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: default
data:
  config.yaml: |
    model_list:
      - model_name: "qwen3-coder-next"
        litellm_params:
          model: "openai/qwen3-coder-next"
          api_base: "http://llama-server.llama-cpp.svc.cluster.local:8080/v1"
          api_key: "not-needed"

    litellm_settings:
      drop_params: true
      telemetry: false
      callbacks: "custom_callbacks.proxy_handler_instance"

    general_settings: {}

    router_settings:
      num_retries: 3
      timeout: 600
