apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: default
data:
  config.yaml: |
    model_list: []
      # Add llama.cpp RPC models here, e.g.:
      # - model_name: "my-model"
      #   litellm_params:
      #     model: "openai/my-model"
      #     api_base: "http://llama-cpp-svc.default.svc.cluster.local:8080/v1"
      #     api_key: "not-needed"

    litellm_settings:
      drop_params: true
      telemetry: false
      callbacks: "custom_callbacks.proxy_handler_instance"

    general_settings: {}

    router_settings:
      num_retries: 3
      timeout: 600
