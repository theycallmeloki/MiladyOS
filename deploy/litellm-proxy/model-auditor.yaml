# Model Auditor — automatically maintains litellm-config-live
#
# Tests each candidate model in isolation by:
#   1. POST /model/new  — temp entry with a unique model_name
#   2. POST /v1/chat/completions with that unique name → LiteLLM routes
#      through its own egress (OpenRouter API key, etc.)
#   3. POST /model/delete — clean up temp entry
# This gives per-model signal without needing direct internet egress.
#
# After testing:
#   A. Hot-swaps the live routing set via admin API (zero restart)
#   B. Writes litellm-config-live ConfigMap (for clean pod restarts)
#
# Failure semantics:
#   PASS        — responded with a tool call ✅
#   TEXT-ONLY   — responded without tool call ⚠️  (soft fail, counted)
#   RATE-LIMIT  — 429, skip this round (no penalty)
#   FAIL        — error/timeout (counts toward prune threshold)

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-auditor
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: model-auditor
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["litellm-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["litellm-config-live"]
    verbs: ["get", "create", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: model-auditor
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: model-auditor
subjects:
  - kind: ServiceAccount
    name: model-auditor
    namespace: default

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: model-auditor
  namespace: default
  labels:
    app: model-auditor
spec:
  # Every 4 hours. To trigger manually:
  # kubectl create job -n default audit-now --from=cronjob/model-auditor
  schedule: "0 */4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 7200
      template:
        spec:
          serviceAccountName: model-auditor
          restartPolicy: OnFailure
          containers:
            - name: auditor
              image: python:3.12-slim
              env:
                - name: LITELLM_BASE
                  value: "http://litellm-proxy.default.svc.cluster.local:4000"
                - name: LITELLM_MASTER_KEY
                  value: "sk-milady"
                - name: FAIL_THRESHOLD
                  value: "3"
                - name: SLEEP_BETWEEN_TESTS
                  value: "3"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              command:
                - python3
                - -c
                - |
                  # stdlib only — no pip install, no direct internet needed
                  import json, os, time, uuid, urllib.request, urllib.error, ssl
                  from datetime import datetime, timezone

                  # ── K8s API ──────────────────────────────────────────────────
                  K8S = "https://kubernetes.default.svc"
                  TOK = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read().strip()
                  CA  = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
                  NS  = open("/var/run/secrets/kubernetes.io/serviceaccount/namespace").read().strip()
                  CTX = ssl.create_default_context(cafile=CA)

                  def k8s(method, path, body=None, ct="application/json"):
                      data = json.dumps(body).encode() if body else None
                      hdrs = {"Authorization": f"Bearer {TOK}"}
                      if data: hdrs["Content-Type"] = ct
                      req = urllib.request.Request(f"{K8S}{path}", data=data, headers=hdrs, method=method)
                      try:
                          with urllib.request.urlopen(req, context=CTX, timeout=15) as r:
                              return json.loads(r.read()), r.status
                      except urllib.error.HTTPError as e:
                          try:    err = json.loads(e.read())
                          except: err = {"message": str(e)}
                          return err, e.code

                  def cm_get(name):
                      d, s = k8s("GET", f"/api/v1/namespaces/{NS}/configmaps/{name}")
                      return d if s == 200 else None

                  def cm_apply(name, data):
                      if cm_get(name):
                          k8s("PATCH", f"/api/v1/namespaces/{NS}/configmaps/{name}",
                              body={"data": data}, ct="application/merge-patch+json")
                          print(f"  Patched ConfigMap {name}", flush=True)
                      else:
                          k8s("POST", f"/api/v1/namespaces/{NS}/configmaps",
                              body={"apiVersion":"v1","kind":"ConfigMap",
                                    "metadata":{"name":name,"namespace":NS},"data":data})
                          print(f"  Created ConfigMap {name}", flush=True)

                  # ── LiteLLM admin + proxy API ────────────────────────────────
                  LITELLM = os.environ.get("LITELLM_BASE", "http://litellm-proxy.default.svc.cluster.local:4000")
                  KEY     = os.environ.get("LITELLM_MASTER_KEY", "sk-milady")

                  def ll(method, path, body=None):
                      data = json.dumps(body).encode() if body else None
                      hdrs = {"Authorization": f"Bearer {KEY}"}
                      if data: hdrs["Content-Type"] = "application/json"
                      req = urllib.request.Request(f"{LITELLM}{path}", data=data, headers=hdrs, method=method)
                      try:
                          with urllib.request.urlopen(req, timeout=60) as r:
                              return json.loads(r.read()), r.status
                      except urllib.error.HTTPError as e:
                          try:    err = json.loads(e.read())
                          except: err = {"message": str(e)}
                          return err, e.code
                      except Exception as e:
                          return {"message": str(e)}, 0

                  def ll_active_ids():
                      body, s = ll("GET", "/model/info")
                      if s != 200:
                          print(f"  WARNING: GET /model/info → {s}", flush=True)
                          return None
                      return {(m.get("model_info") or {}).get("id")
                              for m in body.get("data", [])
                              if (m.get("model_info") or {}).get("id")}

                  def ll_add(entry):
                      mid = (entry.get("model_info") or {}).get("id", "?")
                      body, s = ll("POST", "/model/new", entry)
                      if s in (200, 201):
                          print(f"  ✅ Added   {mid}", flush=True)
                      else:
                          print(f"  ⚠️  Add {mid} → {s}: {body}", flush=True)

                  def ll_delete(model_id):
                      body, s = ll("POST", "/model/delete", {"id": model_id})
                      if s in (200, 201):
                          print(f"  🗑️  Deleted {model_id}", flush=True)
                      else:
                          print(f"  ⚠️  Delete {model_id} → {s}: {body}", flush=True)

                  # ── Per-model test via temp routing entry ────────────────────
                  # Cluster pods have no direct internet egress, but LiteLLM does.
                  # We create a temp model_name, test through LiteLLM (which has
                  # the API keys and egress), then delete the temp entry.
                  FAIL_THRESHOLD = int(os.environ.get("FAIL_THRESHOLD", "3"))
                  SLEEP_S        = int(os.environ.get("SLEEP_BETWEEN_TESTS", "3"))

                  TOOL = [{"type":"function","function":{"name":"kubectl_get",
                      "description":"Run kubectl get on the cluster",
                      "parameters":{"type":"object",
                          "properties":{"resource":{"type":"string"},"namespace":{"type":"string"}},
                          "required":["resource"]}}}]
                  MESSAGES = [
                      {"role":"system","content":
                          "You are a Kubernetes ops agent. Always use the provided tools when asked."},
                      {"role":"user","content":
                          "Get all pods in the default namespace using your tools right now."}
                  ]

                  def test_model(entry, timeout=60):
                      """
                      Test a specific model in isolation by temporarily adding it to
                      LiteLLM under a unique name, then cleaning up afterwards.
                      """
                      temp_name = f"audit-{uuid.uuid4().hex[:12]}"
                      temp_id   = f"tmp-{temp_name}"

                      # 1. Register temp entry
                      temp_entry = {
                          "model_name":   temp_name,
                          "litellm_params": entry["litellm_params"],
                          "model_info":   {"id": temp_id},
                      }
                      _, add_s = ll("POST", "/model/new", temp_entry)
                      if add_s not in (200, 201):
                          return {"ok": False, "latency": 0,
                                  "error": f"temp entry add failed: HTTP {add_s}"}

                      # 2. Test
                      payload = json.dumps({
                          "model": temp_name, "messages": MESSAGES, "tools": TOOL,
                          "tool_choice": "auto", "max_tokens": 128, "temperature": 0
                      }).encode()
                      req = urllib.request.Request(f"{LITELLM}/v1/chat/completions",
                          data=payload,
                          headers={"Content-Type":"application/json",
                                   "Authorization":f"Bearer {KEY}"},
                          method="POST")
                      t0 = time.time()
                      try:
                          with urllib.request.urlopen(req, timeout=timeout) as r:
                              lat  = round(time.time()-t0, 2)
                              body = json.loads(r.read())
                              ch   = body["choices"][0]
                              called = bool(ch["message"].get("tool_calls"))
                              result = {"ok": True, "tool_call": called, "latency": lat,
                                        "finish": ch.get("finish_reason")}
                      except urllib.error.HTTPError as e:
                          lat = round(time.time()-t0, 2)
                          result = ({"ok": None, "latency": lat, "error": "rate_limited"}
                                    if e.code == 429
                                    else {"ok": False, "latency": lat, "error": f"HTTP {e.code}"})
                      except Exception as e:
                          result = {"ok": False, "latency": round(time.time()-t0, 2),
                                    "error": str(e)[:200]}

                      # 3. Clean up temp entry
                      ll("POST", "/model/delete", {"id": temp_id})

                      return result

                  # ── Main ─────────────────────────────────────────────────────
                  print("=== Model Auditor starting ===", flush=True)

                  seed_cm = cm_get("litellm-config")
                  if not seed_cm:
                      print("ERROR: litellm-config not found", flush=True)
                      raise SystemExit(1)

                  candidates = json.loads(seed_cm["data"]["candidates.json"])
                  settings   = json.loads(seed_cm["data"]["settings.json"])
                  print(f"Seed: {len(candidates)} candidate models", flush=True)

                  live_cm  = cm_get("litellm-config-live")
                  tracking = {}
                  if live_cm:
                      raw = (live_cm.get("data") or {}).get("tracking.json", "")
                      if raw:
                          tracking = json.loads(raw)
                  print(f"Tracking: {len(tracking)} models from previous audit", flush=True)

                  # ── Test every candidate ─────────────────────────────────────
                  now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
                  for entry in candidates:
                      mid = (entry.get("model_info") or {}).get("id")
                      if not mid:
                          continue
                      print(f"  [{mid}] ... ", end="", flush=True)
                      r = test_model(entry)

                      t = tracking.get(mid, {"consecutive_failures":0,"total_passes":0,"total_tests":0})
                      t["last_checked"] = now
                      t["last_latency"] = r.get("latency")

                      if r["ok"] is True and r.get("tool_call"):
                          t["consecutive_failures"] = 0
                          t["total_passes"]         = t.get("total_passes", 0) + 1
                          t["total_tests"]          = t.get("total_tests",  0) + 1
                          t["last_result"]          = "pass"
                          print(f"PASS  {r['latency']}s", flush=True)
                      elif r["ok"] is True:
                          t["consecutive_failures"] = t.get("consecutive_failures", 0) + 1
                          t["total_tests"]          = t.get("total_tests",  0) + 1
                          t["last_result"]          = "text-only"
                          print(f"TEXT-ONLY  {r['latency']}s", flush=True)
                      elif r["ok"] is None:
                          t["last_result"] = "rate_limited"
                          print(f"RATE-LIMITED  (no penalty)", flush=True)
                      else:
                          t["consecutive_failures"] = t.get("consecutive_failures", 0) + 1
                          t["total_tests"]          = t.get("total_tests",  0) + 1
                          t["last_result"]          = "fail"
                          t["last_error"]           = r.get("error", "")
                          print(f"FAIL  {r.get('error','')[:100]}", flush=True)

                      tracking[mid] = t
                      time.sleep(SLEEP_S)

                  # ── Compute desired active set ───────────────────────────────
                  passing, pruned = [], []
                  for entry in candidates:
                      mid = (entry.get("model_info") or {}).get("id")
                      if tracking.get(mid, {}).get("consecutive_failures", 0) >= FAIL_THRESHOLD:
                          pruned.append(mid)
                      else:
                          passing.append(entry)

                  desired_ids = {(e.get("model_info") or {}).get("id") for e in passing}
                  print(f"\nDesired: {len(passing)} active, {len(pruned)} pruned", flush=True)

                  # ── Hot-swap via LiteLLM admin API ───────────────────────────
                  print("\nQuerying LiteLLM active models...", flush=True)
                  active_ids = ll_active_ids()
                  if active_ids is not None:
                      to_remove = active_ids - desired_ids
                      to_add    = desired_ids - active_ids
                      entry_by_id = {(e.get("model_info") or {}).get("id"): e for e in candidates}
                      print(f"Hot-swap: +{len(to_add)} add, -{len(to_remove)} remove", flush=True)
                      for mid in to_remove:
                          ll_delete(mid)
                      for mid in to_add:
                          if mid in entry_by_id:
                              ll_add(entry_by_id[mid])
                      print("Hot-swap complete. No restart needed.", flush=True)
                  else:
                      print("WARNING: LiteLLM admin API unreachable — ConfigMap still written.", flush=True)

                  # ── Write live ConfigMap ─────────────────────────────────────
                  live_cfg = {"model_list": passing}
                  live_cfg.update(settings)
                  cm_apply("litellm-config-live", {
                      "config.yaml":   json.dumps(live_cfg, indent=2),
                      "tracking.json": json.dumps(tracking, indent=2),
                  })

                  # ── Summary ──────────────────────────────────────────────────
                  pruned_set = set(pruned)
                  print("\n=== AUDIT SUMMARY ===")
                  buckets = {"pass":[], "text-only":[], "rate_limited":[], "fail":[], "pruned":[]}
                  for mid, t in sorted(tracking.items()):
                      bucket = "pruned" if mid in pruned_set else t.get("last_result", "fail")
                      buckets.get(bucket, buckets["fail"]).append((mid, t))

                  icons = {"pass":"✅","text-only":"⚠️ ","rate_limited":"⏳","fail":"❌","pruned":"🗑️ "}
                  for bucket, entries in buckets.items():
                      for mid, t in entries:
                          print(f"{icons.get(bucket,'?')} {mid}: "
                                f"{t.get('total_passes',0)}/{t.get('total_tests',0)} passes, "
                                f"cf={t.get('consecutive_failures',0)}, last={t.get('last_latency','?')}s")

                  print(f"\nDone. {len(passing)} active, {len(pruned)} pruned.", flush=True)
