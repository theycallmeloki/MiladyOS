# Model Auditor — automatically maintains litellm-config-live
#
# Tests each candidate model in isolation via a temp LiteLLM routing
# entry, then writes litellm-config-live and (if models were pruned)
# does a rolling restart so LiteLLM picks up the new config.
#
# LiteLLM is config-file-driven (no DB). The live ConfigMap is the
# authoritative model list — the init-container loads it at startup.
#
# Flow every 4h:
#   1. For each candidate: POST /model/new (temp) → test → DELETE
#   2. Write litellm-config-live (pruned config.yaml + tracking.json)
#   3. If anything pruned → kubectl rollout restart litellm-proxy
#
# Failure semantics:
#   PASS        — responded with a tool call ✅
#   TEXT-ONLY   — responded without tool call ⚠️  (soft fail, counted)
#   RATE-LIMIT  — 429, skip this round (no penalty)
#   FAIL        — error/timeout (counts toward prune threshold = 3)

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-auditor
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: model-auditor
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["litellm-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["litellm-config-live"]
    verbs: ["get", "create", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  # Restart LiteLLM when models are pruned
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["litellm-proxy"]
    verbs: ["get", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: model-auditor
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: model-auditor
subjects:
  - kind: ServiceAccount
    name: model-auditor
    namespace: default

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: model-auditor
  namespace: default
  labels:
    app: model-auditor
spec:
  # Every 4 hours. To trigger manually:
  # kubectl create job -n default audit-now --from=cronjob/model-auditor
  schedule: "0 */4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 7200
      template:
        spec:
          serviceAccountName: model-auditor
          restartPolicy: OnFailure
          containers:
            - name: auditor
              image: python:3.12-slim
              env:
                - name: LITELLM_BASE
                  value: "http://litellm-proxy.default.svc.cluster.local:4000"
                - name: LITELLM_MASTER_KEY
                  value: "sk-milady"
                - name: FAIL_THRESHOLD
                  value: "3"
                - name: SLEEP_BETWEEN_TESTS
                  value: "3"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              command:
                - python3
                - -c
                - |
                  # stdlib only — no pip install, no external dependencies
                  import json, os, time, uuid, urllib.request, urllib.error, ssl
                  from datetime import datetime, timezone

                  # ── K8s API ──────────────────────────────────────────────────
                  K8S = "https://kubernetes.default.svc"
                  TOK = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read().strip()
                  CA  = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
                  NS  = open("/var/run/secrets/kubernetes.io/serviceaccount/namespace").read().strip()
                  CTX = ssl.create_default_context(cafile=CA)

                  def k8s(method, path, body=None, ct="application/json"):
                      data = json.dumps(body).encode() if body else None
                      hdrs = {"Authorization": f"Bearer {TOK}"}
                      if data: hdrs["Content-Type"] = ct
                      req = urllib.request.Request(f"{K8S}{path}", data=data, headers=hdrs, method=method)
                      try:
                          with urllib.request.urlopen(req, context=CTX, timeout=15) as r:
                              return json.loads(r.read()), r.status
                      except urllib.error.HTTPError as e:
                          try:    err = json.loads(e.read())
                          except: err = {"message": str(e)}
                          return err, e.code

                  def cm_get(name):
                      d, s = k8s("GET", f"/api/v1/namespaces/{NS}/configmaps/{name}")
                      return d if s == 200 else None

                  def cm_apply(name, data):
                      if cm_get(name):
                          k8s("PATCH", f"/api/v1/namespaces/{NS}/configmaps/{name}",
                              body={"data": data}, ct="application/merge-patch+json")
                          print(f"  Patched ConfigMap {name}", flush=True)
                      else:
                          k8s("POST", f"/api/v1/namespaces/{NS}/configmaps",
                              body={"apiVersion":"v1","kind":"ConfigMap",
                                    "metadata":{"name":name,"namespace":NS},"data":data})
                          print(f"  Created ConfigMap {name}", flush=True)

                  def deployment_restart(name):
                      ts = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
                      _, s = k8s("PATCH", f"/apis/apps/v1/namespaces/{NS}/deployments/{name}",
                          body={"spec":{"template":{"metadata":{"annotations":{
                              "kubectl.kubernetes.io/restartedAt": ts}}}}},
                          ct="application/merge-patch+json")
                      print(f"  Rollout restart → HTTP {s}", flush=True)

                  # ── LiteLLM proxy API ────────────────────────────────────────
                  LITELLM = os.environ.get("LITELLM_BASE", "http://litellm-proxy.default.svc.cluster.local:4000")
                  KEY     = os.environ.get("LITELLM_MASTER_KEY", "sk-milady")

                  def ll(method, path, body=None):
                      data = json.dumps(body).encode() if body else None
                      hdrs = {"Authorization": f"Bearer {KEY}"}
                      if data: hdrs["Content-Type"] = "application/json"
                      req = urllib.request.Request(f"{LITELLM}{path}", data=data, headers=hdrs, method=method)
                      try:
                          with urllib.request.urlopen(req, timeout=60) as r:
                              return json.loads(r.read()), r.status
                      except urllib.error.HTTPError as e:
                          try:    err = json.loads(e.read())
                          except: err = {"message": str(e)}
                          return err, e.code
                      except Exception as e:
                          return {"message": str(e)}, 0

                  # ── Per-model test via LiteLLM passthrough ──────────────────
                  # LiteLLM routes any "openrouter/..." model path directly using
                  # its configured OPENROUTER_API_KEY — no /model/new needed and
                  # no direct internet access required from the auditor pod.
                  # For bare-metal entries (have api_base), use their model_name.
                  FAIL_THRESHOLD = int(os.environ.get("FAIL_THRESHOLD", "3"))
                  SLEEP_S        = int(os.environ.get("SLEEP_BETWEEN_TESTS", "3"))

                  TOOL = [{"type":"function","function":{"name":"kubectl_get",
                      "description":"Run kubectl get on the cluster",
                      "parameters":{"type":"object",
                          "properties":{"resource":{"type":"string"},"namespace":{"type":"string"}},
                          "required":["resource"]}}}]
                  MESSAGES = [
                      {"role":"system","content":
                          "You are a Kubernetes ops agent. Always use the provided tools when asked."},
                      {"role":"user","content":
                          "Get all pods in the default namespace using your tools right now."}
                  ]

                  def test_model(entry, timeout=60):
                      """
                      Test a model via LiteLLM passthrough routing:
                      - OpenRouter models: use litellm_params.model path directly
                        (e.g. "openrouter/openai/gpt-oss-120b:free") — LiteLLM
                        routes via its own OPENROUTER_API_KEY, no entry needed.
                      - Bare-metal models (have api_base): use their model_name
                        which IS configured in litellm-config.yaml.
                      """
                      params   = entry.get("litellm_params", {})
                      api_base = params.get("api_base")

                      if api_base:
                          # Bare-metal / in-cluster — model_name is configured
                          model_name = entry["model_name"]
                      else:
                          # OpenRouter — use full provider path as passthrough
                          model_name = params.get("model", "")

                      payload = json.dumps({
                          "model": model_name, "messages": MESSAGES, "tools": TOOL,
                          "tool_choice": "auto", "max_tokens": 128, "temperature": 0
                      }).encode()
                      req = urllib.request.Request(f"{LITELLM}/v1/chat/completions",
                          data=payload,
                          headers={"Content-Type":"application/json",
                                   "Authorization":f"Bearer {KEY}"},
                          method="POST")
                      t0 = time.time()
                      try:
                          with urllib.request.urlopen(req, timeout=timeout) as r:
                              lat  = round(time.time()-t0, 2)
                              body = json.loads(r.read())
                              ch   = body["choices"][0]
                              called = bool(ch["message"].get("tool_calls"))
                              return {"ok": True, "tool_call": called, "latency": lat,
                                      "finish": ch.get("finish_reason")}
                      except urllib.error.HTTPError as e:
                          lat = round(time.time()-t0, 2)
                          return ({"ok": None, "latency": lat, "error": "rate_limited"}
                                  if e.code == 429
                                  else {"ok": False, "latency": lat, "error": f"HTTP {e.code}"})
                      except Exception as e:
                          return {"ok": False, "latency": round(time.time()-t0, 2),
                                  "error": str(e)[:200]}

                  # ── Main ─────────────────────────────────────────────────────
                  print("=== Model Auditor starting ===", flush=True)

                  seed_cm = cm_get("litellm-config")
                  if not seed_cm:
                      print("ERROR: litellm-config not found", flush=True)
                      raise SystemExit(1)

                  candidates = json.loads(seed_cm["data"]["candidates.json"])
                  settings   = json.loads(seed_cm["data"]["settings.json"])
                  print(f"Seed: {len(candidates)} candidate models", flush=True)

                  live_cm  = cm_get("litellm-config-live")
                  tracking = {}
                  if live_cm:
                      raw = (live_cm.get("data") or {}).get("tracking.json", "")
                      if raw:
                          tracking = json.loads(raw)
                  print(f"Tracking: {len(tracking)} models from previous audit", flush=True)

                  # ── Test every candidate ─────────────────────────────────────
                  now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
                  for entry in candidates:
                      mid = (entry.get("model_info") or {}).get("id")
                      if not mid:
                          continue
                      print(f"  [{mid}] ... ", end="", flush=True)
                      r = test_model(entry)

                      t = tracking.get(mid, {"consecutive_failures":0,"total_passes":0,"total_tests":0})
                      t["last_checked"] = now
                      t["last_latency"] = r.get("latency")

                      if r["ok"] is True and r.get("tool_call"):
                          t["consecutive_failures"] = 0
                          t["total_passes"]         = t.get("total_passes", 0) + 1
                          t["total_tests"]          = t.get("total_tests",  0) + 1
                          t["last_result"]          = "pass"
                          print(f"PASS  {r['latency']}s", flush=True)
                      elif r["ok"] is True:
                          t["consecutive_failures"] = t.get("consecutive_failures", 0) + 1
                          t["total_tests"]          = t.get("total_tests",  0) + 1
                          t["last_result"]          = "text-only"
                          print(f"TEXT-ONLY  {r['latency']}s", flush=True)
                      elif r["ok"] is None:
                          t["last_result"] = "rate_limited"
                          print(f"RATE-LIMITED  (no penalty)", flush=True)
                      else:
                          t["consecutive_failures"] = t.get("consecutive_failures", 0) + 1
                          t["total_tests"]          = t.get("total_tests",  0) + 1
                          t["last_result"]          = "fail"
                          t["last_error"]           = r.get("error", "")
                          print(f"FAIL  {r.get('error','')[:100]}", flush=True)

                      tracking[mid] = t
                      time.sleep(SLEEP_S)

                  # ── Compute desired active set ───────────────────────────────
                  passing, pruned = [], []
                  for entry in candidates:
                      mid = (entry.get("model_info") or {}).get("id")
                      if tracking.get(mid, {}).get("consecutive_failures", 0) >= FAIL_THRESHOLD:
                          pruned.append(mid)
                      else:
                          passing.append(entry)

                  print(f"\nResult: {len(passing)} active, {len(pruned)} pruned", flush=True)

                  # ── Write live ConfigMap ─────────────────────────────────────
                  live_cfg = {"model_list": passing}
                  live_cfg.update(settings)
                  cm_apply("litellm-config-live", {
                      "config.yaml":   json.dumps(live_cfg, indent=2),
                      "tracking.json": json.dumps(tracking, indent=2),
                  })

                  # ── Restart LiteLLM if anything was pruned ───────────────────
                  # Config-file driven (no DB), so restart is required to apply.
                  # Init-container will load the pruned litellm-config-live.
                  if pruned:
                      print(f"Pruned {len(pruned)} models — restarting litellm-proxy...", flush=True)
                      deployment_restart("litellm-proxy")
                  else:
                      print("Nothing pruned — no restart needed.", flush=True)

                  # ── Summary ──────────────────────────────────────────────────
                  pruned_set = set(pruned)
                  print("\n=== AUDIT SUMMARY ===")
                  buckets = {"pass":[], "text-only":[], "rate_limited":[], "fail":[], "pruned":[]}
                  for mid, t in sorted(tracking.items()):
                      bucket = "pruned" if mid in pruned_set else t.get("last_result", "fail")
                      buckets.get(bucket, buckets["fail"]).append((mid, t))

                  icons = {"pass":"✅","text-only":"⚠️ ","rate_limited":"⏳","fail":"❌","pruned":"🗑️ "}
                  for bucket, entries in buckets.items():
                      for mid, t in entries:
                          print(f"{icons.get(bucket,'?')} {mid}: "
                                f"{t.get('total_passes',0)}/{t.get('total_tests',0)} passes, "
                                f"cf={t.get('consecutive_failures',0)}, last={t.get('last_latency','?')}s")

                  print(f"\nDone. {len(passing)} active, {len(pruned)} pruned.", flush=True)
