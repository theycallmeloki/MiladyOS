# Model Auditor — automatically maintains litellm-config-live
#
# Reads seed candidate pool from litellm-config (git-managed),
# tests every model for tool-calling correctness + latency, then:
#   1. Hot-swaps via LiteLLM admin API (instant, zero restart)
#      - DELETE /model/delete  for models with 3+ consecutive failures
#      - POST   /model/new     for models that recovered or are new
#   2. Writes litellm-config-live ConfigMap (for clean restart persistence)
#
# litellm-config (git/ArgoCD)  — candidate pool, never shrinks automatically
#       ↓ candidates.json + settings.json
# model-auditor CronJob (4h)   — test → hot-swap via API + write live CM
#       ↓ live CM for restarts     ↓ admin API for runtime
# litellm-config-live (K8s)   LiteLLM router (in-memory, instant)

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-auditor
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: model-auditor
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["litellm-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["litellm-config-live"]
    verbs: ["get", "create", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: model-auditor
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: model-auditor
subjects:
  - kind: ServiceAccount
    name: model-auditor
    namespace: default

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: model-auditor
  namespace: default
  labels:
    app: model-auditor
spec:
  # Every 4 hours. To trigger manually:
  # kubectl create job -n default audit-now --from=cronjob/model-auditor
  schedule: "0 */4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 7200
      template:
        spec:
          serviceAccountName: model-auditor
          restartPolicy: OnFailure
          containers:
            - name: auditor
              image: python:3.12-slim
              env:
                - name: LITELLM_BASE
                  value: "http://litellm-proxy.default.svc.cluster.local:4000"
                - name: LITELLM_MASTER_KEY
                  value: "sk-milady"
                - name: FAIL_THRESHOLD
                  value: "3"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              command:
                - python3
                - -c
                - |
                  # stdlib only — no pip install, no external dependencies
                  import json, os, time, urllib.request, urllib.error, ssl
                  from datetime import datetime, timezone

                  # ── K8s API via service account ──────────────────────────────
                  K8S = "https://kubernetes.default.svc"
                  TOK = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read().strip()
                  CA  = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
                  NS  = open("/var/run/secrets/kubernetes.io/serviceaccount/namespace").read().strip()
                  CTX = ssl.create_default_context(cafile=CA)

                  def k8s(method, path, body=None, ct="application/json"):
                      data = json.dumps(body).encode() if body else None
                      hdrs = {"Authorization": f"Bearer {TOK}"}
                      if data: hdrs["Content-Type"] = ct
                      req = urllib.request.Request(f"{K8S}{path}", data=data, headers=hdrs, method=method)
                      try:
                          with urllib.request.urlopen(req, context=CTX, timeout=15) as r:
                              return json.loads(r.read()), r.status
                      except urllib.error.HTTPError as e:
                          try:    err = json.loads(e.read())
                          except: err = {"message": str(e)}
                          return err, e.code

                  def cm_get(name):
                      d, s = k8s("GET", f"/api/v1/namespaces/{NS}/configmaps/{name}")
                      return d if s == 200 else None

                  def cm_apply(name, data):
                      if cm_get(name):
                          k8s("PATCH", f"/api/v1/namespaces/{NS}/configmaps/{name}",
                              body={"data": data}, ct="application/merge-patch+json")
                          print(f"  Patched ConfigMap {name}", flush=True)
                      else:
                          k8s("POST", f"/api/v1/namespaces/{NS}/configmaps",
                              body={"apiVersion":"v1","kind":"ConfigMap",
                                    "metadata":{"name":name,"namespace":NS},"data":data})
                          print(f"  Created ConfigMap {name}", flush=True)

                  # ── LiteLLM admin API ────────────────────────────────────────
                  LITELLM = os.environ.get("LITELLM_BASE", "http://litellm-proxy.default.svc.cluster.local:4000")
                  KEY     = os.environ.get("LITELLM_MASTER_KEY", "sk-milady")

                  def ll(method, path, body=None):
                      """Call the LiteLLM admin API. Returns (body, status)."""
                      data = json.dumps(body).encode() if body else None
                      hdrs = {"Authorization": f"Bearer {KEY}"}
                      if data: hdrs["Content-Type"] = "application/json"
                      req = urllib.request.Request(f"{LITELLM}{path}", data=data, headers=hdrs, method=method)
                      try:
                          with urllib.request.urlopen(req, timeout=15) as r:
                              return json.loads(r.read()), r.status
                      except urllib.error.HTTPError as e:
                          try:    err = json.loads(e.read())
                          except: err = {"message": str(e)}
                          return err, e.code
                      except Exception as e:
                          return {"message": str(e)}, 0

                  def ll_active_ids():
                      """Return set of model_info.id currently loaded in LiteLLM."""
                      body, s = ll("GET", "/model/info")
                      if s != 200:
                          print(f"  WARNING: GET /model/info returned {s}: {body}", flush=True)
                          return None
                      ids = set()
                      for m in body.get("data", []):
                          mid = (m.get("model_info") or {}).get("id")
                          if mid:
                              ids.add(mid)
                      return ids

                  def ll_add(entry):
                      mid = (entry.get("model_info") or {}).get("id", "?")
                      body, s = ll("POST", "/model/new", entry)
                      if s in (200, 201):
                          print(f"  ✅ Added   {mid}", flush=True)
                      else:
                          print(f"  ⚠️  Add {mid} → HTTP {s}: {body}", flush=True)

                  def ll_delete(model_id):
                      body, s = ll("POST", "/model/delete", {"id": model_id})
                      if s in (200, 201):
                          print(f"  🗑️  Deleted {model_id}", flush=True)
                      else:
                          print(f"  ⚠️  Delete {model_id} → HTTP {s}: {body}", flush=True)

                  # ── Test a model via the LiteLLM proxy ──────────────────────
                  FAIL_THRESHOLD = int(os.environ.get("FAIL_THRESHOLD", "3"))
                  TOOL = [{"type":"function","function":{"name":"kubectl_get",
                      "description":"Run kubectl get on the cluster",
                      "parameters":{"type":"object",
                          "properties":{"resource":{"type":"string"},"namespace":{"type":"string"}},
                          "required":["resource"]}}}]
                  MESSAGES = [
                      {"role":"system","content":
                          "You are a Kubernetes ops agent. Always use the provided tools when asked to perform cluster operations."},
                      {"role":"user","content":
                          "Get all pods in the default namespace using your tools right now."}
                  ]

                  def test_model(model_id, timeout=60):
                      payload = json.dumps({
                          "model":model_id, "messages":MESSAGES, "tools":TOOL,
                          "tool_choice":"auto", "max_tokens":128, "temperature":0
                      }).encode()
                      req = urllib.request.Request(f"{LITELLM}/v1/chat/completions", data=payload,
                          headers={"Content-Type":"application/json",
                                   "Authorization":f"Bearer {KEY}"},
                          method="POST")
                      t0 = time.time()
                      try:
                          with urllib.request.urlopen(req, timeout=timeout) as r:
                              lat  = round(time.time()-t0, 2)
                              body = json.loads(r.read())
                              ch   = body["choices"][0]
                              called = bool(ch["message"].get("tool_calls"))
                              return {"ok":True, "tool_call":called, "latency":lat,
                                      "finish":ch.get("finish_reason")}
                      except Exception as e:
                          return {"ok":False, "latency":round(time.time()-t0,2), "error":str(e)[:200]}

                  # ── Main ─────────────────────────────────────────────────────
                  print("=== Model Auditor starting ===", flush=True)

                  seed_cm = cm_get("litellm-config")
                  if not seed_cm:
                      print("ERROR: litellm-config seed not found", flush=True)
                      raise SystemExit(1)

                  seed_data  = seed_cm.get("data", {})
                  candidates = json.loads(seed_data["candidates.json"])
                  settings   = json.loads(seed_data["settings.json"])
                  print(f"Seed: {len(candidates)} candidate models", flush=True)

                  live_cm  = cm_get("litellm-config-live")
                  tracking = {}
                  if live_cm:
                      raw = (live_cm.get("data") or {}).get("tracking.json", "")
                      if raw:
                          tracking = json.loads(raw)
                  print(f"Tracking: {len(tracking)} models from previous audit", flush=True)

                  # ── Test every candidate ─────────────────────────────────────
                  now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
                  for entry in candidates:
                      mid = (entry.get("model_info") or {}).get("id")
                      if not mid:
                          continue
                      print(f"  [{mid}] ... ", end="", flush=True)
                      r = test_model(mid)

                      t = tracking.get(mid, {"consecutive_failures":0,"total_passes":0,"total_tests":0})
                      t["total_tests"]  = t.get("total_tests",  0) + 1
                      t["last_checked"] = now
                      t["last_latency"] = r.get("latency")

                      if r["ok"] and r.get("tool_call"):
                          t["consecutive_failures"] = 0
                          t["total_passes"]         = t.get("total_passes", 0) + 1
                          t["last_result"]          = "pass"
                          print(f"PASS  {r['latency']}s", flush=True)
                      elif r["ok"]:
                          t["consecutive_failures"] = t.get("consecutive_failures", 0) + 1
                          t["last_result"]          = "text-only"
                          print(f"TEXT-ONLY  {r['latency']}s", flush=True)
                      else:
                          t["consecutive_failures"] = t.get("consecutive_failures", 0) + 1
                          t["last_result"]          = "fail"
                          t["last_error"]           = r.get("error", "")
                          print(f"FAIL  {r.get('error','')[:100]}", flush=True)

                      tracking[mid] = t
                      time.sleep(2)

                  # ── Compute desired active set ───────────────────────────────
                  passing = []
                  pruned  = []
                  for entry in candidates:
                      mid = (entry.get("model_info") or {}).get("id")
                      cf  = tracking.get(mid, {}).get("consecutive_failures", 0)
                      if cf >= FAIL_THRESHOLD:
                          pruned.append(mid)
                      else:
                          passing.append(entry)

                  desired_ids = {(e.get("model_info") or {}).get("id") for e in passing}
                  print(f"\nDesired: {len(passing)} active, {len(pruned)} pruned", flush=True)

                  # ── Hot-swap via LiteLLM admin API (no restart needed) ───────
                  print("\nQuerying LiteLLM active models...", flush=True)
                  active_ids = ll_active_ids()

                  if active_ids is not None:
                      to_remove = active_ids - desired_ids
                      to_add    = desired_ids - active_ids

                      print(f"Hot-swap: +{len(to_add)} to add, -{len(to_remove)} to remove", flush=True)

                      # Build a lookup from id → full entry for additions
                      entry_by_id = {
                          (e.get("model_info") or {}).get("id"): e
                          for e in candidates
                      }

                      for mid in to_remove:
                          ll_delete(mid)

                      for mid in to_add:
                          if mid in entry_by_id:
                              ll_add(entry_by_id[mid])

                      print("Hot-swap complete. No restart needed.", flush=True)
                  else:
                      print("WARNING: Could not reach LiteLLM admin API — skipping hot-swap.", flush=True)
                      print("         Live ConfigMap will still be written for next restart.", flush=True)

                  # ── Write live ConfigMap (for clean restarts) ────────────────
                  live_cfg = {"model_list": passing}
                  live_cfg.update(settings)
                  cm_apply("litellm-config-live", {
                      "config.yaml":   json.dumps(live_cfg, indent=2),
                      "tracking.json": json.dumps(tracking, indent=2),
                  })

                  # ── Summary ──────────────────────────────────────────────────
                  pruned_set = set(pruned)
                  print("\n=== AUDIT SUMMARY ===")
                  buckets = {"pass":[], "text-only":[], "fail":[], "pruned":[]}
                  for mid, t in sorted(tracking.items()):
                      bucket = "pruned" if mid in pruned_set else t.get("last_result", "fail")
                      buckets.get(bucket, buckets["fail"]).append((mid, t))

                  icons = {"pass":"✅", "text-only":"⚠️ ", "fail":"❌", "pruned":"🗑️ "}
                  for bucket, entries in buckets.items():
                      for mid, t in entries:
                          p   = t.get("total_passes", 0)
                          n   = t.get("total_tests",  0)
                          lat = t.get("last_latency", "?")
                          cf  = t.get("consecutive_failures", 0)
                          print(f"{icons[bucket]} {mid}: {p}/{n} passes, cf={cf}, last={lat}s")

                  print(f"\nDone. {len(passing)} active models, {len(pruned)} pruned.", flush=True)
