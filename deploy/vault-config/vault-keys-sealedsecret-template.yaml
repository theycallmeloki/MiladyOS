# This is a template for the SealedSecret
# After initializing Vault and getting the unseal keys, follow these steps:
#
# 1. Create the secret:
# kubectl create secret generic vault-threshold-keys \
#   --from-literal=key1=YOUR_UNSEAL_KEY_1 \
#   --from-literal=key2=YOUR_UNSEAL_KEY_2 \
#   --from-literal=key3=YOUR_UNSEAL_KEY_3 \
#   --dry-run=client -o yaml -n vault > vault-keys-secret.yaml
#
# 2. Seal it with kubeseal:
# kubeseal --format yaml < vault-keys-secret.yaml > vault-keys-sealedsecret.yaml
#
# 3. Replace this template with the generated SealedSecret
#
# Example SealedSecret structure:
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: vault-threshold-keys
  namespace: vault
spec:
  encryptedData:
    key1: # ENCRYPTED_KEY_1_HERE
    key2: # ENCRYPTED_KEY_2_HERE
    key3: # ENCRYPTED_KEY_3_HERE
  template:
    metadata:
      name: vault-threshold-keys
      namespace: vault
    type: Opaque