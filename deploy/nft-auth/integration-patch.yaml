apiVersion: apps/v1
kind: Deployment
metadata:
  name: miladyos-with-nft-auth
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: miladyos
      component: server
  template:
    metadata:
      labels:
        app: miladyos
        component: server
    spec:
      initContainers:
      - name: volume-permissions
        image: busybox
        command: ["sh", "-c", "chown -R 1000:1000 /var/jenkins_home && mkdir -p /var/log && chmod 777 /var/log && mkdir -p /root/.kube /root/.pachyderm && touch /root/.kube/config /root/.pachyderm/config.json && chmod -R 700 /root/.kube /root/.pachyderm"]
        volumeMounts:
        - name: miladyos-home
          mountPath: /var/jenkins_home
        - name: varlog
          mountPath: /var/log
        - name: kube-config
          mountPath: /root/.kube
        - name: pachyderm-config
          mountPath: /root/.pachyderm
      containers:
      - name: dind
        image: docker:dind
        securityContext:
          privileged: true
        env:
          - name: DOCKER_TLS_CERTDIR
            value: ""
        volumeMounts:
          - name: docker-storage
            mountPath: /var/lib/docker
          - name: docker-run
            mountPath: /var/run
        readinessProbe:
          exec:
            command: ["docker", "info"]
          initialDelaySeconds: 10
          periodSeconds: 5
      - name: registry
        image: registry:2
        ports:
        - containerPort: 5000
        volumeMounts:
        - name: registry-data
          mountPath: /var/lib/registry
      - name: miladyos
        image: ogmiladyloki/miladyos:latest
        securityContext:
          privileged: true
          runAsUser: 0
        ports:
        - containerPort: 8080
          name: web
        - containerPort: 50000
          name: agent
        - containerPort: 6000
          name: mcp
        - containerPort: 11434
          name: ollama
        env:
        - name: JENKINS_ADMIN_ID
          value: "admin"
        - name: JENKINS_ADMIN_PASSWORD
          value: "password"
        - name: KUBERNETES_MODE
          value: "true"
        - name: DISABLE_DOCKER
          value: "false"
        - name: JENKINS_URL
          value: "http://miladyos:8080"
        - name: REDIS_HOST
          value: "localhost"
        - name: REDIS_PORT
          value: "6379"
        # NFT Authentication Configuration
        - name: NFT_AUTH_ENABLED
          value: "true"
        - name: HIGH_INTEGRITY_MILADY_CONTRACT
          value: "0xf01B34d9418874258B35b0507AB53ED971CBB8D3"
        - name: ETHEREUM_RPC_URL
          valueFrom:
            secretKeyRef:
              name: nft-auth-config
              key: ethereum-rpc-url
        - name: ETHERSCAN_API_KEY
          valueFrom:
            secretKeyRef:
              name: nft-auth-config
              key: etherscan-api-key
        volumeMounts:
        - name: miladyos-home
          mountPath: /var/jenkins_home
        - name: varlog
          mountPath: /var/log
        - name: docker-run
          mountPath: /var/run
        - name: kube-config
          mountPath: /root/.kube
        - name: pachyderm-config
          mountPath: /root/.pachyderm
        # Mount NFT auth middleware
        - name: nft-auth-middleware
          mountPath: /app/nft_auth_middleware.py
          subPath: nft-auth-middleware.py
        - name: nft-auth-web
          mountPath: /var/jenkins_home/workspace/nft-web3-auth.js
          subPath: nft-web3-auth.js
      - name: redis
        image: redis:6.2-alpine
        ports:
        - containerPort: 6379
        command: ["redis-server", "--appendonly", "yes"]
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: miladyos-home
        persistentVolumeClaim:
          claimName: miladyos-home-pvc
      - name: docker-storage
        persistentVolumeClaim:
          claimName: docker-storage-pvc
      - name: docker-run
        emptyDir: {}
      - name: varlog
        emptyDir: {}
      - name: redis-data
        emptyDir: {}
      - name: kube-config
        persistentVolumeClaim:
          claimName: miladyos-kube-config-pvc
      - name: pachyderm-config
        persistentVolumeClaim:
          claimName: miladyos-pachyderm-config-pvc
      - name: registry-data
        persistentVolumeClaim:
          claimName: registry-data-pvc
      # NFT Auth middleware volumes
      - name: nft-auth-middleware
        configMap:
          name: nft-auth-middleware
          defaultMode: 0755
      - name: nft-auth-web
        configMap:
          name: nft-auth-web
          defaultMode: 0644

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nft-auth-middleware
  namespace: default
data:
  nft-auth-middleware.py: |
    # Content from nft-auth-middleware.py file
    # (This would be populated by kustomize or manually)

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nft-auth-web
  namespace: default
data:
  nft-web3-auth.js: |
    # Content from nft-web3-auth.js file
    # (This would be populated by kustomize or manually)

---
apiVersion: v1
kind: Secret
metadata:
  name: nft-auth-config
  namespace: default
type: Opaque
stringData:
  ethereum-rpc-url: "https://mainnet.infura.io/v3/YOUR_INFURA_PROJECT_ID"
  etherscan-api-key: "YOUR_ETHERSCAN_API_KEY"