apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: nft-auth-integration
  annotations:
    config.kubernetes.io/local-config: "true"

namespace: default

resources:
# Standalone NFT authentication service
- nft-auth-deployment.yaml

labels:
- pairs:
    app.kubernetes.io/name: nft-auth-service
    app.kubernetes.io/part-of: miladyos
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kustomize

# Generate ConfigMaps from local files
configMapGenerator:
- name: nft-auth-service
  files:
  - nft-auth-service.py