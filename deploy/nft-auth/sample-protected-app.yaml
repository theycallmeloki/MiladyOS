apiVersion: v1
kind: Namespace
metadata:
  name: sample-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-nginx
  namespace: sample-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-nginx
  template:
    metadata:
      labels:
        app: sample-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html
        configMap:
          name: sample-html
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-html
  namespace: sample-app
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Protected MiladyOS Service</title>
        <style>
            body { background: #000; color: #ff69b4; font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
            .content { text-align: center; }
            h1 { font-size: 3rem; }
        </style>
    </head>
    <body>
        <div class="content">
            <h1>✨ Welcome High Integrity Milady Holder ✨</h1>
            <p>You successfully authenticated with your NFT!</p>
            <p>This is a protected service on MiladyOS</p>
        </div>
    </body>
    </html>
---
apiVersion: v1
kind: Service
metadata:
  name: sample-nginx
  namespace: sample-app
spec:
  selector:
    app: sample-nginx
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-nginx-protected
  namespace: sample-app
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # NFT Authentication - these annotations make nginx check auth before allowing access
    nginx.ingress.kubernetes.io/auth-url: "http://nft-auth.nft-auth.svc.cluster.local/check"
    nginx.ingress.kubernetes.io/auth-signin: "https://auth.miladyos.net/?redirect=$scheme://$host$request_uri"
spec:
  ingressClassName: nginx
  rules:
  - host: sample.miladyos.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sample-nginx
            port:
              number: 80
  tls:
  - hosts:
    - sample.miladyos.net
    secretName: sample-nginx-tls