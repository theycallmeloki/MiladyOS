---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-nginx-app-protected
  namespace: default
  annotations:
    # High Integrity Milady NFT Authentication
    nginx.ingress.kubernetes.io/auth-url: "http://nft-auth-service.default.svc.cluster.local/auth"
    nginx.ingress.kubernetes.io/auth-signin: "http://nft-auth-service.default.svc.cluster.local/login?rd=$scheme://$best_http_host$request_uri"
    nginx.ingress.kubernetes.io/auth-signin-redirect-param: "rd"
    
    # Pass authentication info to the app
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-User,X-Auth-NFT"
    
    # Optional: SSL configuration (uncomment if you have cert-manager)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  # Uncomment for SSL
  # tls:
  # - hosts:
  #   - test-nft-auth.your-domain.com
  #   secretName: test-nft-auth-tls
  rules:
  - host: test-nft-auth.localhost  # Change this to your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: test-nginx-app
            port:
              number: 80