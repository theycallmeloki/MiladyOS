apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-nginx-app
  namespace: default
  labels:
    app: test-nginx-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-nginx-app
  template:
    metadata:
      labels:
        app: test-nginx-app
    spec:
      containers:
      - name: nginx
        image: nginx:1.21
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: nginx-config
        configMap:
          name: test-nginx-content

---
apiVersion: v1
kind: Service
metadata:
  name: test-nginx-app
  namespace: default
  labels:
    app: test-nginx-app
spec:
  selector:
    app: test-nginx-app
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-nginx-content
  namespace: default
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Milady Protected App</title>
        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
        <script src="https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js"></script>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            
            body {
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
                background: #0a0a0a;
                color: #ffffff;
                min-height: 100vh;
            }
            
            .app {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }
            
            .container {
                max-width: 600px;
                width: 100%;
                background: rgba(255, 255, 255, 0.02);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 20px;
                padding: 40px;
                backdrop-filter: blur(20px);
            }
            
            .header {
                text-align: center;
                margin-bottom: 40px;
            }
            
            .milady-logo {
                font-size: 64px;
                margin-bottom: 16px;
                filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3));
            }
            
            .title {
                font-size: 28px;
                font-weight: 600;
                margin-bottom: 8px;
                background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
            
            .subtitle {
                color: rgba(255, 255, 255, 0.7);
                font-size: 16px;
            }
            
            .auth-section {
                margin: 30px 0;
                padding: 30px;
                background: rgba(255, 255, 255, 0.03);
                border-radius: 16px;
                border: 1px solid rgba(255, 255, 255, 0.08);
            }
            
            .connect-button {
                width: 100%;
                padding: 16px 24px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                border: none;
                border-radius: 12px;
                color: white;
                font-size: 16px;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.3s ease;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 12px;
            }
            
            .connect-button:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
            }
            
            .connect-button:disabled {
                opacity: 0.6;
                cursor: not-allowed;
                transform: none;
            }
            
            .status-card {
                padding: 20px;
                border-radius: 12px;
                border: 1px solid;
                margin: 20px 0;
            }
            
            .status-success {
                background: rgba(76, 175, 80, 0.1);
                border-color: #4CAF50;
                color: #4CAF50;
            }
            
            .status-error {
                background: rgba(244, 67, 54, 0.1);
                border-color: #f44336;
                color: #f44336;
            }
            
            .status-info {
                background: rgba(33, 150, 243, 0.1);
                border-color: #2196F3;
                color: #2196F3;
            }
            
            .wallet-info {
                display: flex;
                align-items: center;
                gap: 12px;
                margin: 16px 0;
                padding: 16px;
                background: rgba(255, 255, 255, 0.05);
                border-radius: 8px;
            }
            
            .wallet-address {
                font-family: 'Courier New', monospace;
                font-size: 14px;
                color: rgba(255, 255, 255, 0.8);
                word-break: break-all;
            }
            
            .contract-info {
                margin-top: 30px;
                padding: 20px;
                background: rgba(255, 255, 255, 0.02);
                border-radius: 12px;
                border-left: 4px solid #ff6b9d;
            }
            
            .contract-address {
                font-family: 'Courier New', monospace;
                font-size: 12px;
                color: rgba(255, 255, 255, 0.6);
                word-break: break-all;
                margin-top: 8px;
            }
            
            .loading {
                display: inline-block;
                width: 20px;
                height: 20px;
                border: 2px solid rgba(255, 255, 255, 0.3);
                border-radius: 50%;
                border-top-color: #fff;
                animation: spin 1s ease-in-out infinite;
            }
            
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
            
            .logout-button {
                padding: 8px 16px;
                background: rgba(244, 67, 54, 0.2);
                border: 1px solid #f44336;
                border-radius: 8px;
                color: #f44336;
                font-size: 14px;
                cursor: pointer;
                transition: all 0.3s ease;
            }
            
            .logout-button:hover {
                background: rgba(244, 67, 54, 0.3);
            }
        </style>
    </head>
    <body>
        <div id="app" class="app">
            <div class="container">
                <div class="header">
                    <div class="milady-logo">✨</div>
                    <h1 class="title">Milady Protected</h1>
                    <p class="subtitle">High Integrity NFT Authentication</p>
                </div>

                <div class="auth-section">
                    <div v-if="!connected">
                        <button @click="connectWallet" :disabled="loading" class="connect-button">
                            <span v-if="loading" class="loading"></span>
                            <span v-else>🦊</span>
                            {{ loading ? 'Connecting...' : 'Sign in with Ethereum' }}
                        </button>
                    </div>

                    <div v-else>
                        <div class="status-card status-success">
                            <h3>✅ Successfully Authenticated</h3>
                            <p>Welcome, High Integrity Milady holder!</p>
                        </div>

                        <div class="wallet-info">
                            <span>🔗</span>
                            <div>
                                <div style="font-weight: 500;">Connected Wallet</div>
                                <div class="wallet-address">{{ walletAddress }}</div>
                            </div>
                        </div>

                        <button @click="logout" class="logout-button">Logout</button>
                    </div>

                    <div v-if="error" class="status-card status-error">
                        <h4>❌ Authentication Failed</h4>
                        <p>{{ error }}</p>
                    </div>

                    <div v-if="nftBalance !== null" class="status-card status-info">
                        <h4>💎 NFT Balance</h4>
                        <p>High Integrity Milady NFTs: {{ nftBalance }}</p>
                    </div>
                </div>

                <div class="contract-info">
                    <h4>📋 Contract Information</h4>
                    <p>High Integrity Milady</p>
                    <div class="contract-address">0xf01B34d9418874258B35b0507AB53ED971CBB8D3</div>
                </div>
            </div>
        </div>

        <script>
            const { createApp, ref, onMounted } = Vue;

            createApp({
                setup() {
                    const connected = ref(false);
                    const loading = ref(false);
                    const walletAddress = ref('');
                    const nftBalance = ref(null);
                    const error = ref('');
                    
                    const CONTRACT_ADDRESS = "0xf01B34d9418874258B35b0507AB53ED971CBB8D3";

                    const connectWallet = async () => {
                        if (!window.ethereum) {
                            error.value = "MetaMask not found. Please install MetaMask to continue.";
                            return;
                        }

                        loading.value = true;
                        error.value = '';

                        try {
                            // Request account access
                            await window.ethereum.request({ method: 'eth_requestAccounts' });
                            
                            const provider = new ethers.providers.Web3Provider(window.ethereum);
                            const signer = provider.getSigner();
                            const address = await signer.getAddress();
                            
                            walletAddress.value = address;

                            // Check network
                            const network = await provider.getNetwork();
                            if (network.chainId !== 1) {
                                await window.ethereum.request({
                                    method: 'wallet_switchEthereumChain',
                                    params: [{ chainId: '0x1' }],
                                });
                            }

                            // Check NFT balance
                            const abi = ["function balanceOf(address owner) view returns (uint256)"];
                            const contract = new ethers.Contract(CONTRACT_ADDRESS, abi, provider);
                            const balance = await contract.balanceOf(address);
                            nftBalance.value = balance.toString();

                            if (!balance.gt(0)) {
                                throw new Error("High Integrity Milady NFT required for access");
                            }

                            connected.value = true;
                            
                        } catch (err) {
                            error.value = err.message;
                        } finally {
                            loading.value = false;
                        }
                    };

                    const logout = () => {
                        connected.value = false;
                        walletAddress.value = '';
                        nftBalance.value = null;
                        error.value = '';
                    };

                    onMounted(() => {
                        // Check if wallet is already connected
                        if (window.ethereum && window.ethereum.selectedAddress) {
                            connectWallet();
                        }
                    });

                    return {
                        connected,
                        loading,
                        walletAddress,
                        nftBalance,
                        error,
                        connectWallet,
                        logout
                    };
                }
            }).mount('#app');
        </script>
    </body>
    </html>

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-nginx-app-protected
  namespace: default
  annotations:
    # High Integrity Milady NFT Authentication
    nginx.ingress.kubernetes.io/auth-url: "https://nft-auth.miladyos.net/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://nft-auth.miladyos.net/login?rd=$scheme://$best_http_host$request_uri"
    nginx.ingress.kubernetes.io/auth-signin-redirect-param: "rd"
    
    # Pass authentication info to the app
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-User,X-Auth-NFT"
    
    # Optional: SSL configuration (uncomment if you have cert-manager)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  # Uncomment for SSL
  # tls:
  # - hosts:
  #   - test-nft-auth.your-domain.com
  #   secretName: test-nft-auth-tls
  rules:
  - host: test.miladyos.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: test-nginx-app
            port:
              number: 80