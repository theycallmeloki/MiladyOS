apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-nginx-app
  namespace: default
  labels:
    app: test-nginx-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-nginx-app
  template:
    metadata:
      labels:
        app: test-nginx-app
    spec:
      containers:
      - name: nginx
        image: nginx:1.21
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: nginx-config
        configMap:
          name: test-nginx-content

---
apiVersion: v1
kind: Service
metadata:
  name: test-nginx-app
  namespace: default
  labels:
    app: test-nginx-app
spec:
  selector:
    app: test-nginx-app
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  type: ClusterIP

---
