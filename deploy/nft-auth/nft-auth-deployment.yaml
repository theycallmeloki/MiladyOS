apiVersion: apps/v1
kind: Deployment
metadata:
  name: nft-auth-service
  namespace: default
  labels:
    app: nft-auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nft-auth-service
  template:
    metadata:
      labels:
        app: nft-auth-service
    spec:
      containers:
      - name: nft-auth
        image: python:3.11-slim
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8080
          name: metrics
        env:
        - name: HIGH_INTEGRITY_MILADY_CONTRACT
          value: "0xf01B34d9418874258B35b0507AB53ED971CBB8D3"
        - name: ETHEREUM_RPC_URL
          value: "https://ethereum-rpc.publicnode.com"
        - name: REDIS_HOST
          value: "miladyos"
        - name: REDIS_PORT
          value: "6379"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: nft-auth-config
              key: secret-key
        - name: SERVICE_PORT
          value: "8080"
        command: ["/bin/bash", "-c"]
        args:
        - |
          pip install --no-cache-dir flask web3 redis requests eth-account prometheus-client &&
          python /app/nft-auth-service.py
        volumeMounts:
        - name: nft-auth-service
          mountPath: /app/nft-auth-service.py
          subPath: nft-auth-service.py
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 6
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: nft-auth-service
        configMap:
          name: nft-auth-service
          defaultMode: 0755

---
apiVersion: v1
kind: Service
metadata:
  name: nft-auth-service
  namespace: default
  labels:
    app: nft-auth-service
spec:
  selector:
    app: nft-auth-service
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: Secret
metadata:
  name: nft-auth-config
  namespace: default
type: Opaque
stringData:
  secret-key: "your-secret-key-change-this-in-production"
