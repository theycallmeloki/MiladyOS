apiVersion: batch/v1
kind: CronJob
metadata:
  name: nft-holder-list-generator
  namespace: default
  labels:
    app: nft-auth-service
    component: holder-list-generator
spec:
  schedule: "0 12 * * *"  # Daily at 12:00 PM UTC
  timeZone: "UTC"
  concurrencyPolicy: Forbid  # Prevent overlapping jobs
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: nft-holder-list-job
        spec:
          restartPolicy: OnFailure
          containers:
          - name: holder-list-generator
            image: curlimages/curl:8.5.0
            command: ["/bin/sh"]
            args:
            - -c
            - |
              echo "Starting daily holder list generation at $(date)"
              
              # Get the secret key for admin authentication
              SECRET_KEY=$(cat /etc/secrets/secret-key)
              
              # Call the admin endpoint to generate holder list
              response=$(curl -s -w "%{http_code}" \
                -X POST \
                -H "Authorization: Bearer $SECRET_KEY" \
                -H "Content-Type: application/json" \
                http://nft-auth-service.default.svc.cluster.local/admin/generate-holders)
              
              http_code="${response: -3}"
              response_body="${response%???}"
              
              echo "HTTP Status: $http_code"
              echo "Response: $response_body"
              
              if [ "$http_code" = "200" ]; then
                echo "✅ Holder list generation completed successfully"
                
                # Also call the status endpoint to verify
                status_response=$(curl -s \
                  -H "Authorization: Bearer $SECRET_KEY" \
                  http://nft-auth-service.default.svc.cluster.local/admin/holders)
                
                echo "Status check: $status_response"
                exit 0
              else
                echo "❌ Holder list generation failed with status $http_code"
                echo "Response: $response_body"
                exit 1
              fi
            volumeMounts:
            - name: secret-key
              mountPath: /etc/secrets
              readOnly: true
            resources:
              requests:
                memory: "32Mi"
                cpu: "50m"
              limits:
                memory: "64Mi"
                cpu: "100m"
          volumes:
          - name: secret-key
            secret:
              secretName: nft-auth-config
              items:
              - key: secret-key
                path: secret-key