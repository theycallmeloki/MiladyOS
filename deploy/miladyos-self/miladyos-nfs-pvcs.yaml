# Static TrueNAS NFS claims for the in-cluster MiladyOS CI stack.
# RWX is required because the blue/green controller keeps both ReplicaSets alive
# briefly during staged replacement. Old Longhorn PVCs remain for rollback.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: miladyos-home-nfs
spec:
  capacity: { storage: 30Gi }
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: ["nfsvers=4.1", "hard", "timeo=600", "retrans=2"]
  nfs: { server: 192.168.1.99, path: /mnt/neochibistore/k8s-registry/miladyos-home }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: miladyos-home-nfs
  namespace: miladyos
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: ""
  volumeName: miladyos-home-nfs
  resources: { requests: { storage: 30Gi } }
---
