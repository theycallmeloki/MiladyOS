apiVersion: apps/v1
kind: Deployment
metadata:
  name: ups-exporter
  namespace: monitoring
  labels:
    app: ups-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ups-exporter
  template:
    metadata:
      labels:
        app: ups-exporter
    spec:
      containers:
      - name: ups-exporter
        image: python:3.11-slim
        ports:
        - containerPort: 8000
          name: metrics
        env:
        - name: HA_URL
          value: "http://homeassistant.homeassistant.svc.cluster.local:8123"
        - name: HA_TOKEN
          valueFrom:
            secretKeyRef:
              name: wiz-exporter-secret  # Reuse the same HA token
              key: HASS_TOKEN
        command: ["/bin/bash", "-c"]
        args:
          - |
            pip install prometheus_client requests
            python /app/ups_exporter.py
        volumeMounts:
        - name: script
          mountPath: /app
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: script
        configMap:
          name: ups-exporter-script