apiVersion: v1
kind: ConfigMap
metadata:
  name: ups-exporter-script
  namespace: monitoring
data:
  ups_exporter.py: |
    #!/usr/bin/env python3
    import os
    import time
    import requests
    import logging
    from prometheus_client import start_http_server, Gauge, Info
    
    # Configure logging
    logging.basicConfig(
        level=logging.INFO,
        format='%(asctime)s - %(levelname)s - %(message)s'
    )
    logger = logging.getLogger(__name__)
    
    # Home Assistant configuration
    HA_URL = os.getenv('HA_URL', 'http://homeassistant.homeassistant.svc.cluster.local:8123')
    HA_TOKEN = os.getenv('HA_TOKEN', '')
    
    # Headers for HA API
    headers = {
        'Authorization': f'Bearer {HA_TOKEN}',
        'Content-Type': 'application/json'
    }
    
    # Prometheus metrics
    ups_info = Info('ups_info', 'UPS information', ['ups_name'])
    ups_status = Gauge('ups_status', 'UPS status (1=online, 0=on battery)', ['ups_name'])
    ups_battery_charge = Gauge('ups_battery_charge', 'Battery charge percentage', ['ups_name'])
    ups_battery_runtime = Gauge('ups_battery_runtime', 'Battery runtime in seconds', ['ups_name'])
    ups_load = Gauge('ups_load', 'UPS load percentage', ['ups_name'])
    ups_input_voltage = Gauge('ups_input_voltage', 'Input voltage', ['ups_name'])
    ups_output_voltage = Gauge('ups_output_voltage', 'Output voltage', ['ups_name'])
    ups_temperature = Gauge('ups_temperature', 'UPS temperature in Celsius', ['ups_name'])
    ups_power_nominal = Gauge('ups_power_nominal', 'Nominal power in watts', ['ups_name'])
    
    # Entity mappings for NUT integration in Home Assistant
    UPS_ENTITIES = {
        'microtek': {
            'status': 'sensor.microtek_status',
            'battery_charge': 'sensor.microtek_battery_charge',
            'battery_runtime': 'sensor.microtek_battery_runtime', 
            'load': 'sensor.microtek_load',
            'input_voltage': 'sensor.microtek_input_voltage',
            'output_voltage': 'sensor.microtek_output_voltage',
            'temperature': 'sensor.microtek_temperature',
            'power_nominal': 'sensor.microtek_nominal_power',
            'model': 'sensor.microtek_model',
            'firmware': 'sensor.microtek_firmware'
        }
    }
    
    def get_entity_state(entity_id):
        """Get entity state from Home Assistant"""
        try:
            response = requests.get(
                f"{HA_URL}/api/states/{entity_id}",
                headers=headers,
                timeout=10
            )
            if response.status_code == 200:
                data = response.json()
                return data.get('state'), data.get('attributes', {})
            else:
                logger.warning(f"Failed to get entity {entity_id}: {response.status_code}")
                return None, {}
        except Exception as e:
            logger.error(f"Error getting entity {entity_id}: {e}")
            return None, {}
    
    def update_metrics():
        """Update Prometheus metrics from Home Assistant"""
        for ups_name, entities in UPS_ENTITIES.items():
            logger.info(f"Updating metrics for UPS: {ups_name}")
            
            # Get UPS info
            model_state, _ = get_entity_state(entities.get('model', ''))
            firmware_state, _ = get_entity_state(entities.get('firmware', ''))
            if model_state:
                ups_info.labels(ups_name=ups_name).info({
                    'model': model_state or 'unknown',
                    'firmware': firmware_state or 'unknown'
                })
            
            # Get status (OL = Online, OB = On Battery)
            status_state, _ = get_entity_state(entities['status'])
            if status_state:
                ups_status.labels(ups_name=ups_name).set(1 if status_state == 'OL' else 0)
            
            # Get numeric values
            for metric_name, entity_key in [
                ('battery_charge', 'battery_charge'),
                ('load', 'load'),
                ('input_voltage', 'input_voltage'),
                ('output_voltage', 'output_voltage'),
                ('temperature', 'temperature'),
                ('power_nominal', 'power_nominal')
            ]:
                entity_id = entities.get(entity_key)
                if entity_id:
                    state, attrs = get_entity_state(entity_id)
                    if state and state != 'unavailable':
                        try:
                            value = float(state)
                            if metric_name == 'battery_charge':
                                ups_battery_charge.labels(ups_name=ups_name).set(value)
                            elif metric_name == 'load':
                                ups_load.labels(ups_name=ups_name).set(value)
                            elif metric_name == 'input_voltage':
                                ups_input_voltage.labels(ups_name=ups_name).set(value)
                            elif metric_name == 'output_voltage':
                                ups_output_voltage.labels(ups_name=ups_name).set(value)
                            elif metric_name == 'temperature':
                                ups_temperature.labels(ups_name=ups_name).set(value)
                            elif metric_name == 'power_nominal':
                                ups_power_nominal.labels(ups_name=ups_name).set(value)
                        except ValueError:
                            logger.warning(f"Could not parse {metric_name} value: {state}")
            
            # Battery runtime (convert from seconds)
            runtime_entity = entities.get('battery_runtime')
            if runtime_entity:
                state, _ = get_entity_state(runtime_entity)
                if state and state != 'unavailable':
                    try:
                        runtime = float(state)
                        ups_battery_runtime.labels(ups_name=ups_name).set(runtime)
                    except ValueError:
                        logger.warning(f"Could not parse runtime value: {state}")
    
    def main():
        if not HA_TOKEN:
            logger.error("HA_TOKEN environment variable not set!")
            return
        
        # Start Prometheus metrics server
        start_http_server(8000)
        logger.info("Started Prometheus metrics server on port 8000")
        
        # Main loop
        while True:
            try:
                update_metrics()
            except Exception as e:
                logger.error(f"Error updating metrics: {e}")
            
            time.sleep(30)  # Update every 30 seconds
    
    if __name__ == '__main__':
        main()