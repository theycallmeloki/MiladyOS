apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-tools
  namespace: mcp-tools
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-tools
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "namespaces", "nodes",
               "persistentvolumeclaims", "persistentvolumes", "configmaps",
               "secrets", "events", "replicationcontrollers"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-tools
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-tools
subjects:
- kind: ServiceAccount
  name: mcp-tools
  namespace: mcp-tools
