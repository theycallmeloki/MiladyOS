apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-tools-server
  namespace: mcp-tools
data:
  server.js: |
    #!/usr/bin/env node
    /**
     * MiladyOS MCP Tool Server
     * Exposes kubectl, bash, file, and Mattermost operations as MCP tools over SSE.
     */

    const { execSync } = require('child_process');
    const fs   = require('fs');
    const path = require('path');
    const http  = require('http');
    const https = require('https');
    const { URL } = require('url');

    const PORT       = parseInt(process.env.PORT || '3000');
    const MM_URL     = process.env.MATTERMOST_URL  || 'http://mattermost.mattermost.svc.cluster.local:8065';
    const MM_TOKEN   = process.env.MATTERMOST_BOT_TOKEN || '';
    const SCRATCH    = '/tmp/fleet-scratch';

    // Ensure scratch dir exists on startup
    fs.mkdirSync(SCRATCH, { recursive: true });

    // --- Tool definitions ---
    const TOOLS = [
      {
        name: 'bash_exec',
        description: 'Execute a shell command in an isolated scratch workspace (/tmp/fleet-scratch). Has kubectl, curl, git, jq, and standard Linux tools. Use for running scripts, cloning repos, processing files, installing packages. stdout+stderr are combined. Output may be truncated — use head/tail/grep to get specific sections of large output.',
        inputSchema: {
          type: 'object',
          properties: {
            cmd:     { type: 'string', description: 'Shell command to run' },
            timeout: { type: 'number', description: 'Timeout ms (default 60000)', default: 60000 }
          },
          required: ['cmd']
        }
      },
      {
        name: 'file_read',
        description: 'Read a file from the scratch workspace (/tmp/fleet-scratch/). For large files use bash_exec with head/tail/grep instead.',
        inputSchema: {
          type: 'object',
          properties: {
            path: { type: 'string', description: 'File path relative to /tmp/fleet-scratch/' }
          },
          required: ['path']
        }
      },
      {
        name: 'file_write',
        description: 'Write (or overwrite) a file in the scratch workspace (/tmp/fleet-scratch/). Parent directories are created automatically.',
        inputSchema: {
          type: 'object',
          properties: {
            path:    { type: 'string', description: 'File path relative to /tmp/fleet-scratch/' },
            content: { type: 'string', description: 'Content to write' }
          },
          required: ['path', 'content']
        }
      },
      {
        name: 'mattermost_upload',
        description: 'Upload a file from the scratch workspace to a Mattermost channel, with an optional message.',
        inputSchema: {
          type: 'object',
          properties: {
            channel:   { type: 'string', description: 'Channel name (e.g. fleet-ops)' },
            file_path: { type: 'string', description: 'File path relative to /tmp/fleet-scratch/' },
            message:   { type: 'string', description: 'Optional message to accompany the file', default: '' }
          },
          required: ['channel', 'file_path']
        }
      },
      {
        name: 'queue_task',
        description: 'Queue a follow-up task for the fleet agent to process asynchronously. Use for deferred or chained work that the agent should do later.',
        inputSchema: {
          type: 'object',
          properties: {
            instruction: { type: 'string', description: 'Task instruction for the agent' },
            channel:     { type: 'string', description: 'Channel context (default: fleet-ops)', default: 'fleet-ops' }
          },
          required: ['instruction']
        }
      },
      {
        name: 'kubectl_get',
        description: 'Run kubectl get on a resource. Returns a human-readable table by default (wide). Use output="json" only when you need machine-readable detail.',
        inputSchema: {
          type: 'object',
          properties: {
            resource:       { type: 'string', description: 'Resource type, e.g. pods, nodes, deployments' },
            namespace:      { type: 'string', description: 'Namespace (omit for cluster-scoped or all-namespaces)' },
            all_namespaces: { type: 'boolean', description: 'If true, query all namespaces' },
            name:           { type: 'string', description: 'Specific resource name (optional)' },
            output:         { type: 'string', description: 'Output format: wide (default), json, yaml, name', default: 'wide' }
          },
          required: ['resource']
        }
      },
      {
        name: 'kubectl_describe',
        description: 'Describe a Kubernetes resource for detailed status and events.',
        inputSchema: {
          type: 'object',
          properties: {
            resource:  { type: 'string', description: 'Resource type' },
            name:      { type: 'string', description: 'Resource name' },
            namespace: { type: 'string', description: 'Namespace' }
          },
          required: ['resource', 'name']
        }
      },
      {
        name: 'kubectl_logs',
        description: 'Get logs from a pod.',
        inputSchema: {
          type: 'object',
          properties: {
            pod:       { type: 'string', description: 'Pod name' },
            namespace: { type: 'string', description: 'Namespace' },
            container: { type: 'string', description: 'Container name (optional)' },
            tail:      { type: 'number', description: 'Number of lines from end (default 50)', default: 50 }
          },
          required: ['pod']
        }
      },
      {
        name: 'kubectl_apply',
        description: 'Apply a Kubernetes manifest (YAML or JSON string).',
        inputSchema: {
          type: 'object',
          properties: {
            manifest: { type: 'string', description: 'YAML/JSON manifest to apply' },
            dry_run:  { type: 'boolean', description: 'If true, use --dry-run=client', default: false }
          },
          required: ['manifest']
        }
      },
      {
        name: 'kubectl_delete',
        description: 'Delete a Kubernetes resource. Use with care.',
        inputSchema: {
          type: 'object',
          properties: {
            resource:  { type: 'string', description: 'Resource type' },
            name:      { type: 'string', description: 'Resource name' },
            namespace: { type: 'string', description: 'Namespace' }
          },
          required: ['resource', 'name']
        }
      },
      {
        name: 'mattermost_post',
        description: 'Post a message to a Mattermost channel by name (e.g. fleet-ops, heartbeat, alerts).',
        inputSchema: {
          type: 'object',
          properties: {
            channel: { type: 'string', description: 'Channel name (without #)' },
            message: { type: 'string', description: 'Message text (Markdown supported)' }
          },
          required: ['channel', 'message']
        }
      },
      {
        name: 'launch_rlm_job',
        description: 'Launch an RLM job to solve a complex task using iterative Python code execution in Kubernetes. Runs async and posts results to Mattermost when done. Use for computation, data analysis, or multi-step code tasks.',
        inputSchema: {
          type: 'object',
          properties: {
            prompt:          { type: 'string', description: 'Task for the RLM agent to solve via Python' },
            notify_channel:  { type: 'string', description: 'Mattermost channel for results (default: fleet-ops)', default: 'fleet-ops' },
            max_iterations:  { type: 'number', description: 'Max RLM iterations (default: 10, max: 30)', default: 10 }
          },
          required: ['prompt']
        }
      }
    ];

    // --- Mattermost API helper ---
    function mmApi(method, apiPath, body) {
      return new Promise((resolve, reject) => {
        const u = new URL(MM_URL + apiPath);
        const isHttps = u.protocol === 'https:';
        const payload = body ? JSON.stringify(body) : null;
        const opts = {
          hostname: u.hostname,
          port: u.port || (isHttps ? 443 : 80),
          path: u.pathname + u.search,
          method,
          headers: {
            'Authorization': `Bearer ${MM_TOKEN}`,
            'Content-Type': 'application/json',
            ...(payload ? { 'Content-Length': Buffer.byteLength(payload) } : {})
          }
        };
        const lib = isHttps ? https : http;
        const req = lib.request(opts, res => {
          let data = '';
          res.on('data', d => data += d);
          res.on('end', () => {
            try { resolve({ status: res.statusCode, body: JSON.parse(data) }); }
            catch { resolve({ status: res.statusCode, body: data }); }
          });
        });
        req.on('error', reject);
        if (payload) req.write(payload);
        req.end();
      });
    }

    // Channel name → ID cache
    let teamId = null;
    const channelCache = {};
    async function resolveChannel(name) {
      if (channelCache[name]) return channelCache[name];
      if (!teamId) {
        const tr = await mmApi('GET', '/api/v4/teams/name/milady');
        if (tr.status !== 200 || !tr.body.id) throw new Error(`Team not found (status ${tr.status})`);
        teamId = tr.body.id;
      }
      const r = await mmApi('GET', `/api/v4/teams/${teamId}/channels/name/${name}`);
      if (r.status === 200 && r.body.id) {
        channelCache[name] = r.body.id;
        return r.body.id;
      }
      throw new Error(`Channel not found: ${name} (status ${r.status})`);
    }

    // Safe path resolution within scratch dir
    function scratchPath(rel) {
      const resolved = path.resolve(SCRATCH, rel.replace(/^\/+/, ''));
      if (!resolved.startsWith(SCRATCH)) throw new Error('Path traversal not allowed');
      return resolved;
    }

    // Simple sync runner for kubectl commands
    function run(cmd, opts = {}) {
      try {
        const out = execSync(cmd, { encoding: 'utf8', timeout: 30000, ...opts });
        return { ok: true, output: out.trim() };
      } catch (e) {
        const out = [e.stdout, e.stderr].filter(Boolean).map(s => s.trim()).join('\n');
        return { ok: false, output: out || e.message };
      }
    }

    function executeTool(name, args) {
      switch (name) {

        case 'bash_exec': {
          const timeout = Math.min(args.timeout || 60000, 120000);
          try {
            const out = execSync(args.cmd, {
              encoding: 'utf8',
              timeout,
              cwd: SCRATCH,
              env: { ...process.env },
              shell: '/bin/bash'
            });
            const trimmed = out.trim();
            return trimmed.slice(-4000) || '(no output)';
          } catch (e) {
            const combined = [e.stdout, e.stderr].filter(Boolean).map(s => s.trim()).join('\n');
            return (combined || e.message).slice(-4000);
          }
        }

        case 'file_read': {
          try {
            const fp = scratchPath(args.path);
            if (!fs.existsSync(fp)) return `File not found: ${args.path}`;
            const content = fs.readFileSync(fp, 'utf8');
            // Return last 4000 chars if large, with a note
            if (content.length > 4000) {
              return `[file truncated — showing last 4000 of ${content.length} chars]\n` + content.slice(-4000);
            }
            return content;
          } catch (e) {
            return `Error reading file: ${e.message}`;
          }
        }

        case 'file_write': {
          try {
            const fp = scratchPath(args.path);
            fs.mkdirSync(path.dirname(fp), { recursive: true });
            fs.writeFileSync(fp, args.content, 'utf8');
            return `Wrote ${args.content.length} chars to ${args.path}`;
          } catch (e) {
            return `Error writing file: ${e.message}`;
          }
        }

        case 'mattermost_upload': {
          try {
            const fp = scratchPath(args.file_path);
            if (!fs.existsSync(fp)) return `File not found: ${args.file_path}`;
            return resolveChannel(args.channel).then(channelId => {
              // Upload via curl (multipart)
              const uploadOut = execSync(
                `curl -s -X POST ` +
                `-H "Authorization: Bearer ${MM_TOKEN}" ` +
                `-F "files=@${fp}" -F "channel_id=${channelId}" ` +
                `"${MM_URL}/api/v4/files"`,
                { encoding: 'utf8', timeout: 30000 }
              );
              const uploadData = JSON.parse(uploadOut);
              const fileId = uploadData.file_infos?.[0]?.id;
              if (!fileId) return `Upload failed: ${uploadOut.slice(0, 200)}`;
              // Post with attachment
              return mmApi('POST', '/api/v4/posts', {
                channel_id: channelId,
                message: args.message || '',
                file_ids: [fileId]
              }).then(r => {
                if (r.status === 201) return `Uploaded ${path.basename(fp)} to #${args.channel}`;
                return `Post failed (${r.status}): ${JSON.stringify(r.body).slice(0, 200)}`;
              });
            }).catch(e => `Error: ${e.message}`);
          } catch (e) {
            return `Error: ${e.message}`;
          }
        }

        case 'queue_task': {
          const item = JSON.stringify({
            type: 'task',
            instruction: args.instruction,
            channel: args.channel || 'fleet-ops',
            ts: new Date().toISOString()
          });
          try {
            execSync(
              'kubectl exec -n fleet-agent deployment/fleet-agent -c fleet-agent -i -- sh -c "cat >> /data/queue/queue.jsonl"',
              { input: item + '\n', encoding: 'utf8', timeout: 10000 }
            );
            return `Task queued for #${args.channel || 'fleet-ops'}`;
          } catch (e) {
            return `Error queuing task: ${e.stderr ? e.stderr.trim() : e.message}`;
          }
        }

        case 'kubectl_get': {
          let cmd = `kubectl get ${args.resource}`;
          if (args.name) cmd += ` ${args.name}`;
          if (args.all_namespaces) cmd += ' --all-namespaces';
          else if (args.namespace) cmd += ` -n ${args.namespace}`;
          cmd += ` -o ${args.output || 'wide'}`;
          const r = run(cmd);
          return r.output;
        }

        case 'kubectl_describe': {
          let cmd = `kubectl describe ${args.resource} ${args.name}`;
          if (args.namespace) cmd += ` -n ${args.namespace}`;
          const r = run(cmd);
          return r.output;
        }

        case 'kubectl_logs': {
          let cmd = `kubectl logs ${args.pod}`;
          if (args.namespace) cmd += ` -n ${args.namespace}`;
          if (args.container) cmd += ` -c ${args.container}`;
          cmd += ` --tail=${args.tail || 50}`;
          const r = run(cmd);
          return r.output;
        }

        case 'kubectl_apply': {
          try {
            const dryRun = args.dry_run ? '--dry-run=client' : '';
            const out = execSync(`kubectl apply ${dryRun} -f -`, {
              input: args.manifest, encoding: 'utf8', timeout: 30000
            });
            return out.trim();
          } catch (e) {
            return e.stderr ? e.stderr.trim() : e.message;
          }
        }

        case 'kubectl_delete': {
          let cmd = `kubectl delete ${args.resource} ${args.name}`;
          if (args.namespace) cmd += ` -n ${args.namespace}`;
          const r = run(cmd);
          return r.output;
        }

        case 'mattermost_post': {
          return resolveChannel(args.channel)
            .then(channelId => mmApi('POST', '/api/v4/posts', {
              channel_id: channelId,
              message: args.message
            }))
            .then(r => {
              if (r.status === 201) return `Posted to #${args.channel}`;
              return `Error ${r.status}: ${JSON.stringify(r.body)}`;
            })
            .catch(e => `Error: ${e.message}`);
        }

        case 'launch_rlm_job': {
          const jobName = `rlm-${Date.now().toString(36)}`;
          const manifest = JSON.stringify({
            apiVersion: 'rlm.io/v1alpha1', kind: 'RLMJob',
            metadata: { name: jobName, namespace: 'rlm-system' },
            spec: {
              backend: 'openai',
              backendKwargs: {
                model_name: 'fleet-agent',
                base_url: 'http://litellm-proxy.default.svc.cluster.local:4000/v1'
              },
              backendSecret: 'rlm-litellm-secret',
              prompt: args.prompt,
              maxIterations: Math.min(args.max_iterations || 10, 30),
              notifyChannel: args.notify_channel || 'fleet-ops'
            }
          });
          try {
            const out = execSync('kubectl apply -f -', { input: manifest, encoding: 'utf8', timeout: 30000 });
            return `RLM job launched: **${jobName}**\n${out.trim()}\nResults → #${args.notify_channel || 'fleet-ops'}`;
          } catch (e) {
            return `Error launching RLM job: ${e.stderr ? e.stderr.trim() : e.message}`;
          }
        }

        default:
          return `Unknown tool: ${name}`;
      }
    }

    // --- MCP over SSE HTTP server ---
    const clients = new Map();

    function sendEvent(res, event, data) {
      res.write(`event: ${event}\ndata: ${JSON.stringify(data)}\n\n`);
    }

    const server = http.createServer((req, res) => {
      const url = new URL(req.url, `http://localhost`);

      if (url.pathname === '/health') {
        res.writeHead(200, { 'Content-Type': 'application/json' });
        res.end(JSON.stringify({ status: 'ok', tools: TOOLS.length }));
        return;
      }

      if (url.pathname === '/tools' && req.method === 'GET') {
        res.writeHead(200, { 'Content-Type': 'application/json' });
        res.end(JSON.stringify({ tools: TOOLS }));
        return;
      }

      if (url.pathname === '/sse' && req.method === 'GET') {
        const sessionId = Math.random().toString(36).slice(2);
        res.writeHead(200, {
          'Content-Type': 'text/event-stream',
          'Cache-Control': 'no-cache',
          'Connection': 'keep-alive',
          'Access-Control-Allow-Origin': '*'
        });
        clients.set(sessionId, res);
        sendEvent(res, 'endpoint', { uri: `/message?sessionId=${sessionId}` });
        const hb = setInterval(() => res.write(': ping\n\n'), 15000);
        req.on('close', () => { clearInterval(hb); clients.delete(sessionId); });
        return;
      }

      if (url.pathname === '/message' && req.method === 'POST') {
        const sessionId = url.searchParams.get('sessionId');
        const clientRes = clients.get(sessionId);
        let body = '';
        req.on('data', d => body += d);
        req.on('end', () => {
          res.writeHead(202); res.end();
          let msg;
          try { msg = JSON.parse(body); } catch { return; }
          const { id, method, params } = msg;
          if (method === 'initialize') {
            if (clientRes) sendEvent(clientRes, 'message', {
              jsonrpc: '2.0', id,
              result: {
                protocolVersion: '2024-11-05',
                capabilities: { tools: {} },
                serverInfo: { name: 'miladyos-mcp-tools', version: '2.0.0' }
              }
            });
          } else if (method === 'tools/list') {
            if (clientRes) sendEvent(clientRes, 'message', { jsonrpc: '2.0', id, result: { tools: TOOLS } });
          } else if (method === 'tools/call') {
            const { name, arguments: args } = params;
            Promise.resolve()
              .then(() => executeTool(name, args || {}))
              .catch(e => `Error: ${e.message}`)
              .then(result => {
                if (clientRes) sendEvent(clientRes, 'message', {
                  jsonrpc: '2.0', id,
                  result: { content: [{ type: 'text', text: String(result) }] }
                });
              });
          } else if (method === 'notifications/initialized') {
            // no-op
          } else {
            if (clientRes) sendEvent(clientRes, 'message', {
              jsonrpc: '2.0', id,
              error: { code: -32601, message: `Method not found: ${method}` }
            });
          }
        });
        return;
      }

      res.writeHead(404); res.end();
    });

    server.listen(PORT, () => {
      console.log(`MiladyOS MCP Tool Server running on port ${PORT}`);
      console.log(`Tools: ${TOOLS.map(t => t.name).join(', ')}`);
    });
