apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-tools-server
  namespace: mcp-tools
data:
  server.js: |
    #!/usr/bin/env node
    /**
     * MiladyOS MCP Tool Server
     * Exposes kubectl + tmux operations as MCP tools over SSE transport.
     * Connects to the shared 'milady' tmux session in gotty-dev namespace.
     */

    const { execSync, exec } = require('child_process');
    const http = require('http');
    const https = require('https');
    const { URL } = require('url');

    const PORT = parseInt(process.env.PORT || '3000');
    const GOTTY_NS = process.env.GOTTY_POD_NAMESPACE || 'gotty-dev';
    const TMUX_SESSION = 'milady';
    const MM_URL   = process.env.MATTERMOST_URL || 'http://mattermost.mattermost.svc.cluster.local:8065';
    const MM_TOKEN = process.env.MATTERMOST_BOT_TOKEN || '';

    // --- Tool definitions (MCP schema) ---
    const TOOLS = [
      {
        name: 'tmux_run',
        description: 'Run a shell command in the shared milady tmux session and return output. Visible to anyone watching the GoTTY terminal.',
        inputSchema: {
          type: 'object',
          properties: {
            cmd: { type: 'string', description: 'Shell command to run' },
            pane: { type: 'string', description: 'Tmux pane target (default: milady)', default: TMUX_SESSION }
          },
          required: ['cmd']
        }
      },
      {
        name: 'tmux_split',
        description: 'Split the tmux window horizontally or vertically.',
        inputSchema: {
          type: 'object',
          properties: {
            direction: { type: 'string', enum: ['horizontal', 'vertical'], description: 'horizontal = side by side, vertical = top/bottom' }
          },
          required: ['direction']
        }
      },
      {
        name: 'tmux_select',
        description: 'Select (focus) a tmux pane by index.',
        inputSchema: {
          type: 'object',
          properties: {
            pane: { type: 'number', description: 'Pane index (0-based)' }
          },
          required: ['pane']
        }
      },
      {
        name: 'tmux_capture',
        description: 'Capture and return the current content of a tmux pane.',
        inputSchema: {
          type: 'object',
          properties: {
            pane: { type: 'number', description: 'Pane index (0-based, default 0)', default: 0 }
          }
        }
      },
      {
        name: 'kubectl_get',
        description: 'Run kubectl get on a resource and return JSON output.',
        inputSchema: {
          type: 'object',
          properties: {
            resource: { type: 'string', description: 'Resource type, e.g. pods, nodes, deployments' },
            namespace: { type: 'string', description: 'Namespace (omit for cluster-scoped or --all-namespaces)' },
            all_namespaces: { type: 'boolean', description: 'If true, query all namespaces' },
            name: { type: 'string', description: 'Specific resource name (optional)' }
          },
          required: ['resource']
        }
      },
      {
        name: 'kubectl_describe',
        description: 'Describe a Kubernetes resource for detailed status and events.',
        inputSchema: {
          type: 'object',
          properties: {
            resource: { type: 'string', description: 'Resource type' },
            name: { type: 'string', description: 'Resource name' },
            namespace: { type: 'string', description: 'Namespace' }
          },
          required: ['resource', 'name']
        }
      },
      {
        name: 'kubectl_logs',
        description: 'Get logs from a pod.',
        inputSchema: {
          type: 'object',
          properties: {
            pod: { type: 'string', description: 'Pod name' },
            namespace: { type: 'string', description: 'Namespace' },
            container: { type: 'string', description: 'Container name (optional)' },
            tail: { type: 'number', description: 'Number of lines from end (default 100)', default: 100 }
          },
          required: ['pod']
        }
      },
      {
        name: 'kubectl_apply',
        description: 'Apply a Kubernetes manifest (YAML string).',
        inputSchema: {
          type: 'object',
          properties: {
            manifest: { type: 'string', description: 'YAML manifest to apply' },
            dry_run: { type: 'boolean', description: 'If true, use --dry-run=client', default: false }
          },
          required: ['manifest']
        }
      },
      {
        name: 'kubectl_delete',
        description: 'Delete a Kubernetes resource. Use with care.',
        inputSchema: {
          type: 'object',
          properties: {
            resource: { type: 'string', description: 'Resource type' },
            name: { type: 'string', description: 'Resource name' },
            namespace: { type: 'string', description: 'Namespace' }
          },
          required: ['resource', 'name']
        }
      },
      {
        name: 'mattermost_post',
        description: 'Post a message to a Mattermost channel by channel name (e.g. fleet-ops, heartbeat, alerts). Uses the fleet-agent bot account.',
        inputSchema: {
          type: 'object',
          properties: {
            channel: { type: 'string', description: 'Channel name (without #), e.g. fleet-ops, heartbeat, alerts' },
            message: { type: 'string', description: 'Message text (Markdown supported)' }
          },
          required: ['channel', 'message']
        }
      },
      {
        name: 'launch_rlm_job',
        description: 'Launch an RLM (Recursive Language Model) job to solve a complex task using iterative Python code execution in Kubernetes. The job runs asynchronously and posts results to a Mattermost channel when done. Use this for tasks requiring computation, data analysis, or multi-step code execution.',
        inputSchema: {
          type: 'object',
          properties: {
            prompt: { type: 'string', description: 'The task for the RLM agent to solve using Python code execution' },
            notify_channel: { type: 'string', description: 'Mattermost channel to post results to (default: fleet-ops)', default: 'fleet-ops' },
            max_iterations: { type: 'number', description: 'Max RLM iterations (default: 10, max: 30)', default: 10 }
          },
          required: ['prompt']
        }
      }
    ];

    // --- Mattermost API helper ---
    function mmApi(method, path, body) {
      return new Promise((resolve, reject) => {
        const u = new URL(MM_URL + path);
        const isHttps = u.protocol === 'https:';
        const payload = body ? JSON.stringify(body) : null;
        const opts = {
          hostname: u.hostname,
          port: u.port || (isHttps ? 443 : 80),
          path: u.pathname + u.search,
          method,
          headers: {
            'Authorization': `Bearer ${MM_TOKEN}`,
            'Content-Type': 'application/json',
            ...(payload ? { 'Content-Length': Buffer.byteLength(payload) } : {})
          }
        };
        const lib = isHttps ? https : http;
        const req = lib.request(opts, res => {
          let data = '';
          res.on('data', d => data += d);
          res.on('end', () => {
            try { resolve({ status: res.statusCode, body: JSON.parse(data) }); }
            catch { resolve({ status: res.statusCode, body: data }); }
          });
        });
        req.on('error', reject);
        if (payload) req.write(payload);
        req.end();
      });
    }

    // Channel name → ID cache (resolved via team endpoint)
    let teamId = null;
    const channelCache = {};
    async function resolveChannel(name) {
      if (channelCache[name]) return channelCache[name];
      // Look up team ID once
      if (!teamId) {
        const tr = await mmApi('GET', '/api/v4/teams/name/milady');
        if (tr.status !== 200 || !tr.body.id) throw new Error(`Team not found (status ${tr.status})`);
        teamId = tr.body.id;
      }
      const r = await mmApi('GET', `/api/v4/teams/${teamId}/channels/name/${name}`);
      if (r.status === 200 && r.body.id) {
        channelCache[name] = r.body.id;
        return r.body.id;
      }
      throw new Error(`Channel not found: ${name} (status ${r.status})`);
    }

    // --- Tool execution ---
    function run(cmd, opts = {}) {
      try {
        const out = execSync(cmd, { encoding: 'utf8', timeout: 30000, ...opts });
        return { ok: true, output: out.trim() };
      } catch (e) {
        return { ok: false, output: e.stderr ? e.stderr.trim() : e.message };
      }
    }

    function executeTool(name, args) {
      switch (name) {
        case 'tmux_run': {
          const pane = args.pane || TMUX_SESSION;
          // Send keys to tmux session
          run(`tmux send-keys -t ${pane} ${JSON.stringify(args.cmd)} Enter`);
          // Wait briefly for command to run
          execSync('sleep 1');
          // Capture output
          const cap = run(`tmux capture-pane -pt ${pane} -S -20`);
          return cap.output;
        }
        case 'tmux_split': {
          const flag = args.direction === 'horizontal' ? '-h' : '-v';
          const r = run(`tmux split-window ${flag} -t ${TMUX_SESSION}`);
          return r.ok ? `Split ${args.direction} OK` : r.output;
        }
        case 'tmux_select': {
          const r = run(`tmux select-pane -t ${TMUX_SESSION}:0.${args.pane}`);
          return r.ok ? `Selected pane ${args.pane}` : r.output;
        }
        case 'tmux_capture': {
          const pane = args.pane || 0;
          const r = run(`tmux capture-pane -pt ${TMUX_SESSION}:0.${pane} -S -50`);
          return r.output;
        }
        case 'kubectl_get': {
          let cmd = `kubectl get ${args.resource}`;
          if (args.name) cmd += ` ${args.name}`;
          if (args.all_namespaces) cmd += ' --all-namespaces';
          else if (args.namespace) cmd += ` -n ${args.namespace}`;
          cmd += ' -o json';
          const r = run(cmd);
          return r.output;
        }
        case 'kubectl_describe': {
          let cmd = `kubectl describe ${args.resource} ${args.name}`;
          if (args.namespace) cmd += ` -n ${args.namespace}`;
          const r = run(cmd);
          return r.output;
        }
        case 'kubectl_logs': {
          let cmd = `kubectl logs ${args.pod}`;
          if (args.namespace) cmd += ` -n ${args.namespace}`;
          if (args.container) cmd += ` -c ${args.container}`;
          cmd += ` --tail=${args.tail || 100}`;
          const r = run(cmd);
          return r.output;
        }
        case 'kubectl_apply': {
          const { execSync: es } = require('child_process');
          try {
            const dryRun = args.dry_run ? '--dry-run=client' : '';
            const out = es(`kubectl apply ${dryRun} -f -`, {
              input: args.manifest,
              encoding: 'utf8',
              timeout: 30000
            });
            return out.trim();
          } catch (e) {
            return e.stderr ? e.stderr.trim() : e.message;
          }
        }
        case 'kubectl_delete': {
          let cmd = `kubectl delete ${args.resource} ${args.name}`;
          if (args.namespace) cmd += ` -n ${args.namespace}`;
          const r = run(cmd);
          return r.output;
        }
        case 'mattermost_post': {
          return resolveChannel(args.channel)
            .then(channelId => mmApi('POST', '/api/v4/posts', {
              channel_id: channelId,
              message: args.message
            }))
            .then(r => {
              if (r.status === 201) return `Posted to #${args.channel}`;
              return `Error ${r.status}: ${JSON.stringify(r.body)}`;
            })
            .catch(e => `Error: ${e.message}`);
        }
        case 'launch_rlm_job': {
          const prompt = args.prompt;
          const notifyChannel = args.notify_channel || 'fleet-ops';
          const maxIterations = Math.min(args.max_iterations || 10, 30);
          const jobName = `rlm-${Date.now().toString(36)}`;
          const manifest = JSON.stringify({
            apiVersion: 'rlm.io/v1alpha1',
            kind: 'RLMJob',
            metadata: { name: jobName, namespace: 'rlm-system' },
            spec: {
              backend: 'openai',
              backendKwargs: {
                model_name: 'fleet-agent',
                base_url: 'http://litellm-proxy.default.svc.cluster.local:4000/v1'
              },
              backendSecret: 'rlm-litellm-secret',
              prompt: prompt,
              maxIterations: maxIterations,
              notifyChannel: notifyChannel
            }
          });
          const { execSync: es } = require('child_process');
          try {
            const out = es('kubectl apply -f -', { input: manifest, encoding: 'utf8', timeout: 30000 });
            return `RLM job launched: **${jobName}**\n${out.trim()}\nResults will be posted to #${notifyChannel} when complete.`;
          } catch (e) {
            return `Error launching RLM job: ${e.stderr ? e.stderr.trim() : e.message}`;
          }
        }
        default:
          return `Unknown tool: ${name}`;
      }
    }

    // --- MCP over SSE HTTP server ---
    // Implements a minimal MCP server: GET /sse opens event stream,
    // POST /message sends JSON-RPC requests.

    const clients = new Map(); // sessionId -> res

    function sendEvent(res, event, data) {
      res.write(`event: ${event}\ndata: ${JSON.stringify(data)}\n\n`);
    }

    const server = http.createServer((req, res) => {
      const url = new URL(req.url, `http://localhost`);

      // Health check
      if (url.pathname === '/health') {
        res.writeHead(200, { 'Content-Type': 'application/json' });
        res.end(JSON.stringify({ status: 'ok', tools: TOOLS.length }));
        return;
      }

      // Tool listing endpoint (convenience)
      if (url.pathname === '/tools' && req.method === 'GET') {
        res.writeHead(200, { 'Content-Type': 'application/json' });
        res.end(JSON.stringify({ tools: TOOLS }));
        return;
      }

      // SSE endpoint — client subscribes here
      if (url.pathname === '/sse' && req.method === 'GET') {
        const sessionId = Math.random().toString(36).slice(2);
        res.writeHead(200, {
          'Content-Type': 'text/event-stream',
          'Cache-Control': 'no-cache',
          'Connection': 'keep-alive',
          'Access-Control-Allow-Origin': '*'
        });
        clients.set(sessionId, res);

        // Send endpoint URL to client
        sendEvent(res, 'endpoint', { uri: `/message?sessionId=${sessionId}` });

        // Heartbeat
        const hb = setInterval(() => res.write(': ping\n\n'), 15000);

        req.on('close', () => {
          clearInterval(hb);
          clients.delete(sessionId);
        });
        return;
      }

      // Message endpoint — receives JSON-RPC from client
      if (url.pathname === '/message' && req.method === 'POST') {
        const sessionId = url.searchParams.get('sessionId');
        const clientRes = clients.get(sessionId);

        let body = '';
        req.on('data', d => body += d);
        req.on('end', () => {
          res.writeHead(202);
          res.end();

          let msg;
          try { msg = JSON.parse(body); } catch { return; }

          const { id, method, params } = msg;

          // Handle MCP protocol methods
          if (method === 'initialize') {
            if (clientRes) sendEvent(clientRes, 'message', {
              jsonrpc: '2.0', id,
              result: {
                protocolVersion: '2024-11-05',
                capabilities: { tools: {} },
                serverInfo: { name: 'miladyos-mcp-tools', version: '1.0.0' }
              }
            });
          } else if (method === 'tools/list') {
            if (clientRes) sendEvent(clientRes, 'message', {
              jsonrpc: '2.0', id,
              result: { tools: TOOLS }
            });
          } else if (method === 'tools/call') {
            const { name, arguments: args } = params;
            Promise.resolve()
              .then(() => executeTool(name, args || {}))
              .catch(e => `Error: ${e.message}`)
              .then(result => {
                if (clientRes) sendEvent(clientRes, 'message', {
                  jsonrpc: '2.0', id,
                  result: {
                    content: [{ type: 'text', text: String(result) }]
                  }
                });
              });
          } else if (method === 'notifications/initialized') {
            // No response needed
          } else {
            if (clientRes) sendEvent(clientRes, 'message', {
              jsonrpc: '2.0', id,
              error: { code: -32601, message: `Method not found: ${method}` }
            });
          }
        });
        return;
      }

      res.writeHead(404);
      res.end();
    });

    server.listen(PORT, () => {
      console.log(`MiladyOS MCP Tool Server running on port ${PORT}`);
      console.log(`Tools: ${TOOLS.map(t => t.name).join(', ')}`);
    });
