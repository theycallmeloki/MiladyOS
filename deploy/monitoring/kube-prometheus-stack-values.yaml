# Prometheus Stack Values - Optimized for MiladyOS
# Includes Prometheus, Grafana, Alertmanager, and exporters

## Grafana configuration
grafana:
  enabled: true
  # Reached through the ingress, which now requires basic auth (milady). What
  # gets past that lands here anonymously as a Viewer: enough to read the
  # dashboards and Explore, not enough to edit datasources, users or dashboards.
  # Signing in with the admin password still gets Admin, which is why the login
  # form and the sign-out menu are enabled again.
  grafana.ini:
    auth:
      disable_login_form: false
      disable_signout_menu: false
    auth.anonymous:
      enabled: true
      org_role: Viewer
    auth.basic:
      enabled: false
  adminPassword: "admin"  # Still the stock password; change it, it gates Admin
  # Grafana holds a ReadWriteOnce PVC, so the default RollingUpdate surges a
  # replacement pod that cannot attach the volume while the old pod still holds
  # it: the new pod sits in Init with a Multi-Attach error and the rollout never
  # finishes. Recreate stops the old pod before starting the new one.
  strategy:
    type: Recreate
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: grafana-basic-auth
      nginx.ingress.kubernetes.io/auth-realm: Grafana
    hosts:
    - grafana.transparentlyrotatableproxy.site
    tls:
    - secretName: grafana-transparentlyrotatableproxy-me-tls
      hosts:
      - grafana.transparentlyrotatableproxy.site
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
    datasources:
      enabled: true
      defaultDatasourceEnabled: true

## Prometheus configuration
prometheus:
  prometheusSpec:
    retention: 365d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    # ServiceMonitor selector to find all monitors
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

## Alertmanager configuration
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

## Node exporter for node metrics
nodeExporter:
  enabled: true

## Kube-state-metrics for Kubernetes metrics
kubeStateMetrics:
  enabled: true

## Disable components we don't need
kubeEtcd:
  enabled: false  # Talos doesn't expose etcd metrics
kubeControllerManager:
  enabled: false  # Talos control plane metrics need special config
kubeScheduler:
  enabled: false  # Talos control plane metrics need special config
kubeProxy:
  enabled: false  # Talos uses kube-proxy-less mode

## Default rules
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubeControllerManager: false
    kubelet: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: false
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
