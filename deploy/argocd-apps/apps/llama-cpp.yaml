apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llama-cpp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/theycallmeloki/MiladyOS
    targetRevision: HEAD
    path: deploy/llama-cpp
  destination:
    server: https://kubernetes.default.svc
    namespace: llama-cpp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
