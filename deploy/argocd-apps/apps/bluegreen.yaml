apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bluegreen-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/theycallmeloki/MiladyOS
    targetRevision: HEAD
    path: deploy/bluegreen/v1
  destination:
    server: https://kubernetes.default.svc
    namespace: metacontroller
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true