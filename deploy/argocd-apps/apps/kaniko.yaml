apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kaniko
  namespace: argocd
spec:
  project: default
  source:
    # In-cluster kaniko build machinery: KanikoBuild CRD, metacontroller
    # composite controller (hook runs on the workstation), registry:2 store,
    # RBAC for Jenkins submission.
    repoURL: https://github.com/theycallmeloki/MiladyOS
    targetRevision: main
    path: deploy/kaniko
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
