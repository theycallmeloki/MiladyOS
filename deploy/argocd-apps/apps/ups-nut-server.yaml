apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ups-nut-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/theycallmeloki/MiladyOS
    targetRevision: HEAD
    path: deploy/ups-nut-server
  destination:
    server: https://kubernetes.default.svc
    namespace: ups-nut
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true