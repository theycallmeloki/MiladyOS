apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: websites-private
  namespace: argocd
spec:
  project: default
  source:
    # Private repository for websites-private business logic
    # Credentials managed in ArgoCD: Applications -> websites-private -> Settings -> Git (Repository Settings)
    repoURL: https://github.com/theycallmeloki/self-hosted-k8s-private.git
    targetRevision: main
    path: deploy/websites
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
