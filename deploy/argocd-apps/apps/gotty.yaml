apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gotty
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/theycallmeloki/MiladyOS
    targetRevision: HEAD
    path: deploy/gotty-dev
    directory:
      include: gotty-dev-pod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: gotty-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true