apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kraken
  namespace: argocd
  labels:
    app.kubernetes.io/name: kraken
    app.kubernetes.io/part-of: miladyos
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/theycallmeloki/MiladyOS
    targetRevision: HEAD
    path: deploy/kraken
  destination:
    server: https://kubernetes.default.svc
    namespace: kraken
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
  info:
    - name: 'Description'
      value: 'Kraken P2P Registry for Nebula Mesh - Decentralized container distribution'
    - name: 'Network'
      value: 'Nebula overlay 192.168.5.0/24'
    - name: 'Discovery'
      value: 'Avahi mDNS _kraken._tcp'