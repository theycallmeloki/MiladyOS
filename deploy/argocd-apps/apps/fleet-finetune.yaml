apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-finetune
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/theycallmeloki/MiladyOS
    targetRevision: HEAD
    path: deploy/fleet-finetune
  destination:
    server: https://kubernetes.default.svc
    namespace: fleet-finetune
  syncPolicy:
    # Manual sync — only run when you have enough training data
    automated: {}
    syncOptions:
    - CreateNamespace=true
