apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snmp
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/laneone/MiladyOS
    targetRevision: HEAD
    path: deploy/snmp
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true