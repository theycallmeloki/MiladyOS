apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-runtime
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/theycallmeloki/MiladyOS
    targetRevision: HEAD
    path: deploy/nvidia-runtime
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
