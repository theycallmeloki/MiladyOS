apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rlm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/theycallmeloki/MiladyOS
    targetRevision: HEAD
    path: deploy/rlm
  destination:
    server: https://kubernetes.default.svc
    namespace: rlm-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
