apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: self-hosted-models
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/theycallmeloki/MiladyOS
    targetRevision: HEAD
    path: deploy/self-hosted-models
  destination:
    server: https://kubernetes.default.svc
    namespace: self-hosted-models
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
