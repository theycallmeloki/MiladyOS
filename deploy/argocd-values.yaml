# ArgoCD Values - GitOps Configuration
# Longhorn is the default StorageClass so PVCs use it automatically

## ArgoCD Server
server:
  replicas: 2

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

  service:
    type: ClusterIP

  ingress:
    enabled: false

## Application Controller - handles GitOps reconciliation
controller:
  replicas: 2

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

## Repository Server - handles Git operations
repoServer:
  replicas: 2

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

## ApplicationSet Controller
applicationSet:
  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

## Notifications Controller
notifications:
  enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

## Redis
redis:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

## Dex (SSO) - disabled for now
dex:
  enabled: false

## RBAC
configs:
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, argocd-admins, role:admin
      g, argocd-developers, role:readonly

  cm:
    application.instanceLabelKey: argocd.argoproj.io/instance
    application.resourceTrackingMethod: annotation

  repositories: {}
