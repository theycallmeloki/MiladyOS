apiVersion: v1
kind: ConfigMap
metadata:
  name: ax-agent-trajectory-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  ax-agent-trajectory.json: |
    {
      "title": "AX Agent Trajectory",
      "uid": "ax-agent-trajectory",
      "tags": ["ax", "agents", "litellm"],
      "timezone": "browser",
      "schemaVersion": 37,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "conversation",
            "label": "Conversation id",
            "type": "textbox",
            "description": "conversation_id to follow. Defaults to all; paste one to narrow to a single agent run. It is a JSON field rather than a Loki label, so it is typed rather than picked.",
            "current": { "text": ".*", "value": ".*" },
            "query": ".*"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "logs",
          "title": "Agent trajectory (prompt → tool call → result → answer)",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 14, "w": 24, "x": 0, "y": 4 },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "prettifyLogMessage": true,
            "enableLogDetails": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"default\", pod=~\"litellm-proxy.*\"} | json | conversation_id != \"\" | conversation_id =~ \"$conversation\"",
              "datasource": { "type": "loki", "uid": "loki" }
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Completions per model",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 18 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (model) (count_over_time({namespace=\"default\", pod=~\"litellm-proxy.*\"} | json | conversation_id != \"\" [5m]))",
              "legendFormat": "{{model}}",
              "datasource": { "type": "loki", "uid": "loki" }
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Tool calls vs plain turns",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 18 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(count_over_time({namespace=\"default\", pod=~\"litellm-proxy.*\"} |= \"has_tool_calls\" [5m]))",
              "legendFormat": "tool calls",
              "datasource": { "type": "loki", "uid": "loki" }
            },
            {
              "refId": "B",
              "expr": "sum(count_over_time({namespace=\"default\", pod=~\"litellm-proxy.*\"} | json | conversation_id != \"\" [5m]))",
              "legendFormat": "all turns",
              "datasource": { "type": "loki", "uid": "loki" }
            }
          ]
        },
        {
          "id": 4,
          "type": "logs",
          "title": "Model errors",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 26 },
          "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending" },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"default\", pod=~\"litellm-proxy.*\"} |= \"error\" | json | conversation_id != \"\"",
              "datasource": { "type": "loki", "uid": "loki" }
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Turns",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "area", "textMode": "value_and_name" },
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "legendFormat": "turns",
              "expr": "sum(count_over_time({namespace=\"default\", pod=~\"litellm-proxy.*\"} | json | conversation_id != \"\" [$__range]))",
              "datasource": { "type": "loki", "uid": "loki" }
            }
          ]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Conversations",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "area", "textMode": "value_and_name" },
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "legendFormat": "conversations",
              "expr": "count(count by (conversation_id) (count_over_time({namespace=\"default\", pod=~\"litellm-proxy.*\"} | json | conversation_id != \"\" [$__range])))",
              "datasource": { "type": "loki", "uid": "loki" }
            }
          ]
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Tool calls",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "area", "textMode": "value_and_name" },
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "legendFormat": "tool calls",
              "expr": "sum(count_over_time({namespace=\"default\", pod=~\"litellm-proxy.*\"} |= \"has_tool_calls\" [$__range]))",
              "datasource": { "type": "loki", "uid": "loki" }
            }
          ]
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Errors",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "area", "textMode": "value_and_name" },
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "legendFormat": "error matches",
              "expr": "sum(count_over_time({namespace=\"default\", pod=~\"litellm-proxy.*\"} |= \"error\" [$__range]))",
              "datasource": { "type": "loki", "uid": "loki" }
            }
          ]
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Average latency",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "ms" }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "area", "textMode": "value_and_name" },
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "legendFormat": "average latency",
              "expr": "avg_over_time({namespace=\"default\", pod=~\"litellm-proxy.*\"} | json | unwrap duration_ms [$__range])",
              "datasource": { "type": "loki", "uid": "loki" }
            }
          ]
        },
        {
          "id": 10,
          "type": "stat",
          "title": "Tokens processed",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 0 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "area", "textMode": "value_and_name" },
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "legendFormat": "tokens",
              "expr": "sum_over_time({namespace=\"default\", pod=~\"litellm-proxy.*\"} | json | unwrap usage_total_tokens [$__range])",
              "datasource": { "type": "loki", "uid": "loki" }
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Parallel activity",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 34 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(count_over_time({namespace=\"default\", pod=~\"litellm-proxy.*\"} [1m]))",
              "legendFormat": "turns / minute",
              "datasource": { "type": "loki", "uid": "loki" }
            },
            {
              "refId": "B",
              "expr": "count(count by (conversation_id) (count_over_time({namespace=\"default\", pod=~\"litellm-proxy.*\"} | json | conversation_id != \"\" [1m])))",
              "legendFormat": "conversations active / minute",
              "datasource": { "type": "loki", "uid": "loki" }
            }
          ]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Conversation lanes (turns / 5m)",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 34 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (conversation_id) (count_over_time({namespace=\"default\", pod=~\"litellm-proxy.*\"} | json | conversation_id != \"\" [5m]))",
              "legendFormat": "{{conversation_id}}",
              "datasource": { "type": "loki", "uid": "loki" }
            }
          ]
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Latency by model",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 42 },
          "fieldConfig": { "defaults": { "unit": "ms" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (model) (avg_over_time({namespace=\"default\", pod=~\"litellm-proxy.*\"} | json | unwrap duration_ms [5m]))",
              "legendFormat": "{{model}}",
              "datasource": { "type": "loki", "uid": "loki" }
            }
          ]
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Tokens by model",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 42 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (model) (sum_over_time({namespace=\"default\", pod=~\"litellm-proxy.*\"} | json | unwrap usage_total_tokens [5m]))",
              "legendFormat": "{{model}}",
              "datasource": { "type": "loki", "uid": "loki" }
            }
          ]
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Tool calls by model",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 50 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (model) (count_over_time({namespace=\"default\", pod=~\"litellm-proxy.*\"} |= \"has_tool_calls\" [5m]))",
              "legendFormat": "{{model}}",
              "datasource": { "type": "loki", "uid": "loki" }
            }
          ]
        },
        {
          "id": 16,
          "type": "table",
          "title": "Recent conversations",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 50 },
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "expr": "count by (conversation_id, model) (count_over_time({namespace=\"default\", pod=~\"litellm-proxy.*\"} | json | conversation_id != \"\" [$__range]))",
              "datasource": { "type": "loki", "uid": "loki" }
            }
          ],
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true }, "renameByName": { "Value #A": "turns", "conversation_id": "conversation", "model": "model" } } }
          ]
        }
      ]
    }
