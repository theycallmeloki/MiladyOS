apiVersion: v1
kind: ConfigMap
metadata:
  name: ax-agent-trajectory-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  ax-agent-trajectory.json: |
    {
      "title": "AX Agent Trajectory",
      "uid": "ax-agent-trajectory",
      "tags": ["ax", "agents", "litellm"],
      "timezone": "browser",
      "schemaVersion": 37,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "conversation",
            "label": "Conversation id",
            "type": "textbox",
            "description": "conversation_id to follow. Defaults to all; paste one to narrow to a single agent run. It is a JSON field rather than a Loki label, so it is typed rather than picked.",
            "current": { "text": ".*", "value": ".*" },
            "query": ".*"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "logs",
          "title": "Agent trajectory (prompt → tool call → result → answer)",
          "datasource": { "type": "loki" },
          "gridPos": { "h": 14, "w": 24, "x": 0, "y": 0 },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "prettifyLogMessage": true,
            "enableLogDetails": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"default\", pod=~\"litellm-proxy.*\"} | json | conversation_id != \"\" | conversation_id =~ \"$conversation\"",
              "datasource": { "type": "loki" }
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Completions per model",
          "datasource": { "type": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (model) (count_over_time({namespace=\"default\", pod=~\"litellm-proxy.*\"} | json | conversation_id != \"\" [5m]))",
              "legendFormat": "{{model}}",
              "datasource": { "type": "loki" }
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Tool calls vs plain turns",
          "datasource": { "type": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(count_over_time({namespace=\"default\", pod=~\"litellm-proxy.*\"} |= \"has_tool_calls\" [5m]))",
              "legendFormat": "tool calls",
              "datasource": { "type": "loki" }
            },
            {
              "refId": "B",
              "expr": "sum(count_over_time({namespace=\"default\", pod=~\"litellm-proxy.*\"} | json | conversation_id != \"\" [5m]))",
              "legendFormat": "all turns",
              "datasource": { "type": "loki" }
            }
          ]
        },
        {
          "id": 4,
          "type": "logs",
          "title": "Model errors",
          "datasource": { "type": "loki" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 22 },
          "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending" },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"default\", pod=~\"litellm-proxy.*\"} |= \"error\" | json | conversation_id != \"\"",
              "datasource": { "type": "loki" }
            }
          ]
        }
      ]
    }
