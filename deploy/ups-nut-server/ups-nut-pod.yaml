apiVersion: v1
kind: Namespace
metadata:
  name: ups-nut
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Pod
metadata:
  name: ups-nut-server
  namespace: ups-nut
  labels:
    app: ups-nut-server
spec:
  hostPID: true
  initContainers:
  - name: nut-setup
    image: python:3.9-slim
    securityContext:
      privileged: true
    volumeMounts:
    - name: usb-devices
      mountPath: /dev/bus/usb
    - name: run-nut
      mountPath: /var/run/nut
    - name: config
      mountPath: /etc/nut
    command: ["/bin/bash", "-c"]
    args:
      - |
        set -euo pipefail
        
        # Install required tools
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y usbutils nut
        
        # Show USB devices
        echo "===== USB Devices ====="
        lsusb
        
        # Create necessary directories with proper permissions
        mkdir -p /var/run/nut /etc/nut
        chmod -R 777 /var/run/nut /etc/nut
        
        # Set permissions for USB device (adjust if needed)
        find /dev/bus/usb -type c -exec chmod 666 {} \; || true
        
        # Configure NUT in standalone mode
        echo "MODE=standalone" > /etc/nut/nut.conf
        
        # Configure UPS
        cat > /etc/nut/ups.conf <<EOF
        [microtek]
        driver = "blazer_usb"
        port = "auto"
        vendorid = "0665"
        productid = "5161"
        desc = "Microtek UPS"
        EOF
        
        # Configure upsd to listen on all interfaces
        echo "LISTEN 0.0.0.0 3493" > /etc/nut/upsd.conf
        
        # Configure users
        cat > /etc/nut/upsd.users <<EOF
        [admin]
          password = upsadmin
          actions = SET
          instcmds = ALL

        [monitor]
          password = upsmonitor
          upsmon master
        EOF
        
        echo "===== NUT configuration completed ====="
  containers:
  - name: nut
    image: untouchedwagons/network-ups-tools:1.0.0
    securityContext:
      privileged: true
    volumeMounts:
    - name: usb-devices
      mountPath: /dev/bus/usb
    - name: run-nut
      mountPath: /var/run/nut
    - name: config
      mountPath: /etc/nut
    ports:
    - containerPort: 3493
      name: nut
      protocol: TCP
    command: ["/bin/bash", "-c"]
    args:
      - |
        # Start the UPS driver
        upsdrvctl start
        sleep 2
        
        # Start the UPS daemon
        upsd
        sleep 2
        
        # Print status
        echo "===== UPS Status ====="
        upsc microtek || echo "Failed to get UPS status"
        
        # Keep container running and show logs
        tail -f /var/log/upsd.log 2>/dev/null || tail -f /dev/null
  nodeSelector:
    kubernetes.io/hostname: talos-qn8-i3a  # Node with the UPS connected
  volumes:
  - name: usb-devices
    hostPath:
      path: /dev/bus/usb
      type: Directory
  - name: run-nut
    emptyDir: {}
  - name: config
    emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ups-nut-server
  namespace: ups-nut
spec:
  selector:
    app: ups-nut-server
  ports:
  - port: 3493
    targetPort: 3493
    name: nut
  type: ClusterIP