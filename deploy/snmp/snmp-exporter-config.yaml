apiVersion: v1
kind: ConfigMap
metadata:
  name: snmp-exporter-config
  namespace: monitoring
data:
  snmp.yml: |
    # TP-Link Omada ER605 Router Configuration
    auths:
      # SNMPv3 auth for TP-Link router
      tplink_v3:
        version: 3
        security_level: authPriv
        username: milady_snmp
        password: SecureMiladyPassword
        auth_protocol: SHA
        priv_protocol: AES
        priv_password: SecureMiladyPassword
      
      # Fallback SNMPv2c
      public_v2:
        version: 2
        community: public
    
    modules:
      # TP-Link router module
      tplink:
        walk:
          - sysDescr
          - sysUpTime
          - sysContact
          - sysName
          - sysLocation
          - interfaces
          - ifXTable
          - hrSystem
          - hrStorage
          - hrDevice
        
      # Default interface module  
      if_mib:
        walk:
          - sysDescr
          - sysUpTime
          - interfaces
          - ifXTable