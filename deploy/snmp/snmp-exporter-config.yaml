apiVersion: v1
kind: ConfigMap
metadata:
  name: snmp-exporter-config
  namespace: monitoring
data:
  snmp.yml: |
    # TP-Link Omada ER605 Router Configuration
    auths:
      # SNMPv3 auth for TP-Link router
      tplink_v3:
        version: 3
        security_level: authPriv
        username: milady_snmp
        password: SecureMiladyPassword
        auth_protocol: SHA
        priv_protocol: AES
        priv_password: SecureMiladyPassword
      
      # Fallback SNMPv2c
      public_v2:
        version: 2
        community: public
    
    modules:
      # TP-Link router module
      tplink:
        walk:
          - 1.3.6.1.2.1.1              # system
          - 1.3.6.1.2.1.2              # interfaces
          - 1.3.6.1.2.1.4              # ip
          - 1.3.6.1.2.1.5              # icmp
          - 1.3.6.1.2.1.6              # tcp
          - 1.3.6.1.2.1.7              # udp
          - 1.3.6.1.2.1.31.1.1         # ifXTable (64-bit counters)
          - 1.3.6.1.2.1.25.1           # hrSystem
          - 1.3.6.1.2.1.25.2           # hrStorage
          - 1.3.6.1.2.1.25.3           # hrDevice
          - 1.3.6.1.4.1.11863          # TP-Link enterprise OID
        lookups:
          - source_indexes: [ifIndex]
            lookup: ifAlias
          - source_indexes: [ifIndex]
            lookup: ifDescr
          - source_indexes: [ifIndex]
            lookup: ifName
          - source_indexes: [hrStorageIndex]
            lookup: hrStorageDescr
          - source_indexes: [hrDeviceIndex]
            lookup: hrDeviceDescr
        overrides:
          ifAlias:
            ignore: true
          ifDescr:
            ignore: true
          ifName:
            ignore: true
          hrStorageDescr:
            ignore: true
          hrDeviceDescr:
            ignore: true
          ifType:
            type: EnumAsInfo
          sysUpTime:
            type: gauge
      
      # Default interface module
      if_mib:
        walk:
          - 1.3.6.1.2.1.2              # interfaces
          - 1.3.6.1.2.1.31.1.1         # ifXTable
        lookups:
          - source_indexes: [ifIndex]
            lookup: ifAlias
          - source_indexes: [ifIndex]
            lookup: ifDescr
          - source_indexes: [ifIndex]
            lookup: ifName
        overrides:
          ifAlias:
            ignore: true
          ifDescr:
            ignore: true
          ifName:
            ignore: true
          ifType:
            type: EnumAsInfo